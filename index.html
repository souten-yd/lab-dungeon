// (T46) 画面比に応じた横方向拡張: 論理幅Wを端末の縦横比に合わせて伸ばす(H=540固定)
// → 横向きのスマホ(19.5:9〜20:9)でもキャンバスが画面全体にぴったり(旧: 16:9レターボックス+左右黒帯)
// ダンジョンの表示域(viewW=W/ZOOM)も横に広がる。タッチUI・パネル・カメラはW基準なので自動追従。
// 上限W_MAX=1280(超ワイドデスクトップでの描画負荷防止)
const W_MAX=1280;
let W_T=0; // (T47) 直近のW拡大時刻(ms)。回転中の旧値縮小を防ぐ単調拡大保証用
let FIT_T=0; // (T47) 直近のfitCanvas実行時刻(ms)。回転直後のヒット判定緩和使用
function fitCanvas(){
  const iw=innerWidth,ih=innerHeight;
  if(iw>0&&ih>0){
    // 16:9(960)以上は端末比で横拡張 / 16:9未満(縦長等)は960で保持(レターボックスは許容範囲)
    const nw=Math.max(960,Math.min(W_MAX,Math.round(H*iw/ih)));
    if(nw!==W){
      // (T47) 回転中、一部のブラウザはinnerWidth/innerHeightを旧値のまま返すことがある。
      // その旧値でWを縮小すると「描画は新W/判定は旧W」のズレが固定される(縦→横で全ボタンズレ=報告症状)。
      // → 直近600ms内にWが拡大した後は縮小を保留し、再実行(fitCanvasNow)で新値確定を待つ(単調拡大保証)。
      if(nw<W&&Date.now()-W_T<600)return;
      W=nw;W_T=Date.now();cv.width=W;ctx.imageSmoothingEnabled=false; // cv.width変更で状態リセットされるためsmoothingも再設定
    }
  }
  const s=Math.min(iw/W,ih/H);
  cv.style.width=(W*s)+"px";cv.style.height=(H*s)+"px";
}
// (T47) 回転ズレ修正: 旧実装はorientationchangeでsetTimeout(150ms)の1回だけ再実行。
// 回転遷移中(ブラウザが旧/中間のwindowサイズを返す数フレーム)にその1回だけ実行されると
// 旧値でW/CSSが確定→描画とタッチ判定(canvasPos)がズレたまま固定された。
// → resize/orientationchangeの両方で即実行+rAF×2と60ms後に確定実行(遷移が落ち着いたら必ず正しく確定する)
function fitCanvasNow(){
  FIT_T=Date.now();
  fitCanvas();
  requestAnimationFrame(function(){requestAnimationFrame(fitCanvas);});
  setTimeout(fitCanvas,60);
}
// (T47) 回転直後300msはタッチヒット判定の許容半径+20%(遷移中のわずかな誤差を吸収)
function touchTol(){return Date.now()-FIT_T<300?1.2:1;}
addEventListener("resize",fitCanvasNow);
addEventListener("orientationchange",fitCanvasNow);
fitCanvas();

// (T47) SFX=Web Audio: <audio>要素を一切使わない
// - 起動時: 何もfetch/decodeしない(Audio要素数=44=ブラウザの同時メディア上限に届かない)
// - 初回ユーザー操作(unlockAudio): AudioContext.resume+全34種のfetch+decodeを非同期実行(タイトル画面で完了)
// - 再生時: createBufferSource()を1発ずつ(同時5本まで重ねOK)=主スレッドfetchスパイクなし・コスト≈0
// (T46までの<code>new Audio()</code>方式は、モバイルで遅延生成時に初回再生の瞬間にfetch+decodeが集中し
// プレイ中のフリーズスパイクになっていた=Web Audioへ全面移行)
const SFX_NAMES=AUD_LIST.filter(function(n){return n.indexOf("sfx_")===0;});
let ACTX=null,SFX_BUF={},sfxPrefetching=false;
function getActx(){
  if(!ACTX){
    try{
      const AC=window.AudioContext||window.webkitAudioContext;
      if(AC)ACTX=new AC();
    }catch(e){ACTX=null;}
  }
  return ACTX;
}
function sfxWarmup(){
  if(sfxPrefetching||SFX_NAMES.length===0)return;
  sfxPrefetching=true;
  if(typeof fetch!=="function")return; // ヘッドレス等fetch無し環境ではno-op
  const ac=getActx();
  if(ac&&ac.resume){try{ac.resume().catch(function(){});}catch(e){}}
  SFX_NAMES.forEach(function(n){
    (function(name){
      fetch("audio/"+name).then(function(r){
        if(!r.ok)throw new Error("http "+r.status);
        return r.arrayBuffer();
      }).then(function(ab){
        if(!ac)return;
        const d=ac.decodeAudioData(ab);
        if(d&&d.then){d.then(function(b){SFX_BUF[name]=b;}).catch(function(){});}
        else try{ac.decodeAudioData(ab,function(b){SFX_BUF[name]=b;},function(){});}catch(e){}
      }).catch(function(){});
    })(n);
  });
}

// ---------- 再生ヘルパ ----------
let bgmNow=null,bgmLoop=false,bgmPending=false;
function tryPlayBgm(){
  if(!bgmNow)return;
  bgmPending=false;
  try{
    const p=bgmNow.play();
    if(p&&p.then)p.then(function(){if(bgmLoop)bgmNow.loop=true;}).catch(function(){bgmPending=true;});
  }catch(e){bgmPending=true;}
  if(bgmLoop)bgmNow.loop=true;
}
// (T44) モバイル自動再生制限: ロード時のplay()拒否を最初のユーザー操作(タップ/キー)で再試行
// (T47) 同一フックでSFXのWeb Audioを起動: AudioContext.resume+全34種prefetch/decode
function unlockAudio(){
  sfxWarmup();
  if(bgmPending)tryPlayBgm();
}
function playBGM(n,loop){
  if(loop===undefined)loop=true;
  const a=AUD[n];
  if(!a||!a.src)return;
  if(bgmNow&&bgmNow!==a){try{bgmNow.pause();}catch(e){}}
  bgmNow=a;bgmLoop=loop;
  try{a.currentTime=0;a.playbackRate=1;}catch(e){}
  if(bgmLoop)a.loop=true;
  tryPlayBgm();
}
function stopBGM(){if(bgmNow){try{bgmNow.pause();}catch(e){}bgmNow=null;}}
// (T37) テーマ別BGM: その階のテーマの3曲からランダム1曲。100Fはボス曲。
function themeBgmName(floor){
  if(floor>=100)return "bgm_boss.ogg";
  const t=Math.min(9,Math.floor((floor-1)/10));
  const v=["a","b","c"][Math.floor(Math.random()*3)];
  return "bgm_dun_"+("0"+t).slice(-2)+"_"+v+".ogg";
}
// (T43) 中ボスBGM: 10F帯ごとに唐揚げ王国崇拝曲(深いほど崇拝度高い)。100F大魔王はbgm_boss.ogg維持
function mbBgmName(floor){
  const b=Math.floor(floor/10);
  if(b<1||b>9)return null;
  return "bgm_mb_0"+b+".ogg";
}
function isMbBgm(n){return !!n&&n.indexOf("bgm_mb_")===0;}
// SFX再生: Web Audio(同時5本まで重ねOK=ターン制の連打対応)
// decode済みAudioBufferからcreateBufferSource()を発射するだけ(主スレッドコスト≈0)
function playSFX(n,rate){
  if(n.indexOf("sfx_")!==0){
    // 非SFX(将来のボイス等)は<code><audio></code>フォールバック
    const a=AUD[n];if(!a||!a.src)return;
    try{a.currentTime=0;a.play().catch(function(){});}catch(e){}
    return;
  }
  const ac=getActx();
  const buf=SFX_BUF[n];
  if(!ac||!buf)return;
  try{
    const src=ac.createBufferSource();
    src.buffer=buf;
    src.playbackRate.value=rate||1;
    src.connect(ac.destination);
    src.start();
  }catch(e){}
}
function playVoice(n){const a=AUD[n];if(!a||!a.src)return;try{a.currentTime=0;a.play().catch(function(){});}catch(e){}}

// ---------- 入力 ----------
const K={},KPHYS={};
// 仮想キー(モバイルタッチ): K = 物理(KPHYS) OR 仮想(VK) として統合
const VK={w:0,a:0,s:0,d:0,z:0,x:0,c:0,v:0,up:0,down:0,left:0,right:0};
const VKCODE={w:"KeyW",a:"KeyA",s:"KeyS",d:"KeyD",z:"KeyZ",x:"KeyX",c:"KeyC",v:"KeyV",up:"ArrowUp",down:"ArrowDown",left:"ArrowLeft",right:"ArrowRight"};
const VKREV={};
for(const k in VKCODE)VKREV[VKCODE[k]]=k;
function mergeVK(){
  // 物理キーは全codeをKに反映(Enter/Space/J/1-3/K/L等も)
  for(const c in KPHYS)K[c]=KPHYS[c];
  // VKCODEキーは 物理 OR 仮想 で決定(仮想キーの解放も反映される)
  for(const k in VKCODE)K[VKCODE[k]]=!!(KPHYS[VKCODE[k]]||VK[k]);
}
addEventListener("keydown",function(e){
  unlockAudio(); // (T44) 物理キー操作でBGM自動再生を解除
  KPHYS[e.code]=true;
  mergeVK();
  if(["Space","ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].indexOf(e.code)>=0)e.preventDefault();
  if(e.code==="Tab"||e.code==="KeyI"){
    e.preventDefault();
    if(G.screen==="dungeon"||G.screen==="town")toggleBag();
    return;
  }
  if((e.code==="KeyP"||e.code==="Escape")&&!e.repeat){ // (T46) OSキーリピート無視: 長押しでポーズ高速トグルするバグ修正
    if(UI.bag){closeBag();return;}
    UI.togglePause();
  }
});
addEventListener("keyup",function(e){
  KPHYS[e.code]=false;
  mergeVK();
});
const KPREV={};
function key(){
  for(let i=0;i<arguments.length;i++)if(K[arguments[i]])return true;
  return false;
}
function keyP(){
  for(let i=0;i<arguments.length;i++)if(K[arguments[i]]&&!KPREV[arguments[i]])return true;
  return false;
}
function syncKeys(){
  for(const c in K)KPREV[c]=K[c];
  for(const c in KPREV)if(!K[c])KPREV[c]=false;
}
let FRAME_DT=1/60;
const REPST={};
function keyR(){
  for(let i=0;i<arguments.length;i++){
    const c=arguments[i];
    if(!K[c]){REPST[c]=0;continue;}
    if(!KPREV[c]){REPST[c]=0;return true;}
    let r=REPST[c];
    r+=FRAME_DT;
    if(r<0.4){REPST[c]=r;continue;}
    r-=0.4;
    if(r>=0.12){REPST[c]=r-0.12;return true;}
    REPST[c]=r;
  }
  return false;
}

// 派生ステータス
function dStats(){
  const s=SAVE,base=s.stats;
  let atk=base.atk,mag=base.mag,def=base.def,spd=base.spd;
  const w=s.equip.weapon&&ALL_ITEMS[s.equip.weapon];
  if(w){atk+=w.atk;mag+=w.mag||0;}
  const a=s.equip.armor&&ALL_ITEMS[s.equip.armor];
  if(a)def+=a.def;
  const r=s.equip.ring&&ALL_ITEMS[s.equip.ring];
  if(r){atk+=r.atk||0;mag+=r.mag||0;def+=r.def||0;spd+=r.spd||0;}
  if(s.job==="hero"&&w){const m=s.mastery[w.id]||0;atk+=m*1.5;mag+=m;}
  if(s.job==="mage"){mag+=Math.min(10,s.magicXp)*1.2;}
  if(s.job==="unjob"){atk+=s.lv*0.4;mag+=s.lv*0.4;}
  // 防具パッシブ(T26)
  const poisonReduction=a&&a.poisonReduction?a.poisonReduction:0; // 風防の鎧: 毒ガス50%減
  const pitReduction=a&&a.pitReduction?a.pitReduction:0;         // 軽戦靴: 穴ダメージ50%減
  const chargeMove=a&&a.chargeMove?a.chargeMove:0;                // 古代の装甲: 溜め中に移動可
  const flight=a&&a.flight?a.flight:0;                            // 飛翔防具: 1=毒/穴無効, 2=+水面
  return {atk:atk,mag:mag,def:def,spd:spd,hpMax:base.hp,mpMax:base.mp,
    poisonReduction:poisonReduction,pitReduction:pitReduction,chargeMove:chargeMove,flight:flight};
}
function xpNeed(lv){return Math.floor(60*Math.pow(lv,1.35));}
function gainXp(n){
  SAVE.xp+=n;
  let lv=SAVE.lv,changed=false;
  while(SAVE.xp>=xpNeed(lv)){
    SAVE.xp-=xpNeed(lv);lv++;changed=true;
    const g=JOBS[SAVE.job].grow;
    SAVE.stats.hp+=g.hp;SAVE.stats.mp+=g.mp;
    SAVE.stats.atk+=g.atk;SAVE.stats.mag+=g.mag;
    SAVE.stats.def+=g.def;SAVE.stats.spd+=g.spd;
  }
  if(changed){
    SAVE.lv=lv;
    const d=dStats();
    SAVE.hp=Math.min(d.hpMax,SAVE.hp+d.hpMax*0.4);
    playSFX("sfx_levelup.ogg");
    UI.toast("レベルアップ! Lv."+lv);
    UI.flashLv=1;
  }
}
function addItem(id,n){
  if(n===undefined)n=1;
  const ex=SAVE.inv.find(function(i){return i.id===id;});
  if(ex)ex.n+=n;else SAVE.inv.push({id:id,n:n});
  const it=ALL_ITEMS[id];
  if(it)UI.toast(it.name+" を入手");
}

// マップ生成 (破綻ゼロ保証: MST接続+BFS検証+フォールバック)
// ============================================================
const WALL=0,FLOOR=1,POISON=2,PIT=3,PILLAR=4,LOCKDOOR=5,WATER=6;
const MAP={grid:null,floor:1,seed:0,rooms:[],entry:null,exit:null,gate:null,savept:null,theme:null,
  trapRoom:null,trapDoor:null,trapSwitch:null,secretWall:null};
function genMap(floor,seed){
  const rng=mulberry32(((seed*7349+floor*104729)|0)>>>0);
  for(let att=0;att<10;att++){
    const g=genAttempt(floor,rng);
    if(g&&validateMap(g)){
      MAP.grid=g.grid;MAP.rooms=g.rooms;MAP.entry=g.entry;MAP.exit=g.exit;
      MAP.gate=(floor%10===0)?g.gate:null;
      MAP.savept=(floor%10===0)?g.savept:null;
      MAP.trapRoom=g.trapRoom||null;MAP.trapDoor=g.trapDoor||null;MAP.trapSwitch=g.trapSwitch||null;
      MAP.secretWall=g.secretWall||null;
      MAP.floor=floor;MAP.seed=seed;MAP.theme=themeOf(floor);
      return;
    }
  }
  const g=fallbackMap();
  MAP.grid=g.grid;MAP.rooms=g.rooms;MAP.entry=g.entry;MAP.exit=g.exit;
  MAP.gate=(floor%10===0)?{x:g.exit.x-1,y:g.exit.y}:null;
  MAP.savept=(floor%10===0)?{x:g.exit.x+1,y:g.exit.y}:null;
  MAP.trapRoom=null;MAP.trapDoor=null;MAP.trapSwitch=null;MAP.secretWall=null;
  MAP.floor=floor;MAP.seed=seed;MAP.theme=themeOf(floor);
}
function genAttempt(floor,rng){
  const grid=Array.from({length:MH},function(){return new Array(MW).fill(WALL);});
  const rooms=[];
  const NR=Math.min(28,16+Math.floor(floor/7));
  let guard=0;
  while(rooms.length<NR&&guard<1200){
    guard++;
    const rw=3+Math.floor(rng()*7),rh=3+Math.floor(rng()*7);
    const rx=1+Math.floor(rng()*(MW-rw-2)),ry=1+Math.floor(rng()*(MH-rh-2));
    let ok=true;
    for(let i=0;i<rooms.length;i++){
      const r=rooms[i];
      if(rx<r.x+r.w+1&&rx+rw+1>r.x&&ry<r.y+r.h+1&&ry+rh+1>r.y){ok=false;break;}
    }
    if(!ok)continue;
    rooms.push({x:rx,y:ry,w:rw,h:rh,cx:rx+Math.floor(rw/2),cy:ry+Math.floor(rh/2)});
    for(let y=ry;y<ry+rh;y++)for(let x=rx;x<rx+rw;x++)grid[y][x]=FLOOR;
  }
  if(rooms.length<5)return null;
  // MST(Prim)で全部屋接続 → 完全接続保証
  const connected=[0];
  const rest=rooms.map(function(_,i){return i;}).filter(function(i){return i!==0;});
  while(rest.length){
    let bi=0,bj=0,bd=1e9;
    for(let ci of connected){
      for(let ri of rest){
        const d=Math.abs(rooms[ci].cx-rooms[ri].cx)+Math.abs(rooms[ci].cy-rooms[ri].cy);
        if(d<bd){bd=d;bi=ci;bj=ri;}
      }
    }
    carveCorridor(grid,rooms[bi],rooms[bj],rng);
    connected.push(bj);rest.splice(rest.indexOf(bj),1);
  }
  // 環状通路
  const loops=Math.max(1,Math.floor(rooms.length*0.15));
  for(let i=0;i<loops;i++){
    const a=rooms[Math.floor(rng()*rooms.length)],b=rooms[Math.floor(rng()*rooms.length)];
    if(a!==b)carveCorridor(grid,a,b,rng);
  }
  const entry=rooms[0];
  let far=rooms[0],fd=-1;
  for(const r of rooms){
    const d=Math.abs(r.cx-entry.cx)+Math.abs(r.cy-entry.cy);
    if(d>fd){fd=d;far=r;}
  }
  let gate=null,savept=null;
  if(floor%10===0){
    const cells=[];
    for(let y=far.y;y<far.y+far.h;y++)for(let x=far.x;x<far.x+far.w;x++)cells.push({x:x,y:y});
    if(cells.length>=4){gate={x:cells[0].x,y:cells[0].y};savept={x:cells[1].x,y:cells[1].y};}
    else{gate={x:far.cx,y:far.cy};savept={x:far.cx+1,y:far.cy};}
  }
  const reserved=function(x,y){
    return (entry.x===x&&entry.y===y)||(far.cx===x&&far.cy===y)||
      (gate&&gate.x===x&&gate.y===y)||(savept&&savept.x===x&&savept.y===y);
  };
  // --- トラップ部屋(5F+): 入口/階段部屋以外・4×4以上 ---
  let trapDoor=null,trapSwitch=null,trapRoom=null;
  if(floor>=5){
    const cands=rooms.filter(function(r){
      return r!==entry&&r!==far&&r.w>=4&&r.h>=4;
    });
    for(let ti=0;ti<cands.length&&!(trapDoor&&trapSwitch);ti++){
      const r=cands[Math.floor(rng()*cands.length)];
      // 部屋の境界から外へ1マスのFLOORがドア候補
      const doors=[];
      for(let y=r.y;y<r.y+r.h;y++)for(let x=r.x;x<r.x+r.w;x++){
        for(const d of [[1,0],[-1,0],[0,1],[0,-1]]){
          const nx=x+d[0],ny=y+d[1];
          const inRoom=(nx>=r.x&&nx<r.x+r.w&&ny>=r.y&&ny<r.y+r.h);
          if(!inRoom&&isFloorOf(grid,nx,ny)&&!reserved(nx,ny))doors.push({x:nx,y:ny,ix:x,iy:y});
        }
      }
      if(!doors.length)continue;
      const door=doors[Math.floor(rng()*doors.length)];
      // スイッチ=ドアから部屋側へ入った1マス
      const sw={x:door.ix,y:door.iy};
      if(reserved(sw.x,sw.y))continue;
      trapDoor=door;trapSwitch=sw;trapRoom=r;
    }
  }
  // --- 隠し部屋(50%): 壁を1枚押すと開くポケット ---
  let secretWall=null;
  if(rng()<0.5){
    for(let att=0;att<120&&!secretWall;att++){
      const wx=1+Math.floor(rng()*(MW-2)),wy=1+Math.floor(rng()*(MH-2));
      if(grid[wy][wx]!==WALL)continue;
      // 外側にFLOOR(押し込める側)がちょうど1つ
      const outs=[];
      for(const d of [[1,0],[-1,0],[0,1],[0,-1]]){
        if(isFloorOf(grid,wx+d[0],wy+d[1]))outs.push(d);
      }
      if(outs.length!==1)continue;
      // 裏側(外側FLOORと反対側)がポケットになる
      const ox=wx-outs[0][0],oy=wy-outs[0][1];
      if(ox<1||oy<1||ox>=MW-1||oy>=MH-1)continue;
      if(grid[oy][ox]!==WALL)continue;
      if(reserved(wx,wy)||reserved(ox,oy))continue;
      secretWall={x:wx,y:wy,ox:ox,oy:oy};
    }
  }
  return {grid:grid,rooms:rooms,entry:{x:entry.cx,y:entry.cy},exit:{x:far.cx,y:far.cy},gate:gate,savept:savept,
    trapRoom:trapRoom,trapDoor:trapDoor,trapSwitch:trapSwitch,secretWall:secretWall};
}
function isFloorOf(g,x,y){return x>=0&&y>=0&&x<MW&&y<MH&&g[y][x]===FLOOR;}
// 環境ハザード配置: 毒ガス/穴/柱(柱は配置後にBFS再検証で接続性を保証)
function gridReachable(g,from,to){
  const seen=new Set([from.y*MW+from.x]);
  const q=[[from.x,from.y]];
  while(q.length){
    const c=q.shift(),x=c[0],y=c[1];
    if(x===to.x&&y===to.y)return true;
    for(const d of [[1,0],[-1,0],[0,1],[0,-1]]){
      const nx=x+d[0],ny=y+d[1];
      if(nx<0||ny<0||nx>=MW||ny>=MH)continue;
      const k=ny*MW+nx;
      if(seen.has(k)||g[ny][nx]!==FLOOR)continue;
      seen.add(k);q.push([nx,ny]);
    }
  }
  return false;
}
function placeHazards(floor,rng){
  const grid=MAP.grid;
  const thIdx=Math.min(9,Math.floor((floor-1)/10));
  const reservedOf=function(x,y){
    return (MAP.entry&&MAP.entry.x===x&&MAP.entry.y===y)||
      (MAP.exit&&MAP.exit.x===x&&MAP.exit.y===y)||
      (MAP.gate&&MAP.gate.x===x&&MAP.gate.y===y)||
      (MAP.savept&&MAP.savept.x===x&&MAP.savept.y===y)||
      (MAP.trapDoor&&MAP.trapDoor.x===x&&MAP.trapDoor.y===y)||
      (MAP.trapSwitch&&MAP.trapSwitch.x===x&&MAP.trapSwitch.y===y)||
      (MAP.secretWall&&((MAP.secretWall.x===x&&MAP.secretWall.y===y)||(MAP.secretWall.ox===x&&MAP.secretWall.oy===y)));
  };
  const freeCell=function(minD){
    for(let i=0;i<200;i++){
      const x=1+Math.floor(rng()*(MW-2)),y=1+Math.floor(rng()*(MH-2));
      if(grid[y][x]!==FLOOR)continue;
      const d=Math.abs(x-MAP.entry.x)+Math.abs(y-MAP.entry.y);
      if(d<minD)continue;
      if(reservedOf(x,y))continue;
      return {x:x,y:y};
    }
    return null;
  };
  // ---- 水辺(T29): 4〜8タイルの池を1〜2箇所。歩行不可なので配置後にBFS検証(切れたら破棄) ----
  // 池同士は4方向で隣接させない(=連結域として1池4〜8タイルを保証)。初手・成長ともに別池との4方向接触を拒否。
  const inPool=(p,x,y)=>{for(let i=0;i<p.length;i++){if(p[i].x===x&&p[i].y===y)return true;}return false;};
  const pondNearWater=function(x,y){
    for(const d2 of [[1,0],[-1,0],[0,1],[0,-1]]){
      const wx=x+d2[0],wy=y+d2[1];
      if(wx>=0&&wy>=0&&wx<MW&&wy<MH&&grid[wy][wx]===WATER)return true;
    }
    return false;
  };
  const nPond=1+(rng()<0.5?1:0);
  for(let pi=0;pi<nPond;pi++){
    // 初手: 既存の水面に4方向で隣接しない床セルを選ぶ(隣接すると別池と連結してサイズ超過)
    let c=null;
    for(let t=0;t<30;t++){
      const cc=freeCell(6);
      if(!cc)break;
      if(!pondNearWater(cc.x,cc.y)){c=cc;break;}
    }
    if(!c)continue;
    const pool=[{x:c.x,y:c.y}];
    grid[c.y][c.x]=WATER;
    const psize=4+Math.floor(rng()*5);
    let pg=0;
    while(pool.length<psize&&pg<60){
      pg++;
      const b=pool[Math.floor(rng()*pool.length)];
      const dd=[[1,0],[-1,0],[0,1],[0,-1]][Math.floor(rng()*4)];
      const nx=b.x+dd[0],ny=b.y+dd[1];
      if(nx<1||ny<1||nx>=MW-1||ny>=MH-1)continue;
      if(grid[ny][nx]!==FLOOR)continue;
      if(reservedOf(nx,ny))continue;
      // 別の池と融合しない(同池タイルの隣接は成長としてOK)。池間は床1タイル以上を確保=各池4〜8タイル維持
      let merge=false;
      for(const d2 of [[1,0],[-1,0],[0,1],[0,-1]]){
        const wx=nx+d2[0],wy=ny+d2[1];
        if(grid[wy][wx]===WATER&&!inPool(pool,wx,wy)){merge=true;break;}
      }
      if(merge)continue;
      grid[ny][nx]=WATER;
      pool.push({x:nx,y:ny});
    }
    if(!gridReachable(grid,MAP.entry,MAP.exit)){
      for(const q of pool)grid[q.y][q.x]=FLOOR; // 接続が切れたら破棄
    }
  }
  // ---- 毒沼(T29): 連結塊3〜8タイル(ランダムウォークで4方向連結)。毒沼テーマは2倍 ----
  // (T33)深度スケーリング: 1〜9F=0、50F≒9、100F≒16
  const nPoison=floor<10?0:Math.min(20,2+Math.floor(floor/7))*(thIdx===4?2:1);
  for(let i=0;i<nPoison;i++){
    let c=freeCell(4); // let: ランダムウォークで頭を追跡するため再代入あり
    if(!c)continue;
    grid[c.y][c.x]=POISON;
    let size=2+Math.floor(rng()*6); // 計3〜8タイル
    let guard=0;
    while(size>0&&guard<50){
      guard++;
      const dd=[[1,0],[-1,0],[0,1],[0,-1]][Math.floor(rng()*4)];
      const nx=c.x+dd[0],ny=c.y+dd[1];
      if(nx<1||ny<1||nx>=MW-1||ny>=MH-1)continue;
      if(grid[ny][nx]!==FLOOR)continue;
      if(reservedOf(nx,ny))continue;
      grid[ny][nx]=POISON;
      c={x:nx,y:ny};
      size--;
    }
  }
  // ---- 穴(落とし穴)(T33): 1〜15F=0、50F≒4、100F≒7 ----
  const nPit=floor<16?0:1+Math.floor((floor-10)/15);
  for(let i=0;i<nPit;i++){
    const c=freeCell(4);
    if(c)grid[c.y][c.x]=PIT;
  }
  // 柱(5×5以上の部屋に1〜2本)
  const bigRooms=MAP.rooms.filter(function(r){return r.w>=5&&r.h>=5;});
  const pillars=[];
  for(const r of bigRooms){
    const n=1+Math.floor(rng()*2);
    for(let i=0;i<n;i++){
      for(let t=0;t<30;t++){
        const x=r.x+1+Math.floor(rng()*(r.w-2)),y=r.y+1+Math.floor(rng()*(r.h-2));
        if(grid[y][x]!==FLOOR)continue;
        if(Math.abs(x-r.cx)<=1&&Math.abs(y-r.cy)<=1)continue; // 通路の合流中心とその周囲
        const d=Math.abs(x-MAP.entry.x)+Math.abs(y-MAP.entry.y);
        if(d<5||reservedOf(x,y))continue;
        grid[y][x]=PILLAR;
        if(gridReachable(grid,MAP.entry,MAP.exit))pillars.push({x:x,y:y});
        else grid[y][x]=FLOOR; // 接続が切れたら破棄
        break;
      }
    }
  }
}
function carveCorridor(g,a,b,rng){
  const horizFirst=rng()<0.5;
  const x0=a.cx,y0=a.cy,x1=b.cx,y1=b.cy;
  const carve=function(x,y){if(x>0&&y>0&&x<MW-1&&y<MH-1)g[y][x]=FLOOR;};
  if(horizFirst){
    for(let x=Math.min(x0,x1);x<=Math.max(x0,x1);x++)carve(x,y0);
    for(let y=Math.min(y0,y1);y<=Math.max(y0,y1);y++)carve(x1,y);
  }else{
    for(let y=Math.min(y0,y1);y<=Math.max(y0,y1);y++)carve(x0,y);
    for(let x=Math.min(x0,x1);x<=Math.max(x0,x1);x++)carve(x,y1);
  }
}
function validateMap(g){
  const seen=new Set([g.entry.y*MW+g.entry.x]);
  const q=[[g.entry.x,g.entry.y]];
  while(q.length){
    const c=q.shift(),x=c[0],y=c[1];
    const dirs=[[1,0],[-1,0],[0,1],[0,-1]];
    for(const d of dirs){
      const nx=x+d[0],ny=y+d[1];
      if(nx<0||ny<0||nx>=MW||ny>=MH)continue;
      const k=ny*MW+nx;
      if(seen.has(k)||g.grid[ny][nx]!==FLOOR)continue;
      seen.add(k);q.push([nx,ny]);
    }
  }
  if(!seen.has(g.exit.y*MW+g.exit.x))return false;
  if(g.gate&&!seen.has(g.gate.y*MW+g.gate.x))return false;
  if(g.savept&&!seen.has(g.savept.y*MW+g.savept.x))return false;
  return true;
}
function fallbackMap(){
  const grid=Array.from({length:MH},function(){return new Array(MW).fill(WALL);});
  for(let x=2;x<MW-2;x++){grid[14][x]=FLOOR;grid[15][x]=FLOOR;}
  const rooms=[{x:2,y:13,w:5,h:3,cx:4,cy:14},{x:MW-7,y:13,w:5,h:3,cx:MW-5,cy:14}];
  return {grid:grid,rooms:rooms,entry:{x:4,y:14},exit:{x:MW-5,y:14}};
}
function isFloor(x,y){return x>=0&&y>=0&&x<MW&&y<MH&&MAP.grid[y][x]===FLOOR;}
// プレイヤーが踏める床(毒/穴は踏めるが危険。柱・壁・閉鎖ドア・水面は不可)
function isWalkable(x,y){
  if(x<0||y<0||x>=MW||y>=MH)return false;
  const t=MAP.grid[y][x];
  return t===FLOOR||t===POISON||t===PIT;
}
function isWater(x,y){return x>=0&&y>=0&&x<MW&&y<MH&&MAP.grid[y][x]===WATER;}
// ---- 飛翔 (T32) ----
// 飛翔レベル: 0=なし, 1=毒/穴/尖刺無効, 2=さらに水面を渡れる
function flyLevel(){
  const p=DUNGEON&&DUNGEON.player;
  if(!p)return 0;
  const f=dStats().flight||0;
  if(p.flyT>0)return 2; // 羽ばたく風: 水面含む
  return f;
}
function isFlying(){return flyLevel()>=1;}
function canCrossWater(){return flyLevel()>=2;}
// プレイヤー移動用の歩行判定(飛翔中は水面も渡れる)
function pWalk(x,y){
  if(isWalkable(x,y))return true;
  return isWater(x,y)&&canCrossWater();
}

let DUNGEON=null;
const TURN={phase:"player",t:0,q:null,i:0,busy:false,bufferedDir:-1};
function enterFloor(floor,fromGate){
  invalidateFloor(); // (T45) 新フロア=MAP全面変更→床キャッシュ無効化
  genMap(floor,RUN_SEED);
  const rng=mulberry32((RUN_SEED^floor*2654435761|0)>>>0);
  const theme=themeOf(floor);
  const enemies=[];
  const drops=[];
  const isBossFloor=(floor===100);
  // ---- 環境ハザード+柱(マス収集前に配置: ハザードは床を消費する) ----
  placeHazards(floor,rng);
  const cells=[];
  for(let y=0;y<MH;y++)for(let x=0;x<MW;x++)if(isFloor(x,y))cells.push({x:x,y:y});
  const occupied={};
  occupied[MAP.entry.y*MW+MAP.entry.x]=1;
  occupied[MAP.exit.y*MW+MAP.exit.x]=1;
  if(MAP.gate)occupied[MAP.gate.y*MW+MAP.gate.x]=1;
  if(MAP.savept)occupied[MAP.savept.y*MW+MAP.savept.x]=1;
  if(MAP.trapDoor)occupied[MAP.trapDoor.y*MW+MAP.trapDoor.x]=1;
  if(MAP.trapSwitch)occupied[MAP.trapSwitch.y*MW+MAP.trapSwitch.x]=1;
  if(MAP.secretWall){occupied[MAP.secretWall.y*MW+MAP.secretWall.x]=1;occupied[MAP.secretWall.oy*MW+MAP.secretWall.ox]=1;}
  // ---- トラップ(尖刺/転移) ----
  const traps=[];
  const nSpike=2+Math.floor(floor/8);
  for(let i=0;i<nSpike*3&&traps.filter(function(t){return t.kind==="spike";}).length<nSpike;i++){
    const c=cells[Math.floor(rng()*cells.length)];
    const d=Math.abs(c.x-MAP.entry.x)+Math.abs(c.y-MAP.entry.y);
    if(d<4||occupied[c.y*MW+c.x])continue;
    occupied[c.y*MW+c.x]=1;
    traps.push({tx:c.x,ty:c.y,kind:"spike",armed:true});
  }
  if(floor>=5&&rng()<0.7){
    for(let i=0;i<400;i++){
      const c=cells[Math.floor(rng()*cells.length)];
      const d=Math.abs(c.x-MAP.entry.x)+Math.abs(c.y-MAP.entry.y);
      if(d<6||occupied[c.y*MW+c.x])continue;
      occupied[c.y*MW+c.x]=1;
      traps.push({tx:c.x,ty:c.y,kind:"teleport",armed:true});
      break;
    }
  }
  // ---- 宝箱(通常89%/罠箱10%/ミミック1%) ----
  const chests=[];
  const nCh=2+Math.floor(rng()*2);
  for(let i=0;i<nCh;i++){
    const c=cells[Math.floor(rng()*cells.length)];
    const d=Math.abs(c.x-MAP.entry.x)+Math.abs(c.y-MAP.entry.y);
    if(d<5||occupied[c.y*MW+c.x])continue;
    occupied[c.y*MW+c.x]=1;
    const cr=rng();
    let type="normal";
    if(cr<0.01)type="mimic";
    else if(cr<0.11)type="trap";
    chests.push({tx:c.x,ty:c.y,open:false,item:pickChestItem(floor,rng),type:type});
  }
  // ---- トラップ部屋の報酬(奥の角: 高ティア宝箱×2+金塊) ----
  if(MAP.trapRoom&&MAP.trapDoor){
    const r=MAP.trapRoom;
    const corners=[
      {x:r.x,y:r.y},{x:r.x+r.w-1,y:r.y},{x:r.x,y:r.y+r.h-1},{x:r.x+r.w-1,y:r.y+r.h-1}
    ].filter(function(c){return isFloor(c.x,c.y)&&!occupied[c.y*MW+c.x];});
    corners.sort(function(a,b){
      const da=Math.abs(a.x-MAP.trapDoor.x)+Math.abs(a.y-MAP.trapDoor.y);
      const db=Math.abs(b.x-MAP.trapDoor.x)+Math.abs(b.y-MAP.trapDoor.y);
      return db-da;
    });
    for(let i=0;i<Math.min(2,corners.length);i++){
      const c=corners[i];
      occupied[c.y*MW+c.x]=1;
      chests.push({tx:c.x,ty:c.y,open:false,item:pickChestItem(Math.min(100,floor+10),rng),type:"normal",rich:true});
    }
    if(corners.length){
      const c=corners[0];
      drops.push({tx:c.x,ty:c.y,x:(c.x+0.5)*TILE,y:(c.y+0.5)*TILE,id:"gold",n:1,amount:80+Math.floor(rng()*120)+floor*5,bob:0,got:false});
    }
  }
  // ---- 隠し部屋の報酬 (T31: 保留→壁崩落時にだけ出現・丸見え解消) ----
  let secretLoot=null;
  if(MAP.secretWall){
    const sw=MAP.secretWall;
    const loots=[
      {id:"p_hp_l",n:1,amount:0},
      {id:"p_mp",n:2,amount:0},
      {id:"gold",n:1,amount:100+Math.floor(rng()*100)}
    ];
    const sDrops=[];
    for(let i=0;i<loots.length;i++){
      const cell=(i===0)?{x:sw.ox,y:sw.oy}:{x:sw.x,y:sw.y};
      const l=loots[i];
      sDrops.push({tx:cell.x,ty:cell.y,x:(cell.x+0.5)*TILE,y:(cell.y+0.5)*TILE,id:l.id,n:l.n,amount:l.amount,bob:rng()*6,got:false});
    }
    // 高品質宝箱も1つ
    const chCell=(rng()<0.5)?{x:sw.ox,y:sw.oy}:{x:sw.x,y:sw.y};
    const sChest={tx:chCell.x,ty:chCell.y,open:false,item:pickChestItem(Math.min(100,floor+10),rng),type:"normal",rich:true};
    secretLoot={drops:sDrops,chest:sChest};
  }
  // 敵(マス1つ、重複禁止)
  const eCount=isBossFloor?6:Math.min(40,10+Math.floor(floor*0.3));
  let placed=0,tries=0;
  while(placed<eCount&&tries<800){
    tries++;
    const c=cells[Math.floor(rng()*cells.length)];
    const d=Math.abs(c.x-MAP.entry.x)+Math.abs(c.y-MAP.entry.y);
    if(d<6||occupied[c.y*MW+c.x])continue;
    occupied[c.y*MW+c.x]=1;
    const pool=theme.enemies;
    const id=pool[Math.floor(rng()*pool.length)];
    enemies.push(spawnEnemy(id,c.x,c.y,floor));
    placed++;
  }
  if(isBossFloor){
    // ボスは階段の隣の床マスに
    let bt=null;
    for(let dy=-1;dy<=1&&!bt;dy++)for(let dx=-1;dx<=1;dx++){
      const bx=MAP.exit.x+dx,by=MAP.exit.y+dy;
      if(isFloor(bx,by)&&!occupied[by*MW+bx]){bt={x:bx,y:by};break;}
    }
    if(!bt)bt={x:MAP.entry.x,y:MAP.entry.y};
    enemies.push(spawnEnemy("boss_karaage",bt.x,bt.y,floor));
  }
  // ---- (T41) 中ボス: 10F帯(10〜90F)で階段の隣に出現。討伐済みなら再出現しない ----
  if(floor%10===0&&floor<100&&!(SAVE.miniBossDefeated&&SAVE.miniBossDefeated[floor])){
    let mbt=null;
    for(let dy=-1;dy<=1&&!mbt;dy++)for(let dx=-1;dx<=1;dx++){
      const bx=MAP.exit.x+dx,by=MAP.exit.y+dy;
      if(isFloor(bx,by)&&!occupied[by*MW+bx]){mbt={x:bx,y:by};break;}
    }
    if(!mbt)mbt={x:MAP.entry.x,y:MAP.entry.y};
    occupied[mbt.y*MW+mbt.x]=1;
    enemies.push(spawnMiniBoss(floor,mbt.x,mbt.y));
  }
  // ---- (T34) 転移キュー: 敵が転移トラップを踏んだ敵は、プレイヤーがこの階に到達した時に出現 ----
  if(SAVE.teleQueue&&SAVE.teleQueue.length){
    const here=SAVE.teleQueue.filter(function(q){return q.floor===floor;});
    if(here.length){
      SAVE.teleQueue=SAVE.teleQueue.filter(function(q){return q.floor!==floor;});
      storeSave();
      UI.toast("転移の紋から"+here.length+"体の敵が現れた!");
    }
    for(const q of here){
      for(let t=0;t<200;t++){
        const c=cells[Math.floor(rng()*cells.length)];
        const d=Math.abs(c.x-MAP.entry.x)+Math.abs(c.y-MAP.entry.y);
        if(d<3||occupied[c.y*MW+c.x])continue;
        occupied[c.y*MW+c.x]=1;
        enemies.push(spawnEnemy(q.id,c.x,c.y,floor));
        break;
      }
    }
  }
  // ドロップ(マス1つ、敵と重複可)
  const dCount=12+Math.floor(rng()*8);
  for(let i=0;i<dCount;i++){
    const c=cells[Math.floor(rng()*cells.length)];
    const d=Math.abs(c.x-MAP.entry.x)+Math.abs(c.y-MAP.entry.y);
    if(d<3)continue;
    drops.push(makeDrop(c.x,c.y,floor,rng));
  }
  DUNGEON={
    floor:floor,theme:theme,enemies:enemies,drops:drops,chests:chests,
    traps:traps,
    ebullets:[],pbullets:[],beams:[],particles:[],floats:[],
    player:null,time:0,shake:0,turn:1,
    bossDead:false,clearDone:false,
    warnings:[],
    pitScar:[],
    flashT:0,teleT:0,
    secretOpen:false,
    secretLoot:secretLoot,
    trapDoorLocked:false,trapDoorAnim:0,
    trapEnemies:0
  };
  DUNGEON.player=makePlayer(MAP.entry.x,MAP.entry.y);
  TURN.phase="player";TURN.q=null;TURN.i=0;TURN.t=0;TURN.busy=false;TURN.bufferedDir=-1;
  collectDrops(DUNGEON.player);
  SAVE.floorsVisited[floor]=true;
  if(floor>SAVE.maxFloor)SAVE.maxFloor=floor;
  if(floor%10===0)UI.toast(floor+"F: セーブポイントとワープゲート");
  // (T37) その階のテーマから3曲中ランダム1曲を選んで保持(同じ階中は同じ曲)
  DUNGEON.bgm=themeBgmName(floor);
  playBGM(DUNGEON.bgm);
  if(!fromGate)playSFX("sfx_stairs.ogg");
  UI.toast(floor+"F "+theme.name+" (ターン制)");
  if(floor===100)playVoice("voice_boss_in.ogg");
}
function spawnEnemy(id,tx,ty,floor){

  const lvBonus=SAVE?1+Math.max(0,SAVE.lv-1)*0.03:1;
  const hp=Math.floor(base.hp*scale*lvBonus);
  return {
    id:id,name:base.name,tx:tx,ty:ty,
    x:(tx+0.5)*TILE,y:(ty+0.5)*TILE,
    r:base.r,
    hp:hp,hpMax:hp,
    atk:Math.floor(base.atk*(1+(floor-1)*0.03)),
    def:Math.floor(base.def*(1+(floor-1)*0.02)),
    spd:base.spd,xp:Math.floor(base.xp*(1+(floor-1)*0.02)),
    gold:[base.gold[0],base.gold[1]],
    kind:base.kind,theme:base.theme,col:base.col,
    dirIdx:4,
    fireCd:2+Math.floor(Math.random()*2),
    chargeWarn:null,chargePath:null,
    hitT:0,freezeT:0,dead:false,animT:Math.random()*6,
    flying:base.kind==="flying",
    size:base.size
  };
}

}
function mbAlive(){
  return DUNGEON&&DUNGEON.enemies.some(function(e){return e.mini&&!e.dead;});
}
// 隣接のidle中ボスにZ=「話す」(ターン消費) → 台詞+咆哮で戦闘開始
function mbTalk(e){
  e.mbState="fight";
  DUNGEON.miniBossFight=true;
  const def=e.mb;
  UI.speech={text:def.open,speaker:def.name,t:4.2};
  playVoice("mbv_open_"+e.id+".ogg");
  playSFX("sfx_boss.ogg");
  DUNGEON.shake=10;
  DUNGEON.flashT=0.18;
  for(let i=0;i<26;i++)P(e.x+(Math.random()-0.5)*70,e.y+(Math.random()-0.5)*70,(Math.random()-0.5)*4,(Math.random()-0.5)*4,0.7,def.gender==="m"?"#ff8a3a":"#b8a0ff",3);
  DUNGEON.warnings=DUNGEON.warnings.filter(function(w){return w.e!==e;}); // 自分以外(他の敵の突進予告)は保持
  // (T43) 中ボス戦闘=その階の唐揚げ王国崇拝曲(深い階層ほど崇拝度高い)
  const mbn=mbBgmName(DUNGEON.floor);
  if(mbn&&DUNGEON.bgm!==mbn){DUNGEON.bgm=mbn;playBGM(mbn);}
  UI.toast(def.name+" の出現!! (中ボス)");
}
// 中ボス討伐: 階段解放+専用武器ドロップ+地上ワープゲート+死亡保持
function mbDefeated(e){
  const def=e.mb;
  const floor=DUNGEON.floor;
  if(!SAVE.miniBossDefeated)SAVE.miniBossDefeated={};
  SAVE.miniBossDefeated[floor]=true;
  storeSave();
  DUNGEON.miniBossFight=false;
  // 専用武器(店売りなし)を死体からドロップ
  DUNGEON.drops.push({tx:e.tx,ty:e.ty,x:e.x,y:e.y,id:def.weapon,n:1,amount:0,bob:0,got:false});
  UI.toast("専用武器「"+ALL_ITEMS[def.weapon].name+"」を入手可能!");
  // 地上ワープゲート: 死体の隣(失敗時は階段の隣)
  let gt=null;
  const gdirs=[[-1,0],[1,0],[0,-1],[0,1]];
  for(const g of gdirs){
    const gx=e.tx+g[0],gy=e.ty+g[1];
    if(isFloor(gx,gy)&&!(gx===MAP.entry.x&&gy===MAP.entry.y)){gt={x:gx,y:gy};break;}
  }
  if(!gt)for(const g of gdirs){
    const gx=MAP.exit.x+g[0],gy=MAP.exit.y+g[1];
    if(isFloor(gx,gy)){gt={x:gx,y:gy};break;}
  }
  // 標準ゲート(同階ワープ)の位置を地上ゲートへ置き換え(踏んだことになし再開放)
  if(gt){MAP.gate=gt;DUNGEON.miniGate=gt;DUNGEON._gateDone=false;}
  // BGMを探索曲(テーマ)に戻す
  if(isMbBgm(DUNGEON.bgm)||DUNGEON.bgm==="bgm_boss.ogg"){DUNGEON.bgm=themeBgmName(floor);playBGM(DUNGEON.bgm);}
  DUNGEON.shake=12;
  DUNGEON.flashT=0.25;
  playSFX("sfx_boss.ogg",0.9);
  // (T41) 死亡台詞: 共通プール(性別別)・90Fのみ固有(大魔王への祈り)
  const g=(def.gender==="m"?"m_":"f_");
  const dieLine=(floor===90)?def.die:MBV_LINES[g+"die"][Math.floor(Math.random()*MBV_LINES[g+"die"].length)];
  UI.speech={text:dieLine,speaker:def.name,t:4.2};
  playVoice((floor===90)?"mbv_die_"+e.id+".ogg":"mbv_"+g+"die.ogg");
  UI.toast(floor+"F の中ボスを討伐! 階段が解放された。地上ゲート出現。");
}
function makePlayer(tx,ty){
  return {
    tx:tx,ty:ty,
    x:(tx+0.5)*TILE,y:(ty+0.5)*TILE,
    r:13,hp:SAVE.hp,mp:SAVE.mp,
    dirIdx:0,swing:0,
    skillCd:[0,0,0],
    hitT:0,guardT:0,dashBonusT:0,
    flyT:0,flySkillCd:0,
    summon:null,
    animT:0,moving:false
  };
}
function makeDrop(tx,ty,floor,rng){
  const t=rng();
  let id;
  if(t<0.34)id="p_hp_s";
  else if(t<0.50)id="p_mp";
  else if(t<0.64)id="gold";
  else if(t<0.80)id="exp";
  else if(t<0.90)id="s_mat";
  else if(t<0.96)id="p_hp_l";
  else id="gold";
  let n=1,amount=0;
  if(id==="gold")amount=5+Math.floor(rng()*(8+floor*0.8));
  if(id==="exp")amount=10+Math.floor(rng()*15+floor*0.5);
  if(id==="p_hp_s")n=1+Math.floor(rng()*2);
  return {tx:tx,ty:ty,x:(tx+0.5)*TILE,y:(ty+0.5)*TILE,id:id,n:n,amount:amount,bob:rng()*6,got:false};
}
function pickChestItem(floor,rng){
  const tier=Math.min(6,1+Math.floor(floor/18));
  const w=WEAPONS.filter(function(it){return it.tier<=tier;});
  const a=ARMORS.filter(function(it){return it.tier<=tier;});
  const r=rng();
  if(r<0.45)return {kind:"weapon",id:w[Math.floor(rng()*w.length)].id};
  if(r<0.75)return {kind:"armor",id:a[Math.floor(rng()*a.length)].id};
  if(r<0.90)return {kind:"ring",id:RINGS[Math.floor(rng()*RINGS.length)].id};
  return {kind:"weapon",id:WEAPONS[Math.min(WEAPONS.length-1,Math.floor(rng()*(tier+1)))].id};
}
// 装備: 旧装備はバックパックへ退避
function addItemEquip(item){
  const slot=item.kind;
  const old=SAVE.equip[slot];
  if(old)SAVE.inv.push({id:old,n:1});
  SAVE.equip[slot]=item.id;
  const it=ALL_ITEMS[item.id];
  if(it)UI.toast("装備: "+it.name);
}
function itemSlotOf(def){
  if(WEAPONS.indexOf(def)>=0)return "weapon";
  if(ARMORS.indexOf(def)>=0)return "armor";
  if(RINGS.indexOf(def)>=0)return "ring";
  return null;
}
function equipFromBag(invIdx){
  const it=SAVE.inv[invIdx];
  if(!it)return false;
  const def=ALL_ITEMS[it.id];
  const realSlot=itemSlotOf(def);
  if(!realSlot)return false;
  const old=SAVE.equip[realSlot];
  SAVE.inv.splice(invIdx,1);
  if(old)SAVE.inv.push({id:old,n:1});
  SAVE.equip[realSlot]=it.id;
  UI.toast("装備: "+def.name);
  return true;
}
// マス占有判定
function enemyAt(tx,ty){
  for(const e of DUNGEON.enemies)if(!e.dead&&e.tx===tx&&e.ty===ty)return e;
  return null;
}
function canStep(tx,ty,ignoreEnemy){
  if(!isFloor(tx,ty))return false;
  if(DUNGEON.player.tx===tx&&DUNGEON.player.ty===ty)return false;
  const e=enemyAt(tx,ty);
  if(e&&!ignoreEnemy)return false;
  return true;
}
function canDiag(ax,ay,bx,by){
  // (ax,ay)=水平ステップ, (bx,by)=垂直ステップ — 両方が床でないと対角不可
  return isFloor(ax,ay)&&isFloor(bx,by);
}
// 足元のドロップ収集(自由)
function collectDrops(p){
  for(const dr of DUNGEON.drops){
    if(dr.got||dr.tx!==p.tx||dr.ty!==p.ty)continue;
    dr.got=true;
    if(dr.id==="gold"){
      SAVE.gold+=dr.amount;
      playSFX("sfx_pickup.ogg",1.1);
      UI.float(p.x,p.y-16,"+"+dr.amount+"G","#ffd24a",13);
    }else if(dr.id==="exp"){
      gainXp(dr.amount);
      playSFX("sfx_pickup.ogg",1.2);
      UI.float(p.x,p.y-16,"+"+dr.amount+"EXP","#7ec8ff",13);
    }else{
      addItem(dr.id,dr.n);
      // (T38) レアリティ(tier)別入手音
      const _it=ALL_ITEMS[dr.id];
      const _tier=_it&&_it.tier?Math.min(6,_it.tier):1;
      playSFX("sfx_pick_t"+_tier+".ogg");
    }
  }
}
// 敵フェーズ終了後: 階段に立ち止まっていた場合の降下(100Fのみボス撃破必須)
function checkStairsDescend(){
  const p=DUNGEON.player;
  if(p.tx===MAP.exit.x&&p.ty===MAP.exit.y){
    if(DUNGEON.floor>=100){
      if(DUNGEON.bossDead)doClear();
      return;
    }
    // (T41) 未討伐の中ボスが居れば階段封じ
    if(DUNGEON.floor%10===0&&mbAlive()){
      UI.toast("階段は"+DUNGEON.enemies.filter(function(e){return e.mini&&!e.dead;})[0].name+"が塞いでいる…!");
      return;
    }
    nextFloor();
  }
}
function doClear(){
  G.screen="clear";
  stopBGM();
  playBGM("bgm_clear.ogg");
  playVoice("voice_clear.ogg");
  playSFX("sfx_victory.ogg");
  SAVE.cleared=true;

  if(!SAVE.equip.armor||!ALL_ITEMS[SAVE.equip.armor].legend)SAVE.equip.armor="a_crown";

// ============================================================
// 戦闘 (ターン制)
// ============================================================
function calcMeleeDmg(atk,def){
  return Math.max(1,Math.floor(atk*(0.85+Math.random()*0.3)-def*0.5));
}
// 武器ダメージ: 魔属性中心の武器は魔力計算、それ以外は物理
function weaponDmg(w,d,e,mult){
  mult=mult||1;
  if(w.mag>w.atk){
    return Math.max(1,Math.floor(d.mag*mult*0.9-e.def*0.4));
  }
  return Math.max(1,Math.floor(calcMeleeDmg(d.atk,e.def)*mult));
}
// 攻撃種別による攻撃 (T25: 全武器1行動=1ターン。chargeは1T溜め→次のZで発射)
function attackAction(){
  const p=DUNGEON.player,d=dStats(),D=DUNGEON;
  const w=SAVE.equip.weapon&&ALL_ITEMS[SAVE.equip.weapon];
  if(SAVE.job==="hero"&&w){
    SAVE.mastery[w.id]=(SAVE.mastery[w.id]||0)+0.1;
  }
  // (T41) 隣接のidle中ボスにZ=「話す」: ダメージなし、台詞+咆哮で戦闘開始(ターン消費)
  {
    const v=DIRS[p.dirIdx];
    const t=enemyAt(p.tx+v[0],p.ty+v[1]);
    if(t&&t.mini&&t.mbState==="idle"){
      p.charging=false;
      mbTalk(t);
      endPlayerTurn();
      return;
    }
  }
  // ---- charge系: 1回押す=溜め(1ターン)、2回押す=発射(1ターン)。移動でキャンセル ----
  if(w&&w.kind==="charge"){
    if(!p.charging){
      p.charging=true;
      p.swing=0.22;
      UI.float(p.x,p.y-26,"溜め…","#ffd24a",15);
      playSFX("sfx_charge.ogg"); // (T38) 溜め音
      for(let i=0;i<8;i++){
        const a=i/8*Math.PI*2;
        P(p.x+Math.cos(a)*20,p.y+Math.sin(a)*20,-Math.cos(a)*1.5,-Math.sin(a)*1.5,0.5,"#ffd24a",2.5);
      }
      endPlayerTurn();
      return;
    }
    // 発射
    p.charging=false;
    p.swing=0.3;
    playSFX("sfx_atk_charge.ogg",1.15); // (T38) 溜め武器発射音
    if(w.thunder){
      // 雷鳴の槌: 周囲半径w.boomの落雷
      let hitAny=false;
      for(const e of D.enemies){
        if(e.dead)continue;
        if(chebyshev(e,p)<=w.boom){
          damageEnemy(e,weaponDmg(w,d,e));
          e.freezeT=Math.max(e.freezeT,1);
          spawnLightningFX(e.x,e.y);
          hitAny=true;
        }
      }
      D.shake=14;
      playSFX(hitAny?"sfx_hit.ogg":"sfx_swing.ogg",1.1);
      UI.float(p.x,p.y-30,"雷鳴!!","#ffe24a",16);
    }else{
      // 波動砲: 向きの直線w.rangeマスの全貫通
      const v=DIRS[p.dirIdx];
      let hitAny=false,last=null;
      for(let k=1;k<=w.range;k++){
        const nx=p.tx+v[0]*k,ny=p.ty+v[1]*k;
        if(!isFloor(nx,ny))break;
        const e=enemyAt(nx,ny);
        if(e){damageEnemy(e,weaponDmg(w,d,e));hitAny=true;last=e;}
      }
      D.beams.push({x0:p.x,y0:p.y,x1:(p.tx+v[0]*Math.min(w.range,8)+0.5)*TILE,y1:(p.ty+v[1]*Math.min(w.range,8)+0.5)*TILE,life:0.18,max:0.18,col:"#8ae8ff",w:10});
      D.shake=12;
      playSFX(hitAny?"sfx_hit.ogg":"sfx_swing.ogg",1.1);
      UI.float(p.x,p.y-30,"波動砲!!","#8ae8ff",16);
    }
    endPlayerTurn();
    return;
  }
  // (T38) 武器kind別発動音(素手はmelee音)
  const ATK_SFX={melee:"sfx_atk_melee.ogg",wide:"sfx_atk_wide.ogg",pierce:"sfx_atk_pierce.ogg",shot:"sfx_atk_shot.ogg",multi:"sfx_atk_multi.ogg",bomb:"sfx_atk_bomb.ogg",flash:"sfx_atk_flash.ogg"};
  if(w&&ATK_SFX[w.kind])playSFX(ATK_SFX[w.kind],1.0);
  else if(!w)playSFX("sfx_atk_melee.ogg",0.9);
  let hitAny=false;
  if(!w||!w.kind){
    // 素手: 向きの1マス
    const v=DIRS[p.dirIdx];
    const e=enemyAt(p.tx+v[0],p.ty+v[1]);
    if(e){damageEnemy(e,calcMeleeDmg(d.atk,e.def));hitAny=true;}
  }else if(w.kind==="melee"){
    const v=DIRS[p.dirIdx];
    const e=enemyAt(p.tx+v[0],p.ty+v[1]);
    if(e){
      damageEnemy(e,weaponDmg(w,d,e));
      if(w.stagger&&Math.random()<w.stagger){e.freezeT=1;UI.float(e.x,e.y-e.r-8,"怯え","#c8d8ff",12);D.shake=Math.max(D.shake,4);}
      if(w.followup&&Math.random()<w.followup){
        damageEnemy(e,Math.max(1,Math.floor(weaponDmg(w,d,e)*0.5)));
        UI.float(e.x,e.y-e.r-16,"追撃!","#ffd24a",13);
      }
      hitAny=true;
    }
  }else if(w.kind==="wide"){
    // 正面+両斜め(3マスの弧)
    const dirs=[(p.dirIdx+7)%8,p.dirIdx,(p.dirIdx+1)%8];
    for(const di of dirs){
      const v=DIRS[di];
      const e=enemyAt(p.tx+v[0],p.ty+v[1]);
      if(e){damageEnemy(e,weaponDmg(w,d,e));hitAny=true;}
    }
  }else if(w.kind==="pierce"){
    // 直線Nマス・全貫通
    const v=DIRS[p.dirIdx];
    let lastK=1;
    for(let k=1;k<=w.range;k++){
      const nx=p.tx+v[0]*k,ny=p.ty+v[1]*k;
      if(!isFloor(nx,ny))break;
      lastK=k;
      const e=enemyAt(nx,ny);
      if(e){damageEnemy(e,weaponDmg(w,d,e));hitAny=true;}
    }
    if(w.beam&&hitAny){
      D.beams.push({x0:p.x,y0:p.y,x1:(p.tx+v[0]*lastK+0.5)*TILE,y1:(p.ty+v[1]*lastK+0.5)*TILE,life:0.15,max:0.15,col:"#ff5af0",w:6});
      D.shake=Math.max(D.shake,5);
    }
  }else if(w.kind==="shot"||w.kind==="multi"){
    // 投射弾(敵フェーズで1マスずつ進み初命中): shot=1方向, multi=3方向
    const dirs=w.kind==="multi"?[(p.dirIdx+7)%8,p.dirIdx,(p.dirIdx+1)%8]:[p.dirIdx];
    for(const di of dirs){
      const v=DIRS[di];
      const nx=p.tx+v[0],ny=p.ty+v[1];
      const shots=w.kind==="multi"?1:(w.shots||1);
      for(let s=0;s<shots;s++){
        if(isFloor(nx,ny)&&!enemyAt(nx,ny)){
          D.pbullets.push({tx:p.tx,ty:p.ty,x:p.x,y:p.y,dx:v[0],dy:v[1],w:w,mult:w.mult||1,col:w.mag>w.atk?"#8ae8ff":"#ffd24a",boom:0});
          hitAny=true;
        }else{
          // 至近距離(隣が敵): 即時命中
          const e=enemyAt(nx,ny);
          if(e){damageEnemy(e,weaponDmg(w,d,e,w.mult||1));hitAny=true;}
        }
      }
    }
    playSFX("sfx_hit.ogg",0.8);
    spawnMuzzleFX(p.x,p.y,dirAngle(p.dirIdx),w.mag>w.atk?"#8ae8ff":"#ffd24a");
  }else if(w.kind==="bomb"){
    // 投射→Nマス目に着弾してAoE爆発
    const v=DIRS[p.dirIdx];
    let landK=1;
    for(let k=1;k<=w.range;k++){
      const nx=p.tx+v[0]*k,ny=p.ty+v[1]*k;
      if(!isFloor(nx,ny))break;
      landK=k;
    }
    const ltx=p.tx+v[0]*landK,lty=p.ty+v[1]*landK;
    D.pbullets.push({tx:p.tx,ty:p.ty,x:p.x,y:p.y,dx:v[0],dy:v[1],w:w,mult:w.mult||1,col:"#ff9a4a",boom:w.boom,pull:w.pull||0,dist:0,maxDist:landK});
    hitAny=true;
    playSFX("sfx_hit.ogg",0.8);
    spawnMuzzleFX(p.x,p.y,dirAngle(p.dirIdx),"#ff9a4a");
  }else if(w.kind==="flash"){
    // 周囲半径w.rangeの眩光+麻痺
    let hitAny=false;
    for(const e of D.enemies){
      if(e.dead)continue;
      if(chebyshev(e,p)<=w.range){
        damageEnemy(e,weaponDmg(w,d,e));
        e.freezeT=Math.max(e.freezeT,w.stun||2);
        hitAny=true;
      }
    }
    D.flashT=0.25;
    D.shake=Math.max(D.shake,6);
    playSFX(hitAny?"sfx_hit.ogg":"sfx_swing.ogg",1.0);
    for(let i=0;i<14;i++)P(p.x+(Math.random()-0.5)*40,p.y+(Math.random()-0.5)*40,(Math.random()-0.5)*2,(Math.random()-0.5)*2,0.5,"#fffbe0",2.5);
  }
  p.swing=Math.max(p.swing||0,w&&w.kind==="melee"?0.22:0.15);
  if(!hitAny)playSFX("sfx_swing.ogg");
  spawnArcFX(p.x,p.y,dirAngle(p.dirIdx),hitAny);
  endPlayerTurn();
}
// 爆発(AoE): bomb系とブラックホール共用
function bombExplosion(b){
  const D=DUNGEON;
  const R=b.boom||1;
  let hitAny=false;
  for(const e of D.enemies){
    if(e.dead)continue;
    if(chebyshev(e,{tx:b.tx,ty:b.ty})<=R){
      damageEnemy(e,weaponDmg(b.w,dStats(),e,b.mult||1));
      hitAny=true;
    }
  }
  if(b.pull){
    // 吸い込み: 周囲(b.boom+1)の敵を爆心へ1マス引き寄せる
    for(const e of D.enemies){
      if(e.dead)continue;
      const dc=chebyshev(e,{tx:b.tx,ty:b.ty});
      if(dc<=R+1&&dc>0){
        const di=dirTo(e.tx,e.ty,b.tx,b.ty);
        const v=DIRS[di];
        const nx=e.tx+v[0],ny=e.ty+v[1];
        if(isFloor(nx,ny)&&!enemyAt(nx,ny)&&!(D.player.tx===nx&&D.player.ty===ny)){
          e.tx=nx;e.ty=ny;
        }
      }
    }
  }
  D.shake=Math.max(D.shake,b.pull?12:9);
  playSFX("sfx_ehit.ogg",1.2);
  for(let i=0;i<16;i++){
    const a=Math.random()*Math.PI*2,sp=1+Math.random()*3;
    P((b.tx+0.5)*TILE,(b.ty+0.5)*TILE,Math.cos(a)*sp,Math.sin(a)*sp,0.6,b.pull?"#c33bd4":"#ff9a4a",3);
  }
  tileFlash(b.tx,b.ty,b.pull?"rgba(160,60,220,":"rgba(255,150,60,");
}
// 銃口スパーク
function spawnMuzzleFX(x,y,ang,col){
  for(let i=0;i<5;i++){
    const a=ang+(Math.random()-0.5)*0.8;
    P(x+Math.cos(ang)*14,y+Math.sin(ang)*14,Math.cos(a)*2.5,Math.sin(a)*2.5,0.3,col||"#ffd24a",2);
  }
}
function damageEnemy(e,dmg){
  if(e.dead)return;
  // (T41) idle中ボスへの攻撃=挑発: 最初の攻撃は無効、会話で戦闘開始
  if(e.mini&&e.mbState==="idle"){
    mbTalk(e);
    UI.float(e.x,e.y-e.r-10,"挑発!","#ffd24a",14);
    return;
  }
  e.hp-=dmg;e.hitT=0.18;
  UI.float(e.x,e.y-e.r-6,"-"+dmg,"#ffd24a",14);
  spawnHitFX(e.x,e.y);
  if(e.hp<=0)killEnemy(e);
}
function killEnemy(e){
  e.dead=true;
  playSFX("sfx_ehit.ogg",0.9);
  spawnDeathFX(e.x,e.y,e.col);
  const g=e.gold[0]+Math.floor(Math.random()*(e.gold[1]-e.gold[0]+1));
  DUNGEON.drops.push({tx:e.tx,ty:e.ty,x:e.x,y:e.y,id:"gold",n:1,amount:g,bob:0,got:false});
  DUNGEON.drops.push({tx:e.tx,ty:e.ty,x:e.x,y:e.y,id:"exp",n:1,amount:e.xp,bob:0,got:false});
  if(Math.random()<0.12)DUNGEON.drops.push({tx:e.tx,ty:e.ty,x:e.x,y:e.y,id:"p_hp_s",n:1,amount:0,bob:0,got:false});
  if(e.id==="mimic"){
    // ミミック討伐報酬: 高ティア装備+大金塊
    const item=pickChestItem(Math.min(100,DUNGEON.floor+15),Math.random);
    addItemEquip(item);
    UI.toast("ミミックを倒した! "+ALL_ITEMS[item.id].name+" を得た!");
    DUNGEON.drops.push({tx:e.tx,ty:e.ty,x:e.x,y:e.y,id:"gold",n:1,amount:100+DUNGEON.floor*6,bob:0,got:false});
  }
  // (T41) 中ボス討伐: 階段解放+専用武器+地上ゲート+死亡保持
  if(e.mini)mbDefeated(e);
  gainXp(Math.floor(e.xp*0.5));
  checkTrapRoomUnlock();
  if(e.id==="boss_karaage"){
    DUNGEON.bossDead=true;
    SAVE.bossDown=true;
    playSFX("sfx_boss.ogg");
    playVoice("voice_boss_die.ogg");
    DUNGEON.shake=14;
  }
}
function damagePlayer(dmg){
  const p=DUNGEON.player;
  if(!p||G.screen!=="dungeon")return;
  if(p.guardT>0){
    dmg=Math.max(1,Math.floor(dmg*0.25));
    playSFX("sfx_guard.ogg");
    spawnGuardFX(p.x,p.y);
  }
  const d=dStats();
  const real=Math.max(1,Math.floor(dmg-d.def*0.6));
  p.hp-=real;
  SAVE.hp=p.hp;
  p.hitT=0.25;
  DUNGEON.shake=6;
  playSFX("sfx_ehit.ogg",1.1);
  UI.float(p.x,p.y-20,"-"+real,"#ff5a5a",16);
  spawnHitFX(p.x,p.y);
  if(p.hp<=0){p.hp=0;SAVE.hp=0;onDeath();}
}
function onDeath(){
  stopBGM();
  playSFX("sfx_death.ogg");
  SAVE.gold=0;
  SAVE.equip={weapon:null,armor:null,ring:null};
  SAVE.inv=[];
  storeSave();
  G.screen="gameover";
  UI.gameoverReason="全ての装備・金・アイテムを失った…(レベルと解放した階は保持)";
}
function useSkill(i){
  const p=DUNGEON.player;
  if(!p)return;
  const sk=JOBS[SAVE.job].skills[i];
  if(!sk)return;
  // スキル使用で溜めはキャンセル(古代の装甲でも)
  if(p.charging){p.charging=false;UI.toast("溜めが切れた");}
  if(p.skillCd[i]>0||p.mp<sk.mp)return;
  p.mp-=sk.mp;
  SAVE.mp=p.mp;
  p.skillCd[i]=sk.cd;
  const d=dStats();
  if(SAVE.job==="hero"){
    if(i===0){
      const v=DIRS[p.dirIdx];
      const e=enemyAt(p.tx+v[0],p.ty+v[1]);
      if(e){
        damageEnemy(e,Math.max(1,Math.floor(d.atk*2.2-e.def*0.5)));
        DUNGEON.shake=11;
        DUNGEON.beams.push({x0:p.x,y0:p.y,x1:p.x+v[0]*52,y1:p.y+v[1]*52,life:0.2,max:0.2,col:"#9fe8ff",w:9}); // (T39) 光帯
      }
      playSFX("sfx_skill.ogg");
      spawnArcFX(p.x,p.y,dirAngle(p.dirIdx),true);
      for(let k=0;k<8;k++){ // (T39) 粒子増大
        const a=dirAngle(p.dirIdx)+(Math.random()-0.5)*2.4,sp=(4+Math.random()*4);

      }
    }else if(i===1){
      const v=DIRS[p.dirIdx];
      let moved=0;
      for(let k=1;k<=3;k++){
        const nx=p.tx+v[0]*k,ny=p.ty+v[1]*k;
        if(!isFloor(nx,ny)||enemyAt(nx,ny))break;
        p.tx=nx;p.ty=ny;moved=k;

      DUNGEON.shake=16;

      for(const e of DUNGEON.enemies){

function chebyshev(a,b){return Math.max(Math.abs(a.tx-b.tx),Math.abs(a.ty-b.ty));}
function isSummonSpot(tx,ty){return isFloor(tx,ty)&&!enemyAt(tx,ty)&&!(DUNGEON.player.tx===tx&&DUNGEON.player.ty===ty);}
function spawnFireBallFX(e){
  for(let i=0;i<12;i++){
    const a=Math.random()*Math.PI*2,sp=3*Math.random();
    P(e.x,e.y,Math.cos(a)*sp,Math.sin(a)*sp,0.4,"#ff8a2e",3);
  }
}

// ============================================================
// ターン進行
// ============================================================
function moveKeyHeld(){
  return key("KeyA","ArrowLeft")||key("KeyD","ArrowRight")||key("KeyW","ArrowUp")||key("KeyS","ArrowDown");
}
function moveKeyEdge(){
  return keyP("KeyA","ArrowLeft")||keyP("KeyD","ArrowRight")||keyP("KeyW","ArrowUp")||keyP("KeyS","ArrowDown");
}
function endPlayerTurn(consumed){
  if(consumed===undefined)consumed=true;
  const p=DUNGEON.player;
  const wasMoving=p.moving;
  DUNGEON.turn++;
  if(consumed){
    p.mp=Math.min(dStats().mpMax,p.mp+2);
    SAVE.mp=p.mp;
    for(let i=0;i<3;i++)if(p.skillCd[i]>0)p.skillCd[i]--;
    if(p.guardT>0)p.guardT--;
    if(p.dashBonusT>0)p.dashBonusT--;
    if(p.flySkillCd>0)p.flySkillCd--;
    if(p.flyT>0){p.flyT--;if(p.flyT===0)UI.toast("飛翔の力が切れた…");}
    if(p.summon&&p.summon.atkBuffT>0)p.summon.atkBuffT--;
  }
  p.moving=false;
  TURN.phase="anim";
  // 移動キー長押し中の連続移動: anim待機を短縮して次の1歩を即開始(攻撃等は従来どおり)
  TURN.t=consumed?((wasMoving&&moveKeyHeld())?0.05:0.16):0.05;
  TURN.toEnemy=consumed;
  // 毒ガス: ターン消費行動ごとに、そのマスにいるならダメージ
  if(consumed&&G.screen==="dungeon")stepOnPoison();
}
function updateTurn(dt){
  const D=DUNGEON;
  if(!D||!D.player||G.screen!=="dungeon")return;
  // 移動Tween(常時: 画面表示中でも滑らかに)
  if(!G.paused)tweenEntities(dt);
  // 待機/整理/ポーズ中はターン進行しない
  if(G.paused||UI.bag||UI.gate||UI.help)return;
  // (T46) watchdog: anim/enemyフェーズが2秒以上復帰しない=ターン機構が詰まった
  // (正常はanim最大0.16s+enemy最大0.08sで解決。詰まると「移動が止まる」症状になる)
  // → 強制的にplayerへ復帰してゲームを継続させる(原因フェーズはconsoleに記録)
  if(TURN.phase==="anim"||TURN.phase==="enemy"){
    TURN._stallT=(TURN._stallT||0)+dt;
    if(TURN._stallT>2){
      try{console.warn("[turn-watchdog] phase="+TURN.phase+" が"+TURN._stallT.toFixed(1)+"s停滞 → playerへ復帰");}catch(e){}
      TURN._stallT=0;
      TURN.phase="player";
    }
  }else{
    TURN._stallT=0;
  }
  if(TURN.phase==="player"){
    handlePlayerInput();
  }else if(TURN.phase==="anim"){
    // フェーズ待ち中に"押した瞬間"の移動をバッファ(復帰時に即実行。押したままは復帰後のキー走査が引継ぐ)
    if(TURN.bufferedDir<0&&moveKeyEdge()){
      let mx=0,my=0;
      if(key("KeyA","ArrowLeft"))mx-=1;
      if(key("KeyD","ArrowRight"))mx+=1;
      if(key("KeyW","ArrowUp"))my-=1;
      if(key("KeyS","ArrowDown"))my+=1;
      TURN.bufferedDir=dirIndex(mx,my);
    }
    TURN.t-=dt;
    if(TURN.t<=0){
      if(TURN.toEnemy){
        TURN.phase="enemy";
        TURN.q=D.enemies.filter(function(e){return !e.dead;});
        TURN.i=0; // 初回tickで全敵一斉行動(バッチ)
        TURN.t=0;
      }else{
        TURN.phase="player";
      }
    }
  }else if(TURN.phase==="enemy"){
    if(TURN.bufferedDir<0&&moveKeyEdge()){
      let mx=0,my=0;
      if(key("KeyA","ArrowLeft"))mx-=1;
      if(key("KeyD","ArrowRight"))mx+=1;
      if(key("KeyW","ArrowUp"))my-=1;
      if(key("KeyS","ArrowDown"))my+=1;
      TURN.bufferedDir=dirIndex(mx,my);
    }
    if(TURN.i===0){
      // 一斉バッチ: 全敵+敵弾を同一tickで解決(各敵が見る状態は従来と同一。位置は同一フレームで確定→Tween同時開始)
      for(let j=0;j<TURN.q.length;j++){
        const e=TURN.q[j];
        if(!e.dead)enemyAct(e);
        if(G.screen!=="dungeon")break; // プレイヤー死亡等で中断
      }
      moveEbullets();
      movePbullets();
      D.enemies=D.enemies.filter(function(e){return !e.dead;});
      D.drops=D.drops.filter(function(dr){return !dr.got;});
      // 警告は突進実行まで残す(死んだ敵の分だけ掃除)
      D.warnings=D.warnings.filter(function(w){return !w.e||(!w.e.dead&&w.e.chargeWarn);});
      TURN.i=1;
      TURN.t=TURN.q.length?0.08:0; // 一斉行動後の読取り時間(敵0体: 省略)
    }else{
      TURN.t-=dt;
      if(TURN.t<=0){
        TURN.phase="player";
        D._summonPending=true;
        if(G.screen==="dungeon")checkStairsDescend();
      }
    }
  }
}
function handlePlayerInput(){
  const p=DUNGEON.player;
  const D=DUNGEON;
  let mx=0,my=0;
  if(key("KeyA","ArrowLeft"))mx-=1;
  if(key("KeyD","ArrowRight"))mx+=1;
  if(key("KeyW","ArrowUp"))my-=1;
  if(key("KeyS","ArrowDown"))my+=1;
  // 溜め中の武器: Z(発射)以外の行動でキャンセル(古代の装甲なら移動でも維持)
  const cancelCharge=function(){
    if(p.charging&&!dStats().chargeMove){
      p.charging=false;
      UI.toast("溜めが切れた");
    }
  };
  // フェーズ待ち中に押した移動を即実行(1回だけ消費。押したままなら毎フレームのキー走査が引継ぐ)
  if(TURN.bufferedDir>=0){
    cancelCharge();
    const di=TURN.bufferedDir;
    TURN.bufferedDir=-1;
    p.dirIdx=di;
    tryMovePlayer(di);
    return;
  }
  if(mx||my){
    cancelCharge();
    const di=dirIndex(mx,my);
    p.dirIdx=di;
    tryMovePlayer(di);
    return;
  }
  if(keyP("KeyZ","KeyJ")){attackAction();return;}
  if(keyP("KeyX","KeyK")){if(p.charging){p.charging=false;UI.toast("溜めが切れた");}useSkill(0);return;}
  if(keyP("KeyC","KeyL")){if(p.charging){p.charging=false;UI.toast("溜めが切れた");}useSkill(1);return;}
  if(keyP("KeyV")){if(p.charging){p.charging=false;UI.toast("溜めが切れた");}useSkill(2);return;}
  if(keyP("Digit1")){if(p.charging){p.charging=false;UI.toast("溜めが切れた");}if(quickUse("p_hp_s"))endPlayerTurn();return;}
  if(keyP("Digit2")){if(p.charging){p.charging=false;UI.toast("溜めが切れた");}if(quickUse("p_hp_l"))endPlayerTurn();return;}
  if(keyP("Digit3")){if(p.charging){p.charging=false;UI.toast("溜めが切れた");}if(quickUse("p_mp"))endPlayerTurn();return;}
  if(keyP("Space")){if(p.charging){p.charging=false;UI.toast("溜めが切れた");}endPlayerTurn();}
}
function dirIndex(mx,my){
  for(let i=0;i<8;i++){
    if(DIRS[i][0]===Math.sign(mx)&&DIRS[i][1]===Math.sign(my))return i;
  }
  return mx>0?0:mx<0?4:my>0?2:6;
}
function tryMovePlayer(di){
  const p=DUNGEON.player;
  const D=DUNGEON;
  const v=DIRS[di];
  let nx=p.tx+v[0],ny=p.ty+v[1];
  const diag=v[0]!==0&&v[1]!==0;
  if(diag&&!(pWalk(p.tx+v[0],p.ty)&&pWalk(p.tx,p.ty+v[1]))){
    // コーナーカット不可 → 直交方向に逸らす
    if(pWalk(nx,p.ty)&&!enemyAt(nx,p.ty))ny=p.ty;
    else if(pWalk(p.tx,ny)&&!enemyAt(p.tx,ny))nx=p.tx;
    else {p.dirIdx=di;return;}
  }
  // 隠し部屋の壁を踏み込む(トルネコの宝箱室)
  if(MAP.secretWall&&!D.secretOpen&&nx===MAP.secretWall.x&&ny===MAP.secretWall.y&&MAP.grid[ny][nx]===WALL){
    openSecretRoom();
    p.dirIdx=di;
    return; // そのターンは崩すことに使う(1ターン)
  }
  const e=enemyAt(nx,ny);
  if(!pWalk(nx,ny)){p.dirIdx=di;return;}
  if(e){p.dirIdx=di;return;}
  p.tx=nx;p.ty=ny;
  p.dirIdx=di;
  p.moving=true;
  // (T38) 足音2種を交互に
  D.stepFlip=(D.stepFlip||0)^1;
  playSFX(D.stepFlip?"sfx_step2.ogg":"sfx_step1.ogg",0.9);
  // トラップ部屋のスイッチ
  if(MAP.trapSwitch&&!D.trapDoorLocked&&p.tx===MAP.trapSwitch.x&&p.ty===MAP.trapSwitch.y){
    lockTrapRoom();
  }
  // 無双乱舞: 1行動で2マス
  if(p.dashBonusT>0){
    const nx2=p.tx+v[0],ny2=p.ty+v[1];
    if(pWalk(nx2,ny2)&&!enemyAt(nx2,ny2)&&!(DUNGEON.player.tx===nx2&&DUNGEON.player.ty===ny2)){
      p.tx=nx2;p.ty=ny2;
    }
  }
  collectDrops(p);
  // ハザード/トラップ(踏んだターンに発火)
  const hz=stepOnHazard();
  if(hz===2)return; // 転移で新しい階へ(ターンは新しい階でリセット)
  if(hz===1){endPlayerTurn();return;} // 尖刺/穴: ターン消費
  // トラップ部屋から出た場合(転移等)も開錠チェック
  if(MAP.trapSwitch&&D.trapDoorLocked)checkTrapRoomUnlock();
  // 階段(最終位置で判定) — 100F以外: 残敵があっても降下可。100Fのみボス撃破必須
  if(p.tx===MAP.exit.x&&p.ty===MAP.exit.y){
    if(DUNGEON.floor>=100){
      if(DUNGEON.bossDead){doClear();return;}
      UI.toast("先に魔王を倒せ!");
      endPlayerTurn();
      return;
    }
    nextFloor();
    return;
  }
  // 宝箱(1ターン) — 通常/罠箱/ミミック
  for(const c of DUNGEON.chests){
    if(!c.open&&c.tx===p.tx&&c.ty===p.ty){
      c.open=true;
      if(c.type==="mimic"){
        // 宝箱の正体はミミック! 隣に出現(隣が埋まっていれば足元)
        let sx=p.tx,sy=p.ty;
        const around=[[1,0],[-1,0],[0,1],[0,-1]];
        for(const d of around){
          const nx=p.tx+d[0],ny=p.ty+d[1];
          if(isFloor(nx,ny)&&!enemyAt(nx,ny)){sx=nx;sy=ny;break;}
        }
        const m=spawnEnemy("mimic",sx,sy,DUNGEON.floor);
        DUNGEON.enemies.push(m);
        UI.toast("宝箱が開いた——ミミックだ!!");
        playSFX("sfx_boss.ogg",1.0);
        DUNGEON.shake=8;
        for(let i=0;i<10;i++)P(c.tx*TILE+16,c.ty*TILE+16,(Math.random()-0.5)*4,-Math.random()*3,0.6,"#a8763e",3);
        endPlayerTurn();
        return;
      }
      if(c.type==="trap"){
        // 罠箱: 開くとダメージ+小判が散る
        damagePlayer(8+DUNGEON.floor);
        UI.toast("罠箱だった! 小判が散らばった…");
        playSFX("sfx_ehit.ogg",1.0);
        DUNGEON.shake=6;
        tileFlash(c.tx,c.ty,"rgba(255,210,80,");
        DUNGEON.drops.push({tx:c.tx,ty:c.ty,x:(c.tx+0.5)*TILE,y:(c.ty+0.5)*TILE,id:"gold",n:1,amount:20+Math.floor(Math.random()*30),bob:0,got:false});
        endPlayerTurn();
        return;
      }
      playSFX("sfx_pickup.ogg",0.9);
      const it=ALL_ITEMS[c.item.id];
      UI.toast("宝箱: "+it.name+" を獲得!");
      addItemEquip(c.item);
      storeSave();
      endPlayerTurn();
      return;
    }
  }
  freeTileInteract();
  endPlayerTurn();
}
function freeTileInteract(){
  const p=DUNGEON.player;
  if(MAP.savept&&p.tx===MAP.savept.x&&p.ty===MAP.savept.y){
    storeSave();
    playSFX("sfx_stairs.ogg");
    UI.toast("セーブした。この階から再挑戦できる");
  }
  if(MAP.gate&&p.tx===MAP.gate.x&&p.ty===MAP.gate.y&&!UI.gate&&!DUNGEON._gateDone){
    DUNGEON._gateDone=true;
    G.gateOpen=true;
    // (T41) 中ボス討伐ゲート=地上(町)への選択肢付き
    const isMiniGate=DUNGEON.miniGate&&DUNGEON.miniGate.x===MAP.gate.x&&DUNGEON.miniGate.y===MAP.gate.y;
    openGateMenu(false,isMiniGate);
  }
}

// ============================================================
// 敵AI (ターン制: 敵フェーズでのみ1体ずつ行動)
// ============================================================
function enemyAct(e){
  const p=DUNGEON.player;
  if(e.dead)return;
  if(e.freezeT>0){e.freezeT--;UI.float(e.x,e.y-e.r-6,"凍結","#bfe8ff",12);return;}
  const dist=chebyshev(e,p);
  // 方向インデックス(プレイヤーの方)
  e.dirIdx=dirTo(e.tx,e.ty,p.tx,p.ty);
  // (T41) 中ボス: idle=移動・攻撃しない(隣接Zで会話→戦闘)
  if(e.mini){
    if(e.mbState==="idle")return;
    mbStageCheck(e);
    bossAct(e,dist);
    return;
  }
  if(e.kind==="boss"){bossAct(e,dist);return;}
  if(e.chargeWarn){
    // 突進実行
    executeCharge(e);
    return;
  }
  if(e.kind==="chase"){
    if(dist<=1){meleeEnemy(e,1);return;}
    stepToward(e,p.tx,p.ty,false);
  }else if(e.kind==="flying"){
    if(dist<=1){meleeEnemy(e,1.1);return;}
    if(dist<=3){
      // 距離を保つ
      if(Math.random()<0.4)stepToward(e,p.tx-1,p.ty-1,true);
    }else stepToward(e,p.tx,p.ty,true);
  }else if(e.kind==="shoot"){
    e.fireCd--;
    if(e.fireCd<=0&&dist<=7&&dist>=2&&hasLOS(e.tx,e.ty,p.tx,p.ty)){
      e.fireCd=3;
      const v=DIRS[e.dirIdx];
      DUNGEON.ebullets.push({tx:e.tx+v[0],ty:e.ty+v[1],x:(e.tx+v[0]+0.5)*TILE,y:(e.ty+v[1]+0.5)*TILE,
        dx:v[0],dy:v[1],dmg:e.atk,col:e.col});
      playSFX("sfx_skill.ogg",1.3);
      return;
    }
    if(dist<3)stepToward(e,p.tx-1,p.ty-1,false);
    else if(dist>6)stepToward(e,p.tx,p.ty,false);
    else if(Math.random()<0.5)stepToward(e,p.tx,p.ty,false);
  }else if(e.kind==="charge"){
    if(dist<=1){meleeEnemy(e,1);return;}
    if(dist<=6&&Math.random()<0.45){
      // 突進予告
      const v=DIRS[e.dirIdx];
      const path=[];
      for(let k=1;k<=4;k++){
        const nx=e.tx+v[0]*k,ny=e.ty+v[1]*k;
        // (T34) 突進も穴を踏みうる(着地マスで発火)
        if(!isFloor(nx,ny)&&!(nx>=0&&ny>=0&&nx<MW&&ny<MH&&MAP.grid[ny][nx]===PIT))break;
        path.push({x:nx,y:ny});
        if(nx===p.tx&&ny===p.ty)break;
      }
      if(path.length){
        e.chargeWarn={dx:v[0],dy:v[1],path:path};
        DUNGEON.warnings.push({e:e,tx:e.tx,ty:e.ty,path:path,col:"#ff9a2e"});
        playSFX("sfx_boss.ogg",1.1);
        return;
      }
    }
    stepToward(e,p.tx,p.ty,false);
  }
}
function dirTo(x0,y0,x1,y1){
  const dx=x1-x0,dy=y1-y0;
  let best=0,bd=1e9;
  for(let i=0;i<8;i++){
    const d=Math.abs(DIRS[i][0]-dx)+Math.abs(DIRS[i][1]-dy);
    if(d<bd){bd=d;best=i;}
  }
  return best;
}
function stepToward(e,tx,ty,allowDiagCorner){
  const cands=[0,1,2,3,4,5,6,7];
  // 近い方向から
  cands.sort(function(a,b){
    const da=Math.abs(DIRS[a][0]-(tx-e.tx))+Math.abs(DIRS[a][1]-(ty-e.ty));
    const db=Math.abs(DIRS[b][0]-(tx-e.tx))+Math.abs(DIRS[b][1]-(ty-e.ty));
    return da-db;
  });
  for(const di of cands){
    const v=DIRS[di];
    const nx=e.tx+v[0],ny=e.ty+v[1];
    if(nx===e.tx&&ny===e.ty)continue;
    // (T34) 敵も穴を踏める(踏んだタイルは埋まる・ダメージ)
    if(!isFloor(nx,ny)&&!(nx>=0&&ny>=0&&nx<MW&&ny<MH&&MAP.grid[ny][nx]===PIT))continue;
    if(DUNGEON.player.tx===nx&&DUNGEON.player.ty===ny)continue;
    // (T41) 中ボスは階段マスに乗り出さない(階段を守るため)
    if(e.mini&&MAP.exit&&nx===MAP.exit.x&&ny===MAP.exit.y)continue;
    if(enemyAt(nx,ny))continue;
    const diag=v[0]!==0&&v[1]!==0;
    if(diag&&!e.flying&&!canDiag(e.tx+v[0],e.ty,e.tx,e.ty+v[1]))continue;
    e.tx=nx;e.ty=ny;
    e.dirIdx=di;
    enemyStepHazard(e); // (T34) 尖刺/穴/転移も敵が踏む
    return;
  }
}
function hasLOS(x0,y0,x1,y1){
  let x=x0,y=y0;
  while(x!==x1||y!==y1){
    let sx=Math.sign(x1-x),sy=Math.sign(y1-y);
    // 対角はどちらか先に進み、壁チェック
    if(sx!==0&&sy!==0){
      if(!isFloor(x+sx,y)||!isFloor(x,y+sy))return false;
    }else if(sx!==0){
      if(!isFloor(x+sx,y))return false;
    }else{
      if(!isFloor(x,y+sy))return false;
    }
    x+=sx;y+=sy;
  }
  return true;
}
function meleeEnemy(e,mult){
  damagePlayer(e.atk*mult);
  spawnHitFX(DUNGEON.player.x,DUNGEON.player.y);
}
function executeCharge(e){
  const p=DUNGEON.player;
  const w=e.chargeWarn;
  e.chargeWarn=null;
  DUNGEON.warnings=DUNGEON.warnings.filter(function(q){return q.e!==e;});
  let hit=false;
  for(const c of w.path){
    if(!isFloor(c.x,c.y)&&MAP.grid[c.y][c.x]!==PIT)break;
    if(enemyAt(c.x,c.y)&&!(DUNGEON.player.tx===c.x&&DUNGEON.player.ty===c.y))break;
    if(p.tx===c.x&&p.ty===c.y){hit=true;break;}
    e.tx=c.x;e.ty=c.y;
  }
  enemyStepHazard(e); // (T34) 着地マスの穴/尖刺/転移を発火
  if(hit){meleeEnemy(e,1.4);DUNGEON.shake=8;}
  else playSFX("sfx_swing.ogg",0.8);
}
// (T41) 中ボスHP段階: 初回<66%・<33%で台詞+ボイス(性別別プール)
function mbStageCheck(e){
  const ratio=e.hp/e.hpMax;
  const g=(e.mb.gender==="m"?"m_":"f_");
  if(!e.saidMid&&ratio<0.66){
    e.saidMid=true;
    const lines=MBV_LINES[g+"mid"];
    UI.speech={text:lines[Math.floor(Math.random()*lines.length)],speaker:e.name,t:3.2};
    playVoice("mbv_"+g+"mid.ogg");
  }
  if(!e.saidLow&&ratio<0.33){
    e.saidLow=true;
    const lines=MBV_LINES[g+"low"];
    UI.speech={text:lines[Math.floor(Math.random()*lines.length)],speaker:e.name,t:3.2};
    playVoice("mbv_"+g+"low.ogg");
  }
}
function bossAct(e,dist){
  const p=DUNGEON.player;
  const phase=e.hp>e.hpMax*0.5?1:2;
  e.atkCd=(e.atkCd==null?2:phase===2?e.atkCd-1:e.atkCd-1);
  if(e.chargeWarn){executeCharge(e);return;}
  if(dist<=1){meleeEnemy(e,1.2);return;}
  if(e.atkCd<=0){
    const pat=Math.random();
    if(pat<0.45){
      // 放射8方向弾
      e.atkCd=phase===2?2:3;
      for(let a=0;a<8;a++){
        const v=DIRS[a];
        const nx=e.tx+v[0],ny=e.ty+v[1];
        if(isFloor(nx,ny)&&!enemyAt(nx,ny)){
          DUNGEON.ebullets.push({tx:nx,ty:ny,x:(nx+0.5)*TILE,y:(ny+0.5)*TILE,dx:v[0],dy:v[1],dmg:Math.floor(e.atk*0.7),col:"#ff9a2e"});
        }
      }
      playSFX("sfx_boss.ogg");
    }else if(pat<0.75){
      // 突進予告
      e.atkCd=phase===2?2:3;
      const v=DIRS[e.dirIdx];
      const path=[];
      for(let k=1;k<=5;k++){
        const nx=e.tx+v[0]*k,ny=e.ty+v[1]*k;
        if(!isFloor(nx,ny))break;
        if(e.mini&&MAP.exit&&nx===MAP.exit.x&&ny===MAP.exit.y)break; // (T41) 階段マスは踏まない
        path.push({x:nx,y:ny});
        if(nx===p.tx&&ny===p.ty)break;
      }
      if(path.length){e.chargeWarn={dx:v[0],dy:v[1],path:path};DUNGEON.warnings.push({e:e,tx:e.tx,ty:e.ty,path:path,col:"#ff5a5a"});playSFX("sfx_boss.ogg",0.8);}
      else stepToward(e,p.tx,p.ty,false);
    }else{
      // 周囲AoE(半径2)
      e.atkCd=phase===2?3:4;
      if(chebyshev(e,p)<=2){
        damagePlayer(Math.floor(e.atk*0.8));
      }
      DUNGEON.shake=8;
      playSFX("sfx_boss.ogg",1.2);
      spawnHolyFX(e.x,e.y,true);
    }
  }else{
    stepToward(e,p.tx,p.ty,false);
  }
}
function moveEbullets(){
  const D=DUNGEON,p=D.player;
  const next=[];
  for(const b of D.ebullets){
    const nx=b.tx+b.dx,ny=b.ty+b.dy;
    if(!isFloor(nx,ny))continue; // 壁で消滅
    if(p.tx===nx&&p.ty===ny){
      damagePlayer(b.dmg);
      continue;
    }
    if(p.summon&&p.summon.tx===nx&&p.summon.ty===ny){
      p.summon.hp-=b.dmg;
      continue;
    }
    if(enemyAt(nx,ny))continue; // 敵に吸収
    b.tx=nx;b.ty=ny;
    b.x=(nx+0.5)*TILE;b.y=(ny+0.5)*TILE;
    next.push(b);
  }
  D.ebullets=next;
}
function movePbullets(){
  // プレイヤー弾(敵フェーズで1マス進む。shot=初命中で消滅 / bomb=着弾地点で爆発)
  const D=DUNGEON;
  const next=[];
  for(const b of D.pbullets){
    const nx=b.tx+b.dx,ny=b.ty+b.dy;
    if(b.boom){
      // 爆弾: 目標マスまで飛んで爆発
      b.dist=(b.dist||0)+1;
      if(!isFloor(nx,ny)){
        bombExplosion(b); // 壁で消滅: その場で爆発
        continue;
      }
      b.tx=nx;b.ty=ny;
      b.x=(nx+0.5)*TILE;b.y=(ny+0.5)*TILE;
      if(b.dist>=b.maxDist){
        bombExplosion(b);
        continue;
      }
      next.push(b);
      continue;
    }
    if(!isFloor(nx,ny))continue; // 壁で消滅
    const e=enemyAt(nx,ny);
    if(e){
      // 命中時に武器の属性で実ダメージを確定
      damageEnemy(e,weaponDmg(b.w,dStats(),e,b.mult||1));
      continue;
    }
    b.tx=nx;b.ty=ny;
    b.x=(nx+0.5)*TILE;b.y=(ny+0.5)*TILE;
    next.push(b);
  }
  D.pbullets=next;
}

// 環境ハザード・トラップ・隠し部屋・トラップ部屋 (T19〜T22)

function tileFlash(tx,ty,rgbaPrefix){
  DUNGEON.floats.push({tx:tx,ty:ty,x:(tx+0.5)*TILE,y:(ty+0.5)*TILE,flash:rgbaPrefix,life:0.5});

// 踏んだマスのハザード/トラップ発火: 0=なし, 1=ターン消費で終了, 2=転移(新しい階へ)
function stepOnHazard(){
  const D=DUNGEON,p=D.player;
  const t=MAP.grid[p.ty][p.tx];
  if(t===PIT){
    if(isFlying()){
      // 飛翔中: 穴の上を無傷で飛ぶ(埋まらない・ターンも消費しない)
      return 0;
    }
    // 穴: 踏んだタイルは埋まる(一発)。最大HP20%+floorダメージ
    const a=dStats();
    let dmg=Math.floor(a.hpMax*0.2)+D.floor;
    if(a.pitReduction)dmg=Math.floor(dmg*0.5);
    MAP.grid[p.ty][p.tx]=FLOOR;
    D.pitScar.push({x:p.tx,y:p.ty});
    invalidateFloor(); // (T45) 穴→床
    damagePlayer(dmg);
    UI.float(p.x,p.y-24,"穴に落ちた!","#c8a060",14);
    D.shake=8;
    tileFlash(p.tx,p.ty,"rgba(70,45,20,");
    playSFX("sfx_ehit.ogg",1.0);
    return 1;
  }
  if(D.traps){
    for(const tr of D.traps){
      if(!tr.armed||tr.tx!==p.tx||tr.ty!==p.ty)continue;
      tr.armed=false;
      if(tr.kind==="spike"){
        if(isFlying())continue; // 飛翔中: 尖刺を無効(トラップは発火しないまま)
        // 尖刺: 一発で残骸化
        damagePlayer(Math.floor(12+D.floor*1.2));
        UI.float(p.x,p.y-24,"尖刺トラップ!","#ff8a5a",14);
        D.shake=6;
        tileFlash(tr.tx,tr.ty,"rgba(255,110,50,");
        playSFX("sfx_ehit.ogg",1.0);
        return 1;
      }else if(tr.kind==="teleport"){
        // 転移: 現在階+1〜+5階へ
        UI.toast("転移の紋が光った…!");
        D.teleT=0.6;
        D.shake=6;
        playSFX("sfx_boss.ogg",0.7);
        const target=Math.min(100,D.floor+1+Math.floor(Math.random()*5));
        enterFloor(target,false);
        checkTrapRoomUnlock();
        return 2;
      }
    }
  }
  return 0;
}
// (T34) 敵がハザード/トラップを踏んだ: 穴(落下・一発)/尖刺(防御減算・一発)/転移(SAVE.teleQueueで+1..+5階へ伝達・プレイヤー到達時に出現)
function enemyStepHazard(e){
  const D=DUNGEON;
  if(!e||e.dead)return;
  if(G.screen!=="dungeon")return;
  // 穴: 敵も落ちる(タイルは埋まる・一発)。最大HP20%+floorダメージ
  if(MAP.grid[e.ty][e.tx]===PIT){
    MAP.grid[e.ty][e.tx]=FLOOR;
    D.pitScar.push({x:e.tx,y:e.ty});
    invalidateFloor(); // (T45) 穴→床
    const dmg=Math.floor(e.hpMax*0.2)+D.floor;
    UI.float(e.x,e.y-e.r-6,"穴に落ちた!","#c8a060",12);
    tileFlash(e.tx,e.ty,"rgba(70,45,20,");
    playSFX("sfx_ehit.ogg",0.8);
    damageEnemy(e,dmg);
    return;
  }
  if(D.traps){
    for(const tr of D.traps){
      if(!tr.armed||tr.tx!==e.tx||tr.ty!==e.ty)continue;
      tr.armed=false;
      if(tr.kind==="spike"){
        // 尖刺: 12+floor*1.2(防御減算・一発)
        const dmg=Math.max(1,Math.floor(12+D.floor*1.2)-e.def);
        UI.float(e.x,e.y-e.r-6,"尖刺トラップ!","#ff8a5a",12);
        tileFlash(tr.tx,tr.ty,"rgba(255,110,50,");
        playSFX("sfx_ehit.ogg",0.8);
        damageEnemy(e,dmg);
      }else if(tr.kind==="teleport"){
        // 転移: 敵は消え、+1..+5階へSAVE.teleQueueで伝達。プレイヤーがその階に到達時に出現
        const target=Math.min(100,D.floor+1+Math.floor(Math.random()*5));
        SAVE.teleQueue=SAVE.teleQueue||[];
        SAVE.teleQueue.push({floor:target,id:e.id});
        e.dead=true; // 死亡ではなく転移(ドロップ/経験なしで現階から除去)
        UI.toast(e.name+"は転移の紋に吸い込まれて消えた…");
        tileFlash(tr.tx,tr.ty,"rgba(170,90,255,");
        D.teleT=0.6;
        playSFX("sfx_warp.ogg",0.8);
        storeSave();
      }
      return;
    }
  }
}
// 毒ガス: ターン消費行動ごとに、そのマスにいるならダメージ

// スイッチ式トラップ部屋: 踏むと閉鎖+敵出現
function lockTrapRoom(){
  const D=DUNGEON;
  if(!MAP.trapDoor||D.trapDoorLocked)return;
  D.trapDoorLocked=true;
  D.trapDoorAnim=0.3;
  MAP.grid[MAP.trapDoor.y][MAP.trapDoor.x]=LOCKDOOR;
  invalidateFloor(); // (T45) 床→閉鎖ドア
  D.shake=12;
  playSFX("sfx_boss.ogg",1.1);
  UI.toast("ドォン!! トラップが発動した!");
  tileFlash(MAP.trapDoor.x,MAP.trapDoor.y,"rgba(120,80,200,");
  // 部屋内に5〜8体の敵を出現
  const r=MAP.trapRoom;
  const n=5+Math.floor(Math.random()*4);
  const themeEnemies=D.theme.enemies;
  let placed=0,tries=0;
  while(placed<n&&tries<200){
    tries++;
    const x=r.x+Math.floor(Math.random()*r.w),y=r.y+Math.floor(Math.random()*r.h);
    if(!isFloor(x,y))continue;
    if(enemyAt(x,y))continue;
    if(D.player.tx===x&&D.player.ty===y)continue;
    const id=themeEnemies[Math.floor(Math.random()*themeEnemies.length)];
    const e=spawnEnemy(id,x,y,D.floor);
    e.trapRoomEnemy=true;
    D.enemies.push(e);
    D.trapEnemies++;
    placed++;
    P((x+0.5)*TILE,(y+0.5)*TILE,0,0,0.5,"#c04a8a",4);
  }
  UI.toast("敵が "+placed+" 体出現した! 全滅するか部屋を出て脱出!");
}
// トラップ部屋: 敵全滅 or プレイヤーが部屋外 → ドア開錠
function checkTrapRoomUnlock(){
  const D=DUNGEON;
  if(!MAP.trapDoor||!D.trapDoorLocked)return;
  const r=MAP.trapRoom;
  if(!r)return;
  const alive=D.enemies.some(function(e){return !e.dead&&e.trapRoomEnemy;});
  const pInRoom=pInsideTrapRoom();
  if(!alive||!pInRoom){
    D.trapDoorLocked=false;
    D.trapDoorAnim=-0.3; // 開くアニメ
    if(MAP.grid[MAP.trapDoor.y][MAP.trapDoor.x]===LOCKDOOR){
      MAP.grid[MAP.trapDoor.y][MAP.trapDoor.x]=FLOOR;
    }
    invalidateFloor(); // (T45) 閉鎖ドア→床
    UI.toast("トラップ部屋のドアが開いた!");
    playSFX("sfx_stairs.ogg",0.9);
  }
}
function pInsideTrapRoom(){
  const r=MAP.trapRoom,p=DUNGEON.player;
  if(!r||!p)return false;
  return p.tx>=r.x&&p.tx<r.x+r.w&&p.ty>=r.y&&p.ty<r.y+r.h;
}

// ============================================================
// 召喚獣AI (ターン制: プレイヤーターンごとに自動1アクション)
// ============================================================
function summonAct(s){
  const p=DUNGEON.player;
  s.animT++;
  // 距離が離れすぎたら追走(1マス)
  if(chebyshev(s,p)>2){
    stepToward(s,p.tx,p.ty,false);
    return;
  }
  let target=null,bd=1e9;
  for(const e of DUNGEON.enemies){
    if(e.dead)continue;
    if(e.mini&&e.mbState==="idle")continue; // (T41) idle中ボスは対象外(まず挑発が必要)
    const d=chebyshev(s,e);
    if(s.ai==="stalk"){
      if(e.hp>e.hpMax*0.5&&d<bd){bd=d;target=e;}
    }else if(d<bd){bd=d;target=e;}
  }
  const atkPower=s.atk*(s.atkBuffT>0?1.5:1);
  if(target){
    s.dirIdx=dirTo(s.tx,s.ty,target.tx,target.ty);
    if(s.ai==="melee"||s.ai==="dash"){
      if(bd>1){
        stepToward(s,target.tx,target.ty,false);
      }else{
        damageEnemy(target,Math.max(1,Math.floor(atkPower-target.def*0.3)));
        playSFX("sfx_hit.ogg",1.2);
      }
    }else if(s.ai==="shoot"){
      if(bd<=5&&hasLOS(s.tx,s.ty,target.tx,target.ty)){
        damageEnemy(target,Math.max(1,Math.floor(atkPower-target.def*0.3)));
        spawnFireBallFX(target);
        playSFX("sfx_hit.ogg",1.1);
      }else stepToward(s,target.tx,target.ty,false);
    }else if(s.ai==="wall"){
      if(bd<=1){
        damageEnemy(target,Math.max(1,Math.floor(atkPower*0.8-target.def*0.3)));
        spawnGuardFX(s.x,s.y);
      }
    }else if(s.ai==="stalk"){
      if(bd<=1){
        damageEnemy(target,Math.max(1,Math.floor(atkPower*1.3-target.def*0.3)));
        playSFX("sfx_hit.ogg",1.1);
      }else stepToward(s,target.tx,target.ty,false);
    }
  }
  // 被弾(敵弾が自分所在マスに来る場合)
  for(const b of DUNGEON.ebullets){
    if(b.tx===s.tx&&b.ty===s.ty){s.hp-=b.dmg;}
  }
  if(s.hp<=0){
    UI.toast(SUMMON_BY[s.id].name+" が倒れた…");
    p.summon=null;
    spawnDeathFX(s.x,s.y,SUMMON_BY[s.id].col);
    return;
  }
  // 成長(ターンベース)
  s.actT++;
  if(s.actT>=20&&s.stage<10){
    s.actT=0;
    s.stage++;
    SAVE.summons[s.id]=s.stage;
    s.hpMax=40*SUM_STAGE.hp[s.stage-1];
    s.hp=s.hpMax;
    s.atk=8*SUM_STAGE.atk[s.stage-1];
    UI.toast(SUMMON_BY[s.id].name+" が段階"+s.stage+"に進化した!");
    spawnSummonFX(s.x,s.y,SUMMON_BY[s.id].col);
    playSFX("sfx_levelup.ogg",0.9);
  }
}

// メインアップデート
// ============================================================
const G={screen:"title",time:0,paused:false,gateOpen:false,menuSel:0,jobSel:0,help:false,gameoverReason:"",bagOpen:false};
function update(dt){
  G.time+=dt;
  if(G.paused)return;
  if(G.screen==="dungeon")updateDungeon(dt);
  else if(G.screen==="town")updateTown(dt);
  if(DUNGEON){
    for(const pt of DUNGEON.particles){pt.x+=pt.vx;pt.y+=pt.vy;pt.vy+=0.05;pt.life-=dt;}
    DUNGEON.particles=DUNGEON.particles.filter(function(p){return p.life>0;});
    for(const f of DUNGEON.floats){if(!f.flash)f.y-=30*dt;f.life-=dt;}
    DUNGEON.floats=DUNGEON.floats.filter(function(f){return f.life>0;});
    if(DUNGEON.shake>0)DUNGEON.shake=Math.max(0,DUNGEON.shake-dt*30);
    if(DUNGEON.flashT>0)DUNGEON.flashT-=dt;
    if(DUNGEON.teleT>0)DUNGEON.teleT-=dt;
    if(DUNGEON.warpT>0)DUNGEON.warpT-=dt; // (T39) スクリーン歪み(無職必殺)
    if(DUNGEON.trapDoorAnim>0)DUNGEON.trapDoorAnim=Math.max(0,DUNGEON.trapDoorAnim-dt);
    else if(DUNGEON.trapDoorAnim<0)DUNGEON.trapDoorAnim=Math.min(0,DUNGEON.trapDoorAnim+dt);
    if(DUNGEON.beams){
      for(const bm of DUNGEON.beams)bm.life-=dt;
      DUNGEON.beams=DUNGEON.beams.filter(function(bm){return bm.life>0;});
    }
  }
}
// マスム中心へピクセル位置を Tween
function tweenEntities(dt){
  const D=DUNGEON,k=Math.min(1,dt*20);
  const p=D.player;
  if(p){
    p.x+=((p.tx+0.5)*TILE-p.x)*k;
    p.y+=((p.ty+0.5)*TILE-p.y)*k;
    if(p.swing>0)p.swing-=dt;
    if(p.hitT>0)p.hitT-=dt;
    p.animT+=dt;
  }
  for(const e of D.enemies){
    e.x+=((e.tx+0.5)*TILE-e.x)*k;
    e.y+=((e.ty+0.5)*TILE-e.y)*k;
    if(e.hitT>0)e.hitT-=dt;
    e.animT+=dt;
  }
  if(p&&p.summon){
    const s=p.summon;
    s.x+=((s.tx+0.5)*TILE-s.x)*k;
    s.y+=((s.ty+0.5)*TILE-s.y)*k;
    s.animT+=dt;
  }
}
function updateDungeon(dt){
  const D=DUNGEON;
  if(!D||!D.player||G.screen!=="dungeon")return;
  D.time+=dt;
  if(TURN.phase==="player"){
    // プレイヤーターン開始時に召喚獣が行動(敵フェーズ終了直後)
    if(D._summonPending){
      D._summonPending=false;
      if(D.player.summon)summonAct(D.player.summon);
    }
  }
  updateTurn(dt);
}
function nextFloor(){
  const nf=DUNGEON.floor+1;
  if(nf>100){G.screen="clear";return;}
  enterFloor(nf,false);
}
function townActivate(t){
  if(!t)return;
  playSFX("sfx_click.ogg");
  if(t.type==="shop")UI.openShop(t.id);
  else if(t.type==="sell")UI.openSell();
  else if(t.type==="inn")UI.openInn();
  else if(t.type==="gate")openGateMenu(true);
  else if(t.type==="down")startDungeon(1);
}
// 町の選択: 行(=y)単位で2Dナビ。十字キー/方向キー/マウスをTOWN.selに統一
function townRows(){
  const rows=[];
  for(const s of TOWN.shops){
    let r=null;
    for(const rr of rows)if(Math.abs(rr[0].y-s.y)<20){r=rr;break;}
    if(!r){r=[s];rows.push(r);}
    else r.push(s);
  }
  rows.forEach(function(r){r.sort(function(a,b){return a.x-b.x;});});
  rows.sort(function(a,b){return a[0].y-b[0].y;});
  return rows;
}
function townNav(dx,dy){
  const shops=TOWN.shops;
  if(!shops.length)return;
  const rows=townRows();
  let cur=shops[TOWN.sel]||shops[0];
  let ri=0,ci=0;
  for(let i=0;i<rows.length;i++){
    const j=rows[i].indexOf(cur);
    if(j>=0){ri=i;ci=j;break;}
  }
  if(dx!==0){
    ci=(ci+dx+rows[ri].length)%rows[ri].length;
    cur=rows[ri][ci];
  }else if(dy!==0){
    const ni=Math.max(0,Math.min(rows.length-1,ri+dy));
    cur=rows[ni][Math.min(ci,rows[ni].length-1)];
  }
  TOWN.sel=Math.max(0,shops.indexOf(cur));
  playSFX("sfx_click.ogg",1.05);
}
function updateTown(dt){
  townPointer();
  if(keyR("ArrowLeft","KeyA"))townNav(-1,0);
  else if(keyR("ArrowRight","KeyD"))townNav(1,0);
  else if(keyR("ArrowUp","KeyW"))townNav(0,-1);
  else if(keyR("ArrowDown","KeyS"))townNav(0,1);
  const target=TOWN.hover||TOWN.shops[TOWN.sel];
  if(keyP("KeyZ","KeyJ","Enter","Space"))townActivate(target);
  // 薬の素早い使用 (1,2,3)
  if(keyP("Digit1"))quickUse("p_hp_s");
  if(keyP("Digit2"))quickUse("p_hp_l");
  if(keyP("Digit3"))quickUse("p_mp");
}
function quickUse(id){
  // アイテム使用で溜めはキャンセル
  if(DUNGEON&&DUNGEON.player&&DUNGEON.player.charging){DUNGEON.player.charging=false;UI.toast("溜めが切れた");}
  const it=SAVE.inv.find(function(i){return i.id===id;});
  if(!it||it.n<=0){UI.toast("所持していない");return false;}
  const def=ALL_ITEMS[id];
  const d=dStats();
  if(def.hp){
    if(SAVE.hp>=d.hpMax){UI.toast("HPは満タン");return false;}
    SAVE.hp=Math.min(d.hpMax,SAVE.hp+def.hp);
  }
  if(def.mp){
    if(SAVE.mp>=d.mpMax){UI.toast("MPは満タン");return false;}
    SAVE.mp=Math.min(d.mpMax,SAVE.mp+def.mp);
  }
  it.n--;
  if(it.n<=0)SAVE.inv.splice(SAVE.inv.indexOf(it),1);
  playSFX("sfx_potion.ogg");
  UI.float(W/2,H/2-40,"+ "+def.name,"#5aff8a",16);
  return true;
}

// (T46) ショップx座標をWに比例配置(drawTown冒頭で毎フレーム呼ぶ→画面回転にも追従)
function layoutTown(){
  for(const s of TOWN.shops)s.x=s.fx*W;
}
let mouse={x:0,y:0,down:false};
addEventListener("mousemove",function(e){mouse.x=e.clientX;mouse.y=e.clientY;});

// 座標(px,py=キャンバス座標)の下の町施設を返す(半径内)
function townShopAt(px,py){
  let best=null,bd=52;
  for(const s of TOWN.shops){
    const d=Math.hypot(px-s.x,py-s.y);
    if(d<bd){bd=d;best=s;}
  }
  return best;
}
function townPointer(){
  const r=cv.getBoundingClientRect();
  const mx=(mouse.x-r.left)/r.width*W;
  const my=(mouse.y-r.top)/r.height*H;
  TOWN.hover=townShopAt(mx,my);
  if(TOWN.hover)TOWN.sel=TOWN.shops.indexOf(TOWN.hover); // ホバーで選択も追従
}
function startDungeon(f){
  G.screen="dungeon";

  enterFloor(f,false);
}

function img(name,x,y,w,h,fb){
  const im=IMG[name];
  if(im&&im._ok)ctx.drawImage(im,x,y,w,h);
  else if(fb){
    ctx.fillStyle=fb;
    ctx.beginPath();ctx.arc(x+w/2,y+h/2,Math.min(w,h)/2.4,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle="rgba(0,0,0,.4)";ctx.stroke();
  }
}
// (T46) 全面背景: アスペクト比保持+cover(中央クロップ)で描画 — 動的W(横拡張)による引き伸ばし歪みを防止
function imgCover(name,x,y,w,h,fb){
  const im=IMG[name];
  if(im&&im._ok){
    const iw=im.naturalWidth||im.width,ih=im.naturalHeight||im.height;
    if(iw&&ih){
      const sc=Math.max(w/iw,h/ih);
      ctx.drawImage(im,x+(w-iw*sc)/2,y+(h-ih*sc)/2,iw*sc,ih*sc);
      return;
    }
  }
  if(fb){ctx.fillStyle=fb;ctx.fillRect(x,y,w,h);}
}
function panel(x,y,w,h,hi){
  ctx.fillStyle=hi?"rgba(70,52,24,.93)":"rgba(28,25,20,.88)";
  ctx.fillRect(x,y,w,h);
  ctx.strokeStyle=hi?"#ffd24a":"#6a5a30";
  ctx.lineWidth=hi?2:1;
  ctx.strokeRect(x+2,y+2,w-4,h-4);
  ctx.fillStyle=hi?"#ffd24a":"#6a5a30";
  ctx.fillRect(x,y,8,2);ctx.fillRect(x,y,2,8);
  ctx.fillRect(x+w-8,y,8,2);ctx.fillRect(x+w-2,y,2,8);
  ctx.fillRect(x,y+h-2,8,2);ctx.fillRect(x,y+h-8,2,8);
  ctx.fillRect(x+w-8,y+h-2,8,2);ctx.fillRect(x+w-2,y+h-8,2,8);
}
function wrapText(txt,x,y,mw,lh){
  let line="",yy=y;
  for(const ch of txt){
    if(ctx.measureText(line+ch).width>mw){ctx.fillText(line,x,yy);line=ch;yy+=lh;}
    else line+=ch;
  }
  if(line)ctx.fillText(line,x,yy);
}
function draw(){

  if(G.screen==="title")drawTitle();
  else if(G.screen==="job")drawJobSelect();
  else if(G.screen==="town")drawTown();
  else if(G.screen==="dungeon")drawDungeon();
  else if(G.screen==="gameover")drawGameOver();
  else if(G.screen==="clear")drawClear();
  drawHUD();
  drawOverlays();
  drawToast();
  drawSpeechBubble();

}

// マップ全体の静的床(床/壁/柱/穴/水base/毒base/2.5D影)をオフスクリーンキャンバスに1回だけ描画。

// 動的要素(毒泡/水の揺らぎ/穴の痕/隠し壁の光)は毎フレーム重ね描画(drawFloorDynamics)。
let FLOOR_CV=null,FLOOR_CTX=null,FLOOR_DIRTY=true,FLOOR_DYNAMIC=null;

function renderFloorCache(){
  const c=FLOOR_CTX;

        const vv=(((x*73856093)^(y*19349663))>>>0)%100;
        let tileIm=floorIm;
        if(t===FLOOR){
          if(vv<10)tileIm=IMG["tile_grass.png"];

        else{
          c.fillStyle=(x+y)%2?"#4a4436":"#423c30";
          c.fillRect(px,py,TILE,TILE);
        }
        c.fillStyle="rgba(255,240,200,.07)";
        c.fillRect(px,py,TILE,TILE);
        if(t===POISON){
          // 毒ガスbase(ゆらぎの平均αで固定; 縁の泡は動的オーバーレイ)
