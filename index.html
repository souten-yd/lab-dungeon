          c.fillRect(px,py,TILE,TILE);
          const pEdge=(x>0&&MAP.grid[y][x-1]===FLOOR)||(x<MW-1&&MAP.grid[y][x+1]===FLOOR)||
            (y>0&&MAP.grid[y-1][x]===FLOOR)||(y<MH-1&&MAP.grid[y+1][x]===FLOOR);
          if(pEdge)poisonEdge.push(x,y);
        }
        if(t===PIT){
          // 穴: 暗い落ち窪み
          c.fillStyle="rgba(10,6,2,.88)";
          c.fillRect(px+1,py+1,TILE-2,TILE-2);
          c.fillStyle="rgba(0,0,0,.9)";
          c.beginPath();c.ellipse(px+16,py+18,11,9,0,0,Math.PI*2);c.fill();
          c.fillStyle="rgba(255,220,150,.14)";
          c.beginPath();c.ellipse(px+16,py+14,11,4,0,0,Math.PI*2);c.fill();
        }
        // 2.5D: 上の壁からの影(南隣が壁なら床の上部が暗い)
        if(y>0&&(MAP.grid[y-1][x]===WALL||MAP.grid[y-1][x]===PILLAR)){
          const grd=c.createLinearGradient(0,py,0,py+10);
          grd.addColorStop(0,"rgba(0,0,0,.45)");
          grd.addColorStop(1,"rgba(0,0,0,0)");
          c.fillStyle=grd;
          c.fillRect(px,py,TILE,10);
        }
      }else if(t===PILLAR){
        // ---- 柱: 床+2.5Dブロック ----
        if(floorIm&&floorIm._ok)c.drawImage(floorIm,px,py,TILE,TILE);
        else{c.fillStyle=(x+y)%2?"#4a4436":"#423c30";c.fillRect(px,py,TILE,TILE);}
        // 長影(右下)
        c.fillStyle="rgba(0,0,0,.3)";
        c.beginPath();c.ellipse(px+22,py+26,14,7,0,0,Math.PI*2);c.fill();
        // 柱体
        c.fillStyle="#6b6558";
        c.fillRect(px+5,py-4,TILE-10,TILE-4);
        c.fillStyle="rgba(255,255,255,.18)";
        c.fillRect(px+5,py-4,TILE-10,4);
        c.fillStyle="rgba(0,0,0,.3)";
        c.fillRect(px+5,py+TILE-12,TILE-10,8);
        // 2.5D: 南隣が床なら前側面
        if(y+1<MH&&(MAP.grid[y+1][x]===FLOOR||MAP.grid[y+1][x]===POISON||MAP.grid[y+1][x]===PIT)){
          c.fillStyle="#4a453c";
          c.fillRect(px+5,py+TILE-8,TILE-10,10);
          c.fillStyle="rgba(255,255,255,.06)";
          c.fillRect(px+5,py+TILE-8,TILE-10,2);
        }
      }else if(t===LOCKDOOR){
        // ---- 閉鎖ドア(トラップ部屋) ----
        if(wallIm&&wallIm._ok)c.drawImage(wallIm,px,py,TILE,TILE);
        else{c.fillStyle="#17140f";c.fillRect(px,py,TILE,TILE);}
        c.fillStyle="#5a5248";
        c.fillRect(px+3,py-4,TILE-6,TILE+4);
        c.fillStyle="rgba(255,255,255,.12)";
        c.fillRect(px+3,py-4,TILE-6,3);
        c.fillStyle="rgba(0,0,0,.4)";
        c.fillRect(px+3,py+TILE-6,TILE-6,6);
        // 鉄の帯
        c.fillStyle="rgba(40,40,46,.85)";
        c.fillRect(px+3,py+6,TILE-6,4);
        c.fillRect(px+3,py+TILE-12,TILE-6,4);
        c.fillStyle="rgba(255,200,120,.25)";
        c.fillRect(px+TILE/2-2,py+TILE/2-2,4,4);
      }else if(t===WATER){
        // ---- 水面 (T29): 水タイル+水際暗化(base; 波のゆらぎは動的オーバーレイ) ----
        const wIm=IMG["tile_water.png"];
        if(wIm&&wIm._ok)c.drawImage(wIm,px,py,TILE,TILE);
        else{c.fillStyle="#1c3a5a";c.fillRect(px,py,TILE,TILE);}
        c.fillStyle="rgba(4,12,26,.4)";
        if(x>0&&(MAP.grid[y][x-1]===FLOOR||MAP.grid[y][x-1]===POISON||MAP.grid[y][x-1]===PIT))c.fillRect(px,py,4,TILE);
        if(x<MW-1&&(MAP.grid[y][x+1]===FLOOR||MAP.grid[y][x+1]===POISON||MAP.grid[y][x+1]===PIT))c.fillRect(px+TILE-4,py,4,TILE);
        if(y>0&&(MAP.grid[y-1][x]===FLOOR||MAP.grid[y-1][x]===POISON||MAP.grid[y-1][x]===PIT))c.fillRect(px,py,TILE,4);
        if(y<MH-1&&(MAP.grid[y+1][x]===FLOOR||MAP.grid[y+1][x]===POISON||MAP.grid[y+1][x]===PIT))c.fillRect(px,py+TILE-4,TILE,4);
        waterTiles.push(x,y);
      }else{
        // ---- 壁(2.5D: 南隣が床なら「面」を描画) ----
        const belowWalk=y+1<MH&&(MAP.grid[y+1][x]===FLOOR||MAP.grid[y+1][x]===POISON||MAP.grid[y+1][x]===PIT||MAP.grid[y+1][x]===WATER);
        const isSecret=MAP.secretWall&&!(DUNGEON&&DUNGEON.secretOpen)&&MAP.secretWall.x===x&&MAP.secretWall.y===y;
        if(belowWalk){

          else{c.fillStyle="#17140f";c.fillRect(px,py-6,TILE,TILE);}
          c.fillStyle="rgba(0,0,0,.42)";
          c.fillRect(px,py-6,TILE,TILE-8);
          c.fillStyle="rgba(255,255,255,.14)";
          c.fillRect(px,py-6,TILE,3);
          // 前側面(下の床に8px食い込む立体ブロック)
          c.fillStyle="rgba(0,0,0,.34)";
          c.fillRect(px,py+TILE-8,TILE,16);
          c.fillStyle="rgba(255,255,255,.05)";
          c.fillRect(px,py+TILE-8,TILE,2);
          // 右隣が壁なら右端面(角の立体感)
          if(x+1<MW&&MAP.grid[y][x+1]===WALL){
            c.fillStyle="rgba(255,255,255,.04)";
            c.fillRect(px+TILE-4,py-6,4,TILE+8);
          }
          if(isSecret){
            // 隠し部屋の手がかり: 壁面がわずかに明るい(光は動的オーバーレイ)
            c.fillStyle="rgba(255,240,200,.10)";
            c.fillRect(px,py-6,TILE,TILE+8);
          }
        }else{
          if(wallIm&&wallIm._ok)c.drawImage(wallIm,px,py,TILE,TILE);
          else{c.fillStyle="#17140f";c.fillRect(px,py,TILE,TILE);}
          c.fillStyle="rgba(0,0,0,.42)";
          c.fillRect(px,py,TILE,TILE);
          c.fillStyle="rgba(255,255,255,.12)";
          c.fillRect(px,py,TILE,3);
          c.fillStyle="rgba(0,0,0,.55)";
          c.fillRect(px,py+TILE-4,TILE,4);
          if(isSecret){
            c.fillStyle="rgba(255,240,200,.10)";
            c.fillRect(px,py,TILE,TILE);
          }
        }
      }
    }
  }
  FLOOR_DYNAMIC={poisonEdge:poisonEdge,water:waterTiles};
}
function ensureFloorCache(){
  if(!FLOOR_CV){
    FLOOR_CV=document.createElement("canvas");
    FLOOR_CV.width=MW*TILE;FLOOR_CV.height=MH*TILE;
    FLOOR_CTX=FLOOR_CV.getContext("2d");
    renderFloorCache();
  }else if(FLOOR_DIRTY){
    renderFloorCache();
  }

}
// (T45) 動的床オーバーレイ: 毒泡/水の揺らぎ/穴の痕/隠し壁の光(表示域のみ)
function drawFloorDynamics(x0,y0,x1,y1){
  const D=DUNGEON,dy=FLOOR_DYNAMIC;
  if(!dy)return;
  // 毒ガスの泡(縁タイルのみ)
  if(dy.poisonEdge.length){
    ctx.fillStyle="rgba(160,255,120,.55)";
    for(let i=0;i<dy.poisonEdge.length;i+=2){
      const x=dy.poisonEdge[i],y=dy.poisonEdge[i+1];
      if(x<x0||x>=x1||y<y0||y>=y1)continue;
      const px=x*TILE,py=y*TILE;
      for(let bi=0;bi<3;bi++){
        const bx=px+6+((bi*11+x*7+y*5)%20),by=py+28-((G.time*14+bi*9+x*3)%26);
        ctx.beginPath();ctx.arc(bx,by,1.6+bi*0.6,0,Math.PI*2);ctx.fill();
      }
    }
  }
  // 波のゆらぎ
  if(dy.water.length){
    ctx.strokeStyle="rgba(190,225,255,.22)";
    ctx.lineWidth=1.5;
    const wt=G.time*0.8;
    for(let i=0;i<dy.water.length;i+=2){
      const x=dy.water[i],y=dy.water[i+1];
      if(x<x0||x>=x1||y<y0||y>=y1)continue;
      const px=x*TILE,py=y*TILE;
      for(let wi=0;wi<2;wi++){
        const wy=py+9+wi*13+Math.sin(wt*2+x*0.9+wi*2.4)*2;
        const wx=px+((wt*10+wi*16+x*7)%TILE);
        ctx.beginPath();ctx.moveTo(wx,wy);ctx.lineTo(wx+8,wy);ctx.stroke();
      }
    }
  }
  // 埋まった穴の痕(踏んだあと)
  if(D.pitScar&&D.pitScar.length){
    ctx.fillStyle="rgba(0,0,0,.35)";
    for(let si=0;si<D.pitScar.length;si++){
      const s=D.pitScar[si];
      if(s.x<x0||s.x>=x1||s.y<y0||s.y>=y1)continue;
      ctx.beginPath();ctx.ellipse(s.x*TILE+16,s.y*TILE+18,10,7,0,0,Math.PI*2);ctx.fill();
    }
  }
  // 隠し壁の光(見透かしメガネ獲得時のみ)
  if(MAP.secretWall&&!D.secretOpen&&SAVE&&SAVE.eyeOpen){
    const sx=MAP.secretWall.x,sy=MAP.secretWall.y;
    if(sx>=x0&&sx<x1&&sy>=y0&&sy<y1){
      const belowWalk=sy+1<MH&&(MAP.grid[sy+1][sx]===FLOOR||MAP.grid[sy+1][sx]===POISON||MAP.grid[sy+1][sx]===PIT||MAP.grid[sy+1][sx]===WATER);
      drawSecretGlow(sx*TILE,belowWalk?sy*TILE-6:sy*TILE,TILE,belowWalk?TILE+8:TILE);
    }
  }
}
function drawDungeon(){
  const D=DUNGEON;
  if(!D)return;
  const P=D.player;
  const viewW=W/ZOOM,viewH=H/ZOOM;
  const camX=Math.max(0,Math.min(MW*TILE-viewW,P.x-viewW/2));
  const camY=Math.max(0,Math.min(MH*TILE-viewH,P.y-viewH/2));
  ctx.save();
  const shx=(Math.random()-0.5)*D.shake,shy=(Math.random()-0.5)*D.shake;
  ctx.translate(-camX*ZOOM+shx,-camY*ZOOM+shy);
  ctx.scale(ZOOM,ZOOM);
  const th=D.theme;
  const x0=Math.floor(camX/TILE),y0=Math.floor(camY/TILE);
  const x1=Math.min(MW,Math.ceil((camX+viewW)/TILE)+1);
  const y1=Math.min(MH,Math.ceil((camY+viewH)/TILE)+1);
  // ---- (T45) 床レイヤーキャッシュ: タイル毎ループをdrawImage 1回に置換 ----
  ensureFloorCache();
  ctx.drawImage(FLOOR_CV,camX,camY,viewW,viewH,camX,camY,viewW,viewH);
  drawFloorDynamics(x0,y0,x1,y1);
  // ---- トラップ(尖刺/転移) ----
  if(D.traps){
    for(const tr of D.traps){
      const px=tr.tx*TILE,py=tr.ty*TILE;
      if(tr.kind==="spike"){
        if(tr.armed){
          // 尖刺: 見える(4本のスパイク)
          ctx.fillStyle="rgba(0,0,0,.25)";
          ctx.fillRect(px+2,py+2,TILE-4,TILE-4);
          for(let si=0;si<4;si++){
            const sx=px+7+(si%2)*14,sy=py+7+Math.floor(si/2)*14;
            ctx.fillStyle="#b8b8c0";
            ctx.beginPath();ctx.moveTo(sx-4,sy+6);ctx.lineTo(sx,sy-6);ctx.lineTo(sx+4,sy+6);ctx.closePath();ctx.fill();
            ctx.fillStyle="rgba(255,255,255,.5)";
            ctx.fillRect(sx-1,sy-4,2,6);
          }
        }else{
          // 残骸(解除済み)
          ctx.fillStyle="rgba(120,120,130,.35)";
          for(let si=0;si<3;si++){
            const sx=px+8+si*7,sy=py+16+(si%2)*4;
            ctx.fillRect(sx,sy,3,5);
          }
        }
      }else if(tr.kind==="teleport"){
        if(tr.armed){
          // 転移の紋(紫色のルーン)
          const pa=0.5+0.3*Math.sin(G.time*4+tr.tx);
          ctx.fillStyle="rgba(120,60,200,"+pa*0.35+")";
          ctx.fillRect(px+3,py+3,TILE-6,TILE-6);
          ctx.strokeStyle="rgba(190,120,255,"+pa+")";
          ctx.lineWidth=2;
          ctx.beginPath();ctx.arc(px+16,py+16,9,0,Math.PI*2);ctx.stroke();
          ctx.beginPath();ctx.arc(px+16,py+16,4,0,Math.PI*2);ctx.stroke();
        }else{
          // 残骸(消えた紋の痕)
          ctx.strokeStyle="rgba(120,60,200,.3)";
          ctx.lineWidth=1.5;
          ctx.beginPath();ctx.arc(px+16,py+16,8,0,Math.PI*2);ctx.stroke();
        }
      }
    }
  }
  // ---- トラップ部屋のドア(開いた状態)とスイッチ ----
  if(MAP.trapDoor&&!D.trapDoorLocked){
    const px=MAP.trapDoor.x*TILE,py=MAP.trapDoor.y*TILE;
    // 開いた石のドア(左右に半分開)
    ctx.fillStyle="#5a5248";
    ctx.fillRect(px,py-2,7,TILE+2);
    ctx.fillRect(px+TILE-7,py-2,7,TILE+2);
    ctx.fillStyle="rgba(0,0,0,.4)";
    ctx.fillRect(px,py+TILE-4,7,4);
    ctx.fillRect(px+TILE-7,py+TILE-4,7,4);
  }
  if(MAP.trapSwitch&&!D.trapDoorLocked){
    const px=MAP.trapSwitch.x*TILE,py=MAP.trapSwitch.y*TILE;
    const sa=0.6+0.3*Math.sin(G.time*5);
    ctx.fillStyle="rgba(200,40,60,"+(0.25+0.15*Math.sin(G.time*5))+")";
    ctx.fillRect(px+4,py+4,TILE-8,TILE-8);
    ctx.strokeStyle="rgba(255,80,100,"+sa+")";
    ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(px+16,py+16,8,0,Math.PI*2);ctx.stroke();
    ctx.fillStyle="rgba(255,120,140,"+sa+")";
    ctx.beginPath();ctx.arc(px+16,py+16,3.5,0,Math.PI*2);ctx.fill();
  }
  ctx.fillStyle=th.tint;ctx.globalAlpha=0.14;
  ctx.fillRect(camX,camY,viewW,viewH);
  ctx.globalAlpha=1;
  // 突進警告(赤い経路)
  const t=G.time;
  for(const w of D.warnings){
    const a=0.25+0.2*Math.sin(t*10);
    for(const c of w.path){
      ctx.fillStyle="rgba(255,70,50,"+a+")";

      ctx.restore();
    }
  }
  // ビーム(レーザー/波動)
  if(D.beams){
    for(const bm of D.beams){
      const a=Math.max(0,bm.life/bm.max);

      ctx.lineWidth=(bm.w||6)*a+1;
      ctx.beginPath();ctx.moveTo(bm.x0,bm.y0);ctx.lineTo(bm.x1,bm.y1);ctx.stroke();
      ctx.globalAlpha=a*0.5;
      ctx.lineWidth=((bm.w||6)*2.2)*a+1;
      ctx.strokeStyle="rgba(255,255,255,.8)";
      ctx.beginPath();ctx.moveTo(bm.x0,bm.y0);ctx.lineTo(bm.x1,bm.y1);ctx.stroke();
      ctx.globalAlpha=1;

  }
  for(const pt of D.particles){

    else if(pt.ring){ctx.strokeStyle=pt.col;ctx.lineWidth=pt.lw||3;ctx.beginPath();ctx.arc(pt.x,pt.y,pt.r,0,Math.PI*2);ctx.stroke();}

  }
  ctx.globalAlpha=1;
  // 溜め中のオーラ
  if(P&&P.charging){

    ctx.lineWidth=3;

    for(let i=0;i<6;i++){

      ctx.fillStyle="rgba(255,210,74,"+ca+")";
      ctx.beginPath();ctx.arc(P.x+Math.cos(a)*24,P.y+Math.sin(a)*24,2,0,Math.PI*2);ctx.fill();
    }
  }
  ctx.textAlign="center";
  for(const f of D.floats){
    if(f.flash){
      // タイルフラッシュ(罠/ハザード発火)
      ctx.globalAlpha=Math.min(1,f.life*2);
      ctx.fillStyle=f.flash+"0.8)";
      ctx.fillRect(f.tx*TILE,f.ty*TILE,TILE,TILE);
      continue;
    }
    ctx.globalAlpha=Math.min(1,f.life*2);
    ctx.fillStyle=f.col;
    ctx.font="bold "+(f.size||14)+"px sans-serif";
    ctx.fillText(f.txt,f.x,f.y);
  }
  ctx.globalAlpha=1;
  ctx.restore();
  // スクリーンオーバーレイ: 閃光(白)/転移(紫)
  if(D.flashT>0){
    ctx.fillStyle="rgba(255,255,240,"+Math.min(0.9,D.flashT*3.5)+")";
    ctx.fillRect(0,0,W,H);
  }
  if(D.teleT>0){
    ctx.fillStyle="rgba(120,50,200,"+Math.min(0.85,D.teleT*2.2)+")";
    ctx.fillRect(0,0,W,H);
  }
  // スクリーン歪み(無職必殺「万象崩し」)
  if(D.warpT>0){
    const wt=Math.min(1,D.warpT*2);
    for(let i=0;i<6;i++){
      const y0=(i/6)*H+Math.sin(G.time*22+i*1.9)*10*wt;
      ctx.fillStyle="rgba(170,60,255,"+(0.10*wt)+")";
      ctx.fillRect(0,y0,W,10+10*wt);
    }
  }
  // スクリーン空間: HUD情報
  ctx.textAlign="left";
  ctx.fillStyle="rgba(255,215,122,.85)";ctx.font="bold 16px sans-serif";
  ctx.fillText(D.floor+"F  "+D.theme.name,14,24);
  ctx.fillStyle="rgba(200,190,150,.6)";ctx.font="12px sans-serif";
  ctx.fillText("ターン "+D.turn,14,42);
  if(TURN.phase!=="player"){
    ctx.fillStyle="rgba(126,200,255,.7)";
    ctx.fillText(TURN.phase==="enemy"?"敵のターン…":"",14,58);
  }
  // ボスHPバー((T41)中ボスも対象)
  for(const e of D.enemies){
    if((e.id==="boss_karaage"||e.mini)&&!e.dead){
      ctx.fillStyle="rgba(0,0,0,.7)";
      ctx.fillRect(W/2-250,H-42,500,14);
      ctx.fillStyle=e.mini?e.col:"#e8942e";
      ctx.fillRect(W/2-248,H-40,496*Math.max(0,e.hp/e.hpMax),10);
      ctx.fillStyle="#ffd97a";ctx.font="bold 14px sans-serif";ctx.textAlign="center";
      ctx.fillText(e.mini?e.name+" [中ボス]":"唐揚げ魔王",W/2,H-48);
      break;
    }
  }
}

// スプライト描画: 待機=1フレーム+バウンド / 移動=2フレーム切替
function spriteFrame(base,walkId,moving){
  if(moving&&walkId&&IMG[walkId]&&IMG[walkId]._ok&&Math.floor(G.time*9)%2===1)return IMG[walkId];
  return IMG[base];
}
// (T46) スプライトの着色シルエット(不透明部分のみ) — 初回生成後はImageオブジェクトにキャッシュ
// 被弾フラッシュ用。旧: 白い矩形オーバーレイ(透過四隅まで白くなる→「背景が白くなる」バグ)
// 毎フレームコストはdrawImage 1回のみ(旧ctx.filter方式より軽量)
function tintOf(im,cacheProp,css){
  if(!im||!im._ok)return null;
  const cached=im[cacheProp];
  if(cached)return cached;
  const w=im.naturalWidth||im.width,h=im.naturalHeight||im.height;
  if(!w||!h)return null;
  const cv2=document.createElement("canvas");
  cv2.width=w;cv2.height=h;
  const c2=cv2.getContext("2d");
  c2.drawImage(im,0,0,w,h);
  c2.globalCompositeOperation="source-in";
  c2.fillStyle=css;
  c2.fillRect(0,0,w,h);
  im[cacheProp]=cv2;
  return cv2;
}
function drawEnemy(e){
  const s=e.size/2;
  const bob=Math.sin(G.time*3+e.animT*2)*2;
  const flash=e.hitT>0;
  ctx.save();
  ctx.translate(e.x,e.y+bob);
  if(e.freezeT>0){
    ctx.fillStyle="rgba(150,220,255,.35)";
    ctx.beginPath();ctx.arc(0,0,e.r+5,0,Math.PI*2);ctx.fill();
    ctx.fillStyle="rgba(220,245,255,.9)";ctx.font="bold 12px sans-serif";ctx.textAlign="center";
    ctx.fillText("❄",0,-e.r-8);
  }
  ctx.fillStyle="rgba(0,0,0,.35)";
  ctx.beginPath();ctx.ellipse(0,e.r*0.7,e.r*0.8,e.r*0.35,0,0,Math.PI*2);ctx.fill();
  if(e.id==="mimic"){
    // ミミック: 宝箱の体+顎+眼
    const cm=IMG["chest.png"];
    if(cm&&cm._ok){
      ctx.drawImage(cm,-e.r,-e.r,e.r*2,e.r*2);
      // (T46) 被弾フラッシュ: 白いシルエット(不透明部分のみ) — 旧矩形オーバーレイは透過四隅も白く塗るバグ
      if(flash){const ws=tintOf(cm,"_white","#fff");if(ws)ctx.drawImage(ws,-e.r,-e.r,e.r*2,e.r*2);}
    }else{
      ctx.fillStyle=flash?"#fff":"#8a6a30";
      ctx.fillRect(-e.r,-e.r,e.r*2,e.r*2);
    }
    const jaw=Math.abs(Math.sin(G.time*6))*4;
    ctx.fillStyle="#5a3a1a";
    ctx.fillRect(-e.r+2,e.r*0.15,e.r*2-4,4+jaw);
    ctx.fillStyle="#fff";
    for(let ti=0;ti<4;ti++)ctx.fillRect(-e.r+5+ti*(e.r*2-10)/3,e.r*0.15+2,3,3+jaw*0.5);
    ctx.fillStyle="#ff3040";
    ctx.beginPath();ctx.arc(0,-e.r*0.4,3,0,Math.PI*2);ctx.fill();
    ctx.restore();
    if(e.hp<e.hpMax){
      const w=e.r*2;
      ctx.fillStyle="rgba(0,0,0,.6)";
      ctx.fillRect(e.x-w/2,e.y-e.r-10,w,4);
      ctx.fillStyle="#e04040";
      ctx.fillRect(e.x-w/2,e.y-e.r-10,w*Math.max(0,e.hp/e.hpMax),4);
    }
    return;
  }
  const isBoss=e.id==="boss_karaage"||e.mini;
  const moving=Math.hypot((e.tx+0.5)*TILE-e.x,(e.ty+0.5)*TILE-e.y)>2;
  const im=spriteFrame(e.id+".png",e.id+"_walk.png",moving);
  if(im&&im._ok){
    const flip=DIRS[e.dirIdx][0]<0?-1:1;
    const sc=isBoss?1.6:1;
    ctx.scale(flip*sc,sc);
    ctx.drawImage(im,-s/2,-s/2,s,s);
    // (T46) 被弾フラッシュ: 白いシルエット(不透明部分のみ) — 旧矩形オーバーレイは透過四隅も白く塗るバグ
    if(flash){const ws=tintOf(im,"_white","#fff");if(ws)ctx.drawImage(ws,-s/2,-s/2,s,s);}
  }else{
    ctx.fillStyle=flash?"#fff":e.col;
    ctx.beginPath();ctx.arc(0,0,e.r,0,Math.PI*2);ctx.fill();
    ctx.fillStyle="rgba(0,0,0,.5)";
    ctx.beginPath();ctx.arc(-e.r*0.3,-2,2.5,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(e.r*0.3,-2,2.5,0,Math.PI*2);ctx.fill();
  }
  ctx.restore();
  if(e.hp<e.hpMax&&!isBoss){
    const w=e.r*2;
    ctx.fillStyle="rgba(0,0,0,.6)";
    ctx.fillRect(e.x-w/2,e.y-e.r-10,w,4);
    ctx.fillStyle="#e04040";
    ctx.fillRect(e.x-w/2,e.y-e.r-10,w*Math.max(0,e.hp/e.hpMax),4);
  }
  if(e.chargeWarn){
    ctx.fillStyle="rgba(255,90,60,.95)";ctx.font="bold 13px sans-serif";ctx.textAlign="center";
    ctx.fillText("⚠突進",e.x,e.y-e.r-16);
  }
}
function drawSummonSprite(s){

function drawPlayer(P){
  const t=G.time;
  const ang=dirAngle(P.dirIdx);
  const v=DIRS[P.dirIdx];
  const moving=Math.hypot((P.tx+0.5)*TILE-P.x,(P.ty+0.5)*TILE-P.y)>2;
  const flying=isFlying();
  const bob=moving?Math.sin(t*16)*2:(flying?Math.sin(t*4)*4-6:Math.sin(t*3)*1.5);
  const flash=P.hitT>0;
  ctx.save();
  // 向いているマスのハイライト(世界座標: 常に正確な対象マス)
  ctx.fillStyle="rgba(255,210,90,.10)";
  ctx.fillRect((P.tx+v[0])*TILE+3,(P.ty+v[1])*TILE+3,TILE-6,TILE-6);
  ctx.translate(P.x,P.y);
  // 影: 飛翔中は浮いていて影が小さい
  ctx.fillStyle=flying?"rgba(0,0,0,.22)":"rgba(0,0,0,.35)";
  ctx.beginPath();ctx.ellipse(0,flying?13:10,flying?8:12,flying?3.5:5,0,0,Math.PI*2);ctx.fill();
  const im=spriteFrame(SAVE.job+".png",SAVE.job+"_walk.png",moving);
  const s=34;
  if(im&&im._ok){
    const flip=DIRS[P.dirIdx][0]<0?-1:1;
    ctx.save();
    ctx.translate(0,bob);
    ctx.scale(flip,1);
    ctx.drawImage(im,-s/2,-s/2,s,s);
    // (T46) 被弾フラッシュ(暗転): 暗色シルエット(不透明部分のみ) — 旧矩形オーバーレイは透過四隅も塗るバグ
    if(flash){const ds=tintOf(im,"_dark","rgba(20,30,60,.75)");if(ds)ctx.drawImage(ds,-s/2,-s/2,s,s);}
    ctx.restore();
  }else{
    ctx.save();
    ctx.translate(0,bob);
    ctx.fillStyle=flash?"#fff":"#5a8ad0";
    ctx.beginPath();ctx.arc(0,0,13,0,Math.PI*2);ctx.fill();
    ctx.restore();
  }
  // 向きを示す矢印(スプライトのscale空間の外で描画)
  ctx.rotate(ang);
  ctx.fillStyle="rgba(255,215,122,.8)";
  ctx.beginPath();
  ctx.moveTo(26,0);ctx.lineTo(19,-5);ctx.lineTo(19,5);
  ctx.closePath();ctx.fill();
  ctx.rotate(-ang);
  if(P.swing>0){
    const prog=1-P.swing/0.22;
    const a=ang-1.2+prog*2.4;
    ctx.strokeStyle="rgba(255,255,255,.85)";
    ctx.lineWidth=4;
    ctx.beginPath();ctx.arc(0,bob,24,a-0.5,a+0.5);ctx.stroke();
  }
  ctx.restore();
  if(P.guardT>0){
    ctx.strokeStyle="rgba(140,230,255,"+(0.4+0.4*Math.sin(t*10))+")";
    ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(P.x,P.y,22,0,Math.PI*2);ctx.stroke();
  }
  if(P.dashBonusT>0){
    ctx.fillStyle="rgba(255,90,90,"+(0.2+0.2*Math.sin(t*12))+")";
    ctx.beginPath();ctx.arc(P.x,P.y,20,0,Math.PI*2);ctx.fill();
  }
  if(isFlying()){
    // 飛翔: 足元の光の輪+羽の粒子
    ctx.strokeStyle="rgba(190,230,255,"+(0.35+0.3*Math.sin(t*8))+")";
    ctx.lineWidth=2;
    ctx.beginPath();ctx.ellipse(P.x,P.y+11,15,6,0,0,Math.PI*2);ctx.stroke();
    if(Math.random()<0.25)globalThis.P(P.x+(Math.random()-0.5)*18,P.y+6,(Math.random()-0.5)*0.8,-0.6,0.5,"#d8efff",1.5); // パラメータPがグローバルのパーティクル関数を隠蔽するためglobalThis経由
  }
}

}
function pad8Release(b){
  for(const k of b.d){
    TOUCH.ref[k]=Math.max(0,(TOUCH.ref[k]||0)-1);
    if(!TOUCH.ref[k])VK[k]=0;
  }
  mergeVK();
}
function canvasPos(cx,cy){
  const r=cv.getBoundingClientRect();
  // (T47) アスペクトガード: 回転遷移中、CSS rectの縦横比がバッファ(W/H)と一時的に異なる場合がある。
  // そのままrectをWに単純スケーリングすると指位置がずれる(=報告の「全部ズレる」)。
  // 2%以上食い違う場合はrectの実アスペクトでcontain正規化してからW座標へ(画面端の対応が正しくなる)
  if(r.width>0&&r.height>0){
    const ra=r.width/r.height,ba=W/H;
    if(Math.abs(ra-ba)/ba>0.02){
      const s=Math.min(r.width/W,r.height/H);
      if(s>0){
        const ox=(r.width-W*s)/2,oy=(r.height-H*s)/2;
        return {x:((cx-r.left)-ox)/s,y:((cy-r.top)-oy)/s};
      }
    }
  }
  return {x:(cx-r.left)/r.width*W,y:(cy-r.top)/r.height*H};
}
cv.addEventListener("touchstart",function(e){
  e.preventDefault();
  IS_TOUCH=true;
  layoutTouchUI(); // (T46) 動的W(画面回転)に追従
  const TOL=touchTol(); // (T47) 回転直後は+20%許容
  for(const t of e.changedTouches){
    const p=canvasPos(t.clientX,t.clientY);
    mouse.x=t.clientX;mouse.y=t.clientY;
    let used=false;
    for(const b of ABTN){
      if(TOUCH.btn[b.k]===undefined&&Math.hypot(p.x-b.x,p.y-b.y)<=b.r*TOL+10){
        TOUCH.btn[b.k]=t.identifier;
        if(b.k==="wait"){
          if(G.screen==="dungeon"&&TURN.phase==="player")endPlayerTurn();
        }else if(b.k==="bag"){
          if(G.screen==="dungeon"||G.screen==="town")toggleBag();
        }else{
          VK[b.k]=1;mergeVK();
        }
        used=true;break;
      }
    }
    if(used)continue;
    if(G.screen!=="dungeon"){
      for(const pd of PADMENU){
        if(TOUCH.pad[pd.k]===undefined&&Math.hypot(p.x-pd.x2,p.y-pd.y2)<=34*TOL){
          TOUCH.pad[pd.k]=t.identifier;
          VK[pd.k]=1;mergeVK();
          used=true;break;
        }
      }
    }
    if(used)continue;
    if(G.screen==="dungeon"){
      for(const pd of PAD8POS){
        if(TOUCH.pad8[pd.i]===undefined&&Math.hypot(p.x-pd.x,p.y-pd.y)<=pd.r*TOL+10){
          TOUCH.pad8[pd.i]=t.identifier;
          pad8Press(pd);
          used=true;break;
        }
      }
    }
    if(used)continue;
    if(JOY.id===-1&&Math.hypot(p.x-JOY.bx,p.y-JOY.by)<=110*TOL){
      JOY.id=t.identifier;
      joyMove(p.x,p.y);
      continue;
    }
    if(G.screen==="town"){
      const hit=townShopAt(p.x,p.y);
      if(hit){
        TOWN.sel=TOWN.shops.indexOf(hit);
        townActivate(hit);
        window.SUPCLICK=true;
      }
    }
  }
},{passive:false});
function joyMove(x,y){
  let dx=x-JOY.bx,dy=y-JOY.by;
  const d=Math.hypot(dx,dy);
  if(d>JOY.r){dx=dx/d*JOY.r;dy=dy/d*JOY.r;}
  JOY.kx=dx;JOY.ky=dy;
  if(G.screen!=="dungeon")joySet(dx,dy);
}
cv.addEventListener("touchmove",function(e){
  e.preventDefault();
  for(const t of e.changedTouches){
    if(JOY.id===t.identifier){
      const p=canvasPos(t.clientX,t.clientY);
      joyMove(p.x,p.y);
    }
  }
},{passive:false});
function touchEnd(e){
  for(const t of e.changedTouches){
    if(JOY.id===t.identifier){joyRelease();continue;}
    for(const k in TOUCH.btn){
      if(TOUCH.btn[k]===t.identifier){
        TOUCH.btn[k]=undefined;
        if(k!=="wait"&&k!=="bag"){VK[k]=0;mergeVK();}
      }
    }
    for(const k in TOUCH.pad){
      if(TOUCH.pad[k]===t.identifier){TOUCH.pad[k]=undefined;VK[k]=0;mergeVK();}
    }
    for(const k in TOUCH.pad8){
      if(TOUCH.pad8[k]===t.identifier){
        TOUCH.pad8[k]=undefined;
        const b=PAD8POS[+k];
        if(b)pad8Release(b);
      }
    }
  }
}
cv.addEventListener("touchend",touchEnd,{passive:false});
cv.addEventListener("touchcancel",touchEnd,{passive:false});
function drawTouchUI(){
  if(!IS_TOUCH)return;
  layoutTouchUI(); // (T46) 動的W(画面回転)に追従
  const menu=G.screen!=="dungeon";
  ctx.save();
  const MENU_ANG={up:Math.PI*1.5,down:Math.PI*0.5,left:Math.PI,right:0};
  if(menu){
    for(const pd of PADMENU){
      const on=!!VK[pd.k];
      ctx.fillStyle=on?"rgba(255,210,74,.45)":"rgba(255,255,255,.10)";
      ctx.beginPath();ctx.arc(pd.x2,pd.y2,26,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle="rgba(255,255,255,.35)";ctx.lineWidth=2;ctx.stroke();
      drawPadArrow(pd.x2,pd.y2,16,MENU_ANG[pd.k]);
    }
  }else{
    for(const pd of PAD8POS){
      const on=pd.d.some(function(k){return !!VK[k];});
      ctx.fillStyle=on?"rgba(255,210,74,.45)":"rgba(255,255,255,.10)";
      ctx.beginPath();ctx.arc(pd.x,pd.y,pd.r,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle="rgba(255,255,255,.35)";ctx.lineWidth=2;ctx.stroke();
      drawPadArrow(pd.x,pd.y,14,pd.ang);
    }
  }
  for(const b of ABTN){
    const on=!!VK[b.k];
    ctx.fillStyle=on?"rgba(255,170,50,.5)":"rgba(255,255,255,.10)";
    ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle="rgba(255,255,255,.35)";ctx.lineWidth=2;ctx.stroke();
    ctx.fillStyle="rgba(255,255,255,.9)";
    ctx.font="bold "+(b.r>36?20:14)+"px sans-serif";
    ctx.textAlign="center";ctx.textBaseline="middle";
    ctx.fillText(b.lb,b.x,b.y+1);
  }
  const act=JOY.id!==-1;
  ctx.fillStyle="rgba(255,255,255,.07)";
  ctx.beginPath();ctx.arc(JOY.bx,JOY.by,JOY.r,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle="rgba(255,255,255,.25)";ctx.lineWidth=2;ctx.stroke();
  ctx.fillStyle=act?"rgba(255,210,74,.55)":"rgba(255,255,255,.18)";
  ctx.beginPath();ctx.arc(JOY.bx+JOY.kx,JOY.by+JOY.ky,24,0,Math.PI*2);ctx.fill();
  ctx.restore();
}

// ============================================================
// メインループ
// ============================================================
let lastT=0;
function loop(ts){
  const dt=Math.min(0.05,(ts-lastT)/1000||0.016);
  lastT=ts;
  FRAME_DT=dt;
  mergeVK();
  update(dt);
  draw();
  if(IS_TOUCH)drawTouchUI();
  syncKeys();
  requestAnimationFrame(loop);
}
// (T44) 最初のユーザー操作でBGM再生を再試行(モバイルの自動再生ブロック対策)
// キー操作は既存keydownハンドラ内でunlockAudio()を呼ぶ(上記参照)
window.addEventListener("pointerdown",unlockAudio);
window.addEventListener("touchstart",unlockAudio);
function boot(){
  const s=loadSave();
  SAVE=s;
  setupTown();
  if(SAVE)UI.toast("セーブデータを読み込んだ");
  playBGM("bgm_title.ogg");
  requestAnimationFrame(loop);
}
boot();
</script>
