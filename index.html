// ---------- 再生ヘルパ ----------
let bgmNow=null,bgmLoop=false;
function playBGM(n,loop){
  if(loop===undefined)loop=true;
  const a=AUD[n];
  if(!a||!a.src)return;
  if(bgmNow&&bgmNow!==a){try{bgmNow.pause();}catch(e){}}
  bgmNow=a;bgmLoop=loop;
  try{a.currentTime=0;a.playbackRate=1;}catch(e){}
  const p=a.play();
  if(p&&p.then)p.then(function(){if(bgmLoop)a.loop=true;}).catch(function(){});
  if(bgmLoop)a.loop=true;
}
function stopBGM(){if(bgmNow){try{bgmNow.pause();}catch(e){}bgmNow=null;}}
// SFXプール: 同時に最大5本まで重ね再生(ターン制では連打が多い)
function playSFX(n,rate){
  const base=AUD[n];if(!base||!base.src)return;
  const pool=base._pool||(base._pool=[]);
  let a=pool[base._pi||0];
  base._pi=((base._pi||0)+1)%5;
  if(!a){
    try{a=new Audio(base.src);pool.push(a);}catch(e){return;}
  }
  try{a.currentTime=0;a.playbackRate=rate||1;a.play().catch(function(){});}catch(e){}
}
function playVoice(n){const a=AUD[n];if(!a||!a.src)return;try{a.currentTime=0;a.play().catch(function(){});}catch(e){}}

const K={},KPHYS={};
// 仮想キー(モバイルタッチ): K = 物理(KPHYS) OR 仮想(VK) として統合
const VK={w:0,a:0,s:0,d:0,z:0,x:0,c:0,v:0,up:0,down:0,left:0,right:0};
const VKCODE={w:"KeyW",a:"KeyA",s:"KeyS",d:"KeyD",z:"KeyZ",x:"KeyX",c:"KeyC",v:"KeyV",up:"ArrowUp",down:"ArrowDown",left:"ArrowLeft",right:"ArrowRight"};
const VKREV={};
for(const k in VKCODE)VKREV[VKCODE[k]]=k;
function mergeVK(){
  for(const k in VKCODE)K[VKCODE[k]]=!!(KPHYS[VKCODE[k]]||VK[k]);
}
addEventListener("keydown",function(e){
  KPHYS[e.code]=true;
  mergeVK();
  if(["Space","ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].indexOf(e.code)>=0)e.preventDefault();
  if(e.code==="Tab"||e.code==="KeyI"){
    e.preventDefault();
    if(G.screen==="dungeon"||G.screen==="town")toggleBag();
    return;
  }
  if(e.code==="KeyP"||e.code==="Escape"){
    if(UI.bag){closeBag();return;}
    UI.togglePause();
  }
});
addEventListener("keyup",function(e){
  KPHYS[e.code]=false;
  mergeVK();
});
const KPREV={};
function key(){
  for(let i=0;i<arguments.length;i++)if(K[arguments[i]])return true;
  return false;
}
function keyP(){
  for(let i=0;i<arguments.length;i++)if(K[arguments[i]]&&!KPREV[arguments[i]])return true;
  return false;
}
function syncKeys(){
  for(const c in K)KPREV[c]=K[c];
  for(const c in KPREV)if(!K[c])KPREV[c]=false;
}
let FRAME_DT=1/60;
const REPST={};
function keyR(){
  for(let i=0;i<arguments.length;i++){
    const c=arguments[i];
    if(!K[c]){REPST[c]=0;continue;}
    if(!KPREV[c]){REPST[c]=0;return true;}
    let r=REPST[c];
    r+=FRAME_DT;
    if(r<0.4){REPST[c]=r;continue;}
    r-=0.4;
    if(r>=0.12){REPST[c]=r-0.12;return true;}
    REPST[c]=r;
  }
  return false;
}

let SAVE=null;
function newSave(jobId){
  const j=JOBS[jobId];
  return {
    job:jobId,lv:1,xp:0,gold:300,
    hp:j.base.hp,mp:j.base.mp,
    stats:Object.assign({},j.base),
    equip:{weapon:null,armor:null,ring:null},
    inv:[{id:"p_hp_s",n:3},{id:"p_mp",n:1}],
    mastery:{},
    magicXp:0,
    summons:{},
    bossDown:false,
    floorsVisited:{},
    maxFloor:1,
    cleared:false,
    savedAt:null
  };
}
function loadSave(){try{const s=localStorage.getItem("karaage_dungeon_save");if(s)return JSON.parse(s);}catch(e){}return null;}
function storeSave(){try{localStorage.setItem("karaage_dungeon_save",JSON.stringify(SAVE));SAVE.savedAt=Date.now();}catch(e){}}
function clearSave(){try{localStorage.removeItem("karaage_dungeon_save");}catch(e){}}

// 派生ステータス
function dStats(){
  const s=SAVE,base=s.stats;
  let atk=base.atk,mag=base.mag,def=base.def,spd=base.spd;
  const w=s.equip.weapon&&ALL_ITEMS[s.equip.weapon];
  if(w){atk+=w.atk;mag+=w.mag||0;}
  const a=s.equip.armor&&ALL_ITEMS[s.equip.armor];
  if(a)def+=a.def;
  const r=s.equip.ring&&ALL_ITEMS[s.equip.ring];
  if(r){atk+=r.atk||0;mag+=r.mag||0;def+=r.def||0;spd+=r.spd||0;}
  if(s.job==="hero"&&w){const m=s.mastery[w.id]||0;atk+=m*1.5;mag+=m;}
  if(s.job==="mage"){mag+=Math.min(10,s.magicXp)*1.2;}
  if(s.job==="unjob"){atk+=s.lv*0.4;mag+=s.lv*0.4;}
  return {atk:atk,mag:mag,def:def,spd:spd,hpMax:base.hp,mpMax:base.mp};
}
function xpNeed(lv){return Math.floor(60*Math.pow(lv,1.35));}
function gainXp(n){
  SAVE.xp+=n;
  let lv=SAVE.lv,changed=false;
  while(SAVE.xp>=xpNeed(lv)){
    SAVE.xp-=xpNeed(lv);lv++;changed=true;
    const g=JOBS[SAVE.job].grow;
    SAVE.stats.hp+=g.hp;SAVE.stats.mp+=g.mp;
    SAVE.stats.atk+=g.atk;SAVE.stats.mag+=g.mag;
    SAVE.stats.def+=g.def;SAVE.stats.spd+=g.spd;
  }
  if(changed){
    SAVE.lv=lv;
    const d=dStats();
    SAVE.hp=Math.min(d.hpMax,SAVE.hp+d.hpMax*0.4);
    playSFX("sfx_levelup.ogg");
    UI.toast("レベルアップ! Lv."+lv);
    UI.flashLv=1;
  }
}
function addItem(id,n){
  if(n===undefined)n=1;
  const ex=SAVE.inv.find(function(i){return i.id===id;});
  if(ex)ex.n+=n;else SAVE.inv.push({id:id,n:n});
  const it=ALL_ITEMS[id];
  if(it)UI.toast(it.name+" を入手");
}

// ============================================================
// マップ生成 (破綻ゼロ保証: MST接続+BFS検証+フォールバック)
// ============================================================
const WALL=0,FLOOR=1;
const MAP={grid:null,floor:1,seed:0,rooms:[],entry:null,exit:null,gate:null,savept:null,theme:null};
function genMap(floor,seed){
  const rng=mulberry32(((seed*7349+floor*104729)|0)>>>0);
  for(let att=0;att<10;att++){
    const g=genAttempt(floor,rng);
    if(g&&validateMap(g)){
      MAP.grid=g.grid;MAP.rooms=g.rooms;MAP.entry=g.entry;MAP.exit=g.exit;
      MAP.gate=(floor%10===0)?g.gate:null;
      MAP.savept=(floor%10===0)?g.savept:null;
      MAP.floor=floor;MAP.seed=seed;MAP.theme=themeOf(floor);
      return;
    }
  }
  const g=fallbackMap();
  MAP.grid=g.grid;MAP.rooms=g.rooms;MAP.entry=g.entry;MAP.exit=g.exit;
  MAP.gate=(floor%10===0)?{x:g.exit.x-1,y:g.exit.y}:null;
  MAP.savept=(floor%10===0)?{x:g.exit.x+1,y:g.exit.y}:null;
  MAP.floor=floor;MAP.seed=seed;MAP.theme=themeOf(floor);
}
function genAttempt(floor,rng){
  const grid=Array.from({length:MH},function(){return new Array(MW).fill(WALL);});
  const rooms=[];
  const NR=Math.min(14,8+Math.floor(floor/12));
  let guard=0;
  while(rooms.length<NR&&guard<500){
    guard++;
    const rw=3+Math.floor(rng()*5),rh=3+Math.floor(rng()*5);
    const rx=1+Math.floor(rng()*(MW-rw-2)),ry=1+Math.floor(rng()*(MH-rh-2));
    let ok=true;
    for(let i=0;i<rooms.length;i++){
      const r=rooms[i];
      if(rx<r.x+r.w+1&&rx+rw+1>r.x&&ry<r.y+r.h+1&&ry+rh+1>r.y){ok=false;break;}
    }
    if(!ok)continue;
    rooms.push({x:rx,y:ry,w:rw,h:rh,cx:rx+Math.floor(rw/2),cy:ry+Math.floor(rh/2)});
    for(let y=ry;y<ry+rh;y++)for(let x=rx;x<rx+rw;x++)grid[y][x]=FLOOR;
  }
  if(rooms.length<5)return null;
  // MST(Prim)で全部屋接続 → 完全接続保証
  const connected=[0];
  const rest=rooms.map(function(_,i){return i;}).filter(function(i){return i!==0;});
  while(rest.length){
    let bi=0,bj=0,bd=1e9;
    for(let ci of connected){
      for(let ri of rest){
        const d=Math.abs(rooms[ci].cx-rooms[ri].cx)+Math.abs(rooms[ci].cy-rooms[ri].cy);
        if(d<bd){bd=d;bi=ci;bj=ri;}
      }
    }
    carveCorridor(grid,rooms[bi],rooms[bj],rng);
    connected.push(bj);rest.splice(rest.indexOf(bj),1);
  }
  // 環状通路
  const loops=Math.max(1,Math.floor(rooms.length*0.15));
  for(let i=0;i<loops;i++){
    const a=rooms[Math.floor(rng()*rooms.length)],b=rooms[Math.floor(rng()*rooms.length)];
    if(a!==b)carveCorridor(grid,a,b,rng);
  }
  const entry=rooms[0];
  let far=rooms[0],fd=-1;
  for(const r of rooms){
    const d=Math.abs(r.cx-entry.cx)+Math.abs(r.cy-entry.cy);
    if(d>fd){fd=d;far=r;}
  }
  let gate=null,savept=null;
  if(floor%10===0){
    const cells=[];
    for(let y=far.y;y<far.y+far.h;y++)for(let x=far.x;x<far.x+far.w;x++)cells.push({x:x,y:y});
    if(cells.length>=4){gate={x:cells[0].x,y:cells[0].y};savept={x:cells[1].x,y:cells[1].y};}
    else{gate={x:far.cx,y:far.cy};savept={x:far.cx+1,y:far.cy};}
  }
  return {grid:grid,rooms:rooms,entry:{x:entry.cx,y:entry.cy},exit:{x:far.cx,y:far.cy},gate:gate,savept:savept};
}
function carveCorridor(g,a,b,rng){
  const horizFirst=rng()<0.5;
  const x0=a.cx,y0=a.cy,x1=b.cx,y1=b.cy;
  const carve=function(x,y){if(x>0&&y>0&&x<MW-1&&y<MH-1)g[y][x]=FLOOR;};
  if(horizFirst){
    for(let x=Math.min(x0,x1);x<=Math.max(x0,x1);x++)carve(x,y0);
    for(let y=Math.min(y0,y1);y<=Math.max(y0,y1);y++)carve(x1,y);
  }else{
    for(let y=Math.min(y0,y1);y<=Math.max(y0,y1);y++)carve(x0,y);
    for(let x=Math.min(x0,x1);x<=Math.max(x0,x1);x++)carve(x,y1);
  }
}
function validateMap(g){
  const seen=new Set([g.entry.y*MW+g.entry.x]);
  const q=[[g.entry.x,g.entry.y]];
  while(q.length){
    const c=q.shift(),x=c[0],y=c[1];
    const dirs=[[1,0],[-1,0],[0,1],[0,-1]];
    for(const d of dirs){
      const nx=x+d[0],ny=y+d[1];
      if(nx<0||ny<0||nx>=MW||ny>=MH)continue;
      const k=ny*MW+nx;
      if(seen.has(k)||g.grid[ny][nx]!==FLOOR)continue;
      seen.add(k);q.push([nx,ny]);
    }
  }
  if(!seen.has(g.exit.y*MW+g.exit.x))return false;
  if(g.gate&&!seen.has(g.gate.y*MW+g.gate.x))return false;
  if(g.savept&&!seen.has(g.savept.y*MW+g.savept.x))return false;
  return true;
}
function fallbackMap(){
  const grid=Array.from({length:MH},function(){return new Array(MW).fill(WALL);});
  for(let x=2;x<MW-2;x++){grid[14][x]=FLOOR;grid[15][x]=FLOOR;}
  const rooms=[{x:2,y:13,w:5,h:3,cx:4,cy:14},{x:MW-7,y:13,w:5,h:3,cx:MW-5,cy:14}];
  return {grid:grid,rooms:rooms,entry:{x:4,y:14},exit:{x:MW-5,y:14}};
}
function isFloor(x,y){return x>=0&&y>=0&&x<MW&&y<MH&&MAP.grid[y][x]===FLOOR;}

// ============================================================
// ダンジョン状態 (ターン制・マス目)
// ============================================================
let DUNGEON=null;
const TURN={phase:"player",t:0,q:null,i:0,busy:false};
function enterFloor(floor,fromGate){
  genMap(floor,RUN_SEED);
  const rng=mulberry32((RUN_SEED^floor*2654435761|0)>>>0);
  const theme=themeOf(floor);
  const enemies=[];
  const drops=[];
  const isBossFloor=(floor===100);
  const cells=[];
  for(let y=0;y<MH;y++)for(let x=0;x<MW;x++)if(isFloor(x,y))cells.push({x:x,y:y});
  const occupied={};
  occupied[MAP.entry.y*MW+MAP.entry.x]=1;
  occupied[MAP.exit.y*MW+MAP.exit.x]=1;
  if(MAP.gate)occupied[MAP.gate.y*MW+MAP.gate.x]=1;
  if(MAP.savept)occupied[MAP.savept.y*MW+MAP.savept.x]=1;
  // 宝箱(マス1つ)
  const chests=[];
  const nCh=2+Math.floor(rng()*2);
  for(let i=0;i<nCh;i++){
    const c=cells[Math.floor(rng()*cells.length)];
    const d=Math.abs(c.x-MAP.entry.x)+Math.abs(c.y-MAP.entry.y);
    if(d<5||occupied[c.y*MW+c.x])continue;
    occupied[c.y*MW+c.x]=1;
    chests.push({tx:c.x,ty:c.y,open:false,item:pickChestItem(floor,rng)});
  }
  // 敵(マス1つ、重複禁止)
  const eCount=isBossFloor?6:Math.min(24,6+Math.floor(floor*0.22));
  let placed=0,tries=0;
  while(placed<eCount&&tries<800){
    tries++;
    const c=cells[Math.floor(rng()*cells.length)];
    const d=Math.abs(c.x-MAP.entry.x)+Math.abs(c.y-MAP.entry.y);
    if(d<6||occupied[c.y*MW+c.x])continue;
    occupied[c.y*MW+c.x]=1;
    const pool=theme.enemies;
    const id=pool[Math.floor(rng()*pool.length)];
    enemies.push(spawnEnemy(id,c.x,c.y,floor));
    placed++;
  }
  if(isBossFloor){
    // ボスは階段の隣の床マスに
    let bt=null;
    for(let dy=-1;dy<=1&&!bt;dy++)for(let dx=-1;dx<=1;dx++){
      const bx=MAP.exit.x+dx,by=MAP.exit.y+dy;
      if(isFloor(bx,by)&&!occupied[by*MW+bx]){bt={x:bx,y:by};break;}
    }
    if(!bt)bt={x:MAP.entry.x,y:MAP.entry.y};
    enemies.push(spawnEnemy("boss_karaage",bt.x,bt.y,floor));
  }
  // ドロップ(マス1つ、敵と重複可)
  const dCount=8+Math.floor(rng()*6);
  for(let i=0;i<dCount;i++){
    const c=cells[Math.floor(rng()*cells.length)];
    const d=Math.abs(c.x-MAP.entry.x)+Math.abs(c.y-MAP.entry.y);
    if(d<3)continue;
    drops.push(makeDrop(c.x,c.y,floor,rng));
  }
  DUNGEON={
    floor:floor,theme:theme,enemies:enemies,drops:drops,chests:chests,
    ebullets:[],particles:[],floats:[],
    player:null,time:0,shake:0,turn:1,
    bossDead:false,clearDone:false,
    warnings:[]
  };
  DUNGEON.player=makePlayer(MAP.entry.x,MAP.entry.y);
  TURN.phase="player";TURN.q=null;TURN.i=0;TURN.t=0;TURN.busy=false;
  collectDrops(DUNGEON.player);
  SAVE.floorsVisited[floor]=true;
  if(floor>SAVE.maxFloor)SAVE.maxFloor=floor;
  if(floor%10===0)UI.toast(floor+"F: セーブポイントとワープゲート");
  playBGM(floor===100?"bgm_boss.ogg":"bgm_dungeon.ogg");
  if(!fromGate)playSFX("sfx_stairs.ogg");
  UI.toast(floor+"F "+theme.name+" (ターン制)");
  if(floor===100)playVoice("voice_boss_in.ogg");
}
function spawnEnemy(id,tx,ty,floor){
  const base=EBY[id];
  const scale=1+(floor-1)*0.045;
  const lvBonus=SAVE?1+Math.max(0,SAVE.lv-1)*0.03:1;
  const hp=Math.floor(base.hp*scale*lvBonus);
  return {
    id:id,name:base.name,tx:tx,ty:ty,
    x:(tx+0.5)*TILE,y:(ty+0.5)*TILE,
    r:base.r,
    hp:hp,hpMax:hp,
    atk:Math.floor(base.atk*(1+(floor-1)*0.03)),
    def:Math.floor(base.def*(1+(floor-1)*0.02)),
    spd:base.spd,xp:Math.floor(base.xp*(1+(floor-1)*0.02)),
    gold:[base.gold[0],base.gold[1]],
    kind:base.kind,theme:base.theme,col:base.col,
    dirIdx:4,
    fireCd:2+Math.floor(Math.random()*2),
    chargeWarn:null,chargePath:null,
    hitT:0,freezeT:0,dead:false,animT:Math.random()*6,
    flying:base.kind==="flying",
    size:base.size
  };
}
function makePlayer(tx,ty){
  return {
    tx:tx,ty:ty,
    x:(tx+0.5)*TILE,y:(ty+0.5)*TILE,
    r:13,hp:SAVE.hp,mp:SAVE.mp,
    dirIdx:0,swing:0,
    skillCd:[0,0,0],
    hitT:0,guardT:0,dashBonusT:0,
    summon:null,
    animT:0,moving:false
  };
}
function makeDrop(tx,ty,floor,rng){
  const t=rng();
  let id;
  if(t<0.34)id="p_hp_s";
  else if(t<0.50)id="p_mp";
  else if(t<0.64)id="gold";
  else if(t<0.80)id="exp";
  else if(t<0.90)id="s_mat";
  else if(t<0.96)id="p_hp_l";
  else id="gold";
  let n=1,amount=0;
  if(id==="gold")amount=5+Math.floor(rng()*(8+floor*0.8));
  if(id==="exp")amount=10+Math.floor(rng()*15+floor*0.5);
  if(id==="p_hp_s")n=1+Math.floor(rng()*2);
  return {tx:tx,ty:ty,x:(tx+0.5)*TILE,y:(ty+0.5)*TILE,id:id,n:n,amount:amount,bob:rng()*6,got:false};
}
function pickChestItem(floor,rng){
  const tier=Math.min(6,1+Math.floor(floor/18));
  const w=WEAPONS.filter(function(it){return it.tier<=tier;});
  const a=ARMORS.filter(function(it){return it.tier<=tier;});
  const r=rng();
  if(r<0.45)return {kind:"weapon",id:w[Math.floor(rng()*w.length)].id};
  if(r<0.75)return {kind:"armor",id:a[Math.floor(rng()*a.length)].id};
  if(r<0.90)return {kind:"ring",id:RINGS[Math.floor(rng()*RINGS.length)].id};
  return {kind:"weapon",id:WEAPONS[Math.min(WEAPONS.length-1,Math.floor(rng()*(tier+1)))].id};
}
// 装備: 旧装備はバックパックへ退避
function addItemEquip(item){
  const slot=item.kind;
  const old=SAVE.equip[slot];
  if(old)SAVE.inv.push({id:old,n:1});
  SAVE.equip[slot]=item.id;
  const it=ALL_ITEMS[item.id];
  if(it)UI.toast("装備: "+it.name);
}
function itemSlotOf(def){
  if(WEAPONS.indexOf(def)>=0)return "weapon";
  if(ARMORS.indexOf(def)>=0)return "armor";
  if(RINGS.indexOf(def)>=0)return "ring";
  return null;
}
function equipFromBag(invIdx){
  const it=SAVE.inv[invIdx];
  if(!it)return false;
  const def=ALL_ITEMS[it.id];
  const realSlot=itemSlotOf(def);
  if(!realSlot)return false;
  const old=SAVE.equip[realSlot];
  SAVE.inv.splice(invIdx,1);
  if(old)SAVE.inv.push({id:old,n:1});
  SAVE.equip[realSlot]=it.id;
  UI.toast("装備: "+def.name);
  return true;
}
// マス占有判定
function enemyAt(tx,ty){
  for(const e of DUNGEON.enemies)if(!e.dead&&e.tx===tx&&e.ty===ty)return e;
  return null;
}
function canStep(tx,ty,ignoreEnemy){
  if(!isFloor(tx,ty))return false;
  if(DUNGEON.player.tx===tx&&DUNGEON.player.ty===ty)return false;
  const e=enemyAt(tx,ty);
  if(e&&!ignoreEnemy)return false;
  return true;
}
function canDiag(ax,ay,bx,by){
  // (ax,ay)=水平ステップ, (bx,by)=垂直ステップ — 両方が床でないと対角不可
  return isFloor(ax,ay)&&isFloor(bx,by);
}
// 足元のドロップ収集(自由)
function collectDrops(p){
  for(const dr of DUNGEON.drops){
    if(dr.got||dr.tx!==p.tx||dr.ty!==p.ty)continue;
    dr.got=true;
    if(dr.id==="gold"){
      SAVE.gold+=dr.amount;
      playSFX("sfx_pickup.ogg",1.1);
      UI.float(p.x,p.y-16,"+"+dr.amount+"G","#ffd24a",13);
    }else if(dr.id==="exp"){
      gainXp(dr.amount);
      playSFX("sfx_pickup.ogg",1.2);
      UI.float(p.x,p.y-16,"+"+dr.amount+"EXP","#7ec8ff",13);
    }else{
      addItem(dr.id,dr.n);
      playSFX("sfx_pickup.ogg");
    }
  }
}
// 敵フェーズ終了後: 階段に立ち止まっていた場合の降下(100Fのみボス撃破必須)
function checkStairsDescend(){
  const p=DUNGEON.player;
  if(p.tx===MAP.exit.x&&p.ty===MAP.exit.y){
    if(DUNGEON.floor>=100){
      if(DUNGEON.bossDead)doClear();
      return;
    }
    nextFloor();
  }
}
function doClear(){
  G.screen="clear";
  stopBGM();
  playBGM("bgm_clear.ogg");
  playVoice("voice_clear.ogg");
  playSFX("sfx_victory.ogg");
  SAVE.cleared=true;
  if(!SAVE.equip.weapon||!ALL_ITEMS[SAVE.equip.weapon].legend)SAVE.equip.weapon="w_holy";
  if(!SAVE.equip.armor||!ALL_ITEMS[SAVE.equip.armor].legend)SAVE.equip.armor="a_crown";
  storeSave();
}

// ============================================================
// 戦闘 (ターン制)
// ============================================================
function calcMeleeDmg(atk,def){
  return Math.max(1,Math.floor(atk*(0.85+Math.random()*0.3)-def*0.5));
}
function attackAction(){
  const p=DUNGEON.player,d=dStats();
  p.swing=0.22;
  const v=DIRS[p.dirIdx];
  const e=enemyAt(p.tx+v[0],p.ty+v[1]);
  let hitAny=false;
  if(e){
    damageEnemy(e,calcMeleeDmg(d.atk,e.def));
    hitAny=true;
  }
  if(hitAny)playSFX("sfx_hit.ogg");else playSFX("sfx_swing.ogg");
  if(SAVE.job==="hero"&&SAVE.equip.weapon){
    SAVE.mastery[SAVE.equip.weapon]=(SAVE.mastery[SAVE.equip.weapon]||0)+0.1;
  }
  spawnArcFX(p.x,p.y,dirAngle(p.dirIdx),hitAny);
  endPlayerTurn();
}
function damageEnemy(e,dmg){
  if(e.dead)return;
  e.hp-=dmg;e.hitT=0.18;
  UI.float(e.x,e.y-e.r-6,"-"+dmg,"#ffd24a",14);
  spawnHitFX(e.x,e.y);
  if(e.hp<=0)killEnemy(e);
}
function killEnemy(e){
  e.dead=true;
  playSFX("sfx_ehit.ogg",0.9);
  spawnDeathFX(e.x,e.y,e.col);
  const g=e.gold[0]+Math.floor(Math.random()*(e.gold[1]-e.gold[0]+1));
  DUNGEON.drops.push({tx:e.tx,ty:e.ty,x:e.x,y:e.y,id:"gold",n:1,amount:g,bob:0,got:false});
  DUNGEON.drops.push({tx:e.tx,ty:e.ty,x:e.x,y:e.y,id:"exp",n:1,amount:e.xp,bob:0,got:false});
  if(Math.random()<0.12)DUNGEON.drops.push({tx:e.tx,ty:e.ty,x:e.x,y:e.y,id:"p_hp_s",n:1,amount:0,bob:0,got:false});
  gainXp(Math.floor(e.xp*0.5));
  if(e.id==="boss_karaage"){
    DUNGEON.bossDead=true;
    SAVE.bossDown=true;
    playSFX("sfx_boss.ogg");
    playVoice("voice_boss_die.ogg");
    DUNGEON.shake=14;
  }
}
function damagePlayer(dmg){
  const p=DUNGEON.player;
  if(!p||G.screen!=="dungeon")return;
  if(p.guardT>0){
    dmg=Math.max(1,Math.floor(dmg*0.25));
    playSFX("sfx_guard.ogg");
    spawnGuardFX(p.x,p.y);
  }
  const d=dStats();
  const real=Math.max(1,Math.floor(dmg-d.def*0.6));
  p.hp-=real;
  SAVE.hp=p.hp;
  p.hitT=0.25;
  DUNGEON.shake=6;
  playSFX("sfx_ehit.ogg",1.1);
  UI.float(p.x,p.y-20,"-"+real,"#ff5a5a",16);
  spawnHitFX(p.x,p.y);
  if(p.hp<=0){p.hp=0;SAVE.hp=0;onDeath();}
}
function onDeath(){
  stopBGM();
  playSFX("sfx_death.ogg");
  SAVE.gold=0;
  SAVE.equip={weapon:null,armor:null,ring:null};
  SAVE.inv=[];
  storeSave();
  G.screen="gameover";
  UI.gameoverReason="全ての装備・金・アイテムを失った…(レベルと解放した階は保持)";
}
function useSkill(i){
  const p=DUNGEON.player;
  if(!p)return;
  const sk=JOBS[SAVE.job].skills[i];
  if(!sk)return;
  // 後退(召喚収容)はターン消費しない
  const free=SAVE.job==="summoner"&&i===2;
  if(p.skillCd[i]>0||p.mp<sk.mp)return;
  if(!free){
    p.mp-=sk.mp;
    SAVE.mp=p.mp;
    p.skillCd[i]=sk.cd;
  }
  const d=dStats();
  if(SAVE.job==="hero"){
    if(i===0){
      const v=DIRS[p.dirIdx];
      const e=enemyAt(p.tx+v[0],p.ty+v[1]);
      if(e){
        damageEnemy(e,Math.max(1,Math.floor(d.atk*2.2-e.def*0.5)));
        DUNGEON.shake=8;
      }
      playSFX("sfx_skill.ogg");
      spawnArcFX(p.x,p.y,dirAngle(p.dirIdx),true);
    }else if(i===1){
      const v=DIRS[p.dirIdx];
      let moved=0;
      for(let k=1;k<=3;k++){
        const nx=p.tx+v[0]*k,ny=p.ty+v[1]*k;
        if(!isFloor(nx,ny)||enemyAt(nx,ny))break;
        p.tx=nx;p.ty=ny;moved=k;
      }
      if(moved)UI.float(p.x,p.y-24,"突進!","#8ae8ff",14);
      playSFX("sfx_skill.ogg");
    }else{
      const heal=Math.floor(d.hpMax*0.35);
      p.hp=Math.min(d.hpMax,p.hp+heal);SAVE.hp=p.hp;
      playSFX("sfx_potion.ogg");
      UI.float(p.x,p.y-24,"+"+heal,"#5aff8a",16);
      spawnHealFX(p.x,p.y);
    }
  }else if(SAVE.job==="paladin"){
    if(i===0){
      const dmg=d.mag*2.4;
      for(const e of DUNGEON.enemies){
        if(e.dead)continue;
        if(chebyshev(e,p)<=1){
          damageEnemy(e,Math.max(1,Math.floor(dmg-e.def*0.4)));
        }
      }
      DUNGEON.shake=5;playSFX("sfx_skill.ogg");spawnHolyFX(p.x,p.y,false);
    }else if(i===1){
      p.guardT=1;
      playSFX("sfx_guard.ogg");spawnGuardFX(p.x,p.y);
      UI.float(p.x,p.y-24,"神聖の盾","#8ae8ff",14);
    }else{
      const dmg=d.mag*1.8;
      for(const e of DUNGEON.enemies){
        if(e.dead)continue;
        if(chebyshev(e,p)<=2){
          damageEnemy(e,Math.max(1,Math.floor(dmg-e.def*0.4)));
        }
      }
      DUNGEON.shake=7;playSFX("sfx_skill.ogg");spawnHolyFX(p.x,p.y,true);
    }
  }else if(SAVE.job==="mage"){
    SAVE.magicXp=Math.min(10,SAVE.magicXp+0.2);
    if(i===0){
      // 直線6マス・火球(初命中)
      const v=DIRS[p.dirIdx];
      let hitE=null;
      for(let k=1;k<=6;k++){
        const nx=p.tx+v[0]*k,ny=p.ty+v[1]*k;
        if(!isFloor(nx,ny))break;
        const e=enemyAt(nx,ny);
        if(e){hitE=e;break;}
      }
      if(hitE){
        damageEnemy(hitE,Math.max(1,Math.floor(d.mag*1.6-hitE.def*0.4)));
        spawnFireBallFX(hitE);
      }
      playSFX("sfx_skill.ogg");
    }else if(i===1){
      for(const e of DUNGEON.enemies){
        if(e.dead)continue;
        if(chebyshev(e,p)<=1){
          damageEnemy(e,Math.max(1,Math.floor(d.mag*1.5-e.def*0.4)));
          e.freezeT=2;
        }
      }
      playSFX("sfx_skill.ogg");spawnIceFX(p.x,p.y);
    }else{
      let target=null,bd=1e9;
      for(const e of DUNGEON.enemies){
        if(e.dead)continue;
        const dist=chebyshev(e,p);
        if(dist<bd){bd=dist;target=e;}
      }
      if(target){
        damageEnemy(target,Math.max(1,Math.floor(d.mag*2.8-target.def*0.4)));
        spawnLightningFX(target.x,target.y);
      }
      playSFX("sfx_skill.ogg");DUNGEON.shake=5;
    }
  }else if(SAVE.job==="summoner"){
    if(i===0){
      if(p.summon){UI.toast("すでに召喚済み");p.mp+=sk.mp;SAVE.mp=p.mp;return;}
      if(!Object.keys(SAVE.summons).length)SAVE.summons["summon_ken"]=1;
      const sid=Object.keys(SAVE.summons)[0];
      const st=SAVE.summons[sid];
      const sdef=SUMMON_BY[sid];
      const hpMul=SUM_STAGE.hp[st-1],atkMul=SUM_STAGE.atk[st-1];
      // 隣接の空きマスに出現
      let sx=p.tx,sy=p.ty;
      for(let k=0;k<8&&!isSummonSpot(sx,sy);k++){
        const v=DIRS[k];
        if(isFloor(p.tx+v[0],p.ty+v[1])&&!enemyAt(p.tx+v[0],p.ty+v[1])){sx=p.tx+v[0];sy=p.ty+v[1];}
      }
      p.summon={id:sid,stage:st,tx:sx,ty:sy,x:(sx+0.5)*TILE,y:(sy+0.5)*TILE,dirIdx:p.dirIdx,
        hp:40*hpMul,hpMax:40*hpMul,atk:8*atkMul,fireCd:1,animT:0,ai:sdef.ai,atkBuffT:0,actT:0};
      playSFX("sfx_summon.ogg");
      UI.toast(sdef.name+" を召喚! (段階"+st+")");
      spawnSummonFX((sx+0.5)*TILE,(sy+0.5)*TILE,sdef.col);
    }else if(i===1){
      if(!p.summon){UI.toast("召喚獣がいない");p.mp+=sk.mp;SAVE.mp=p.mp;return;}
      p.summon.hp=p.summon.hpMax;
      p.summon.atkBuffT=3;
      playSFX("sfx_summon.ogg");
      UI.toast("獣が力を取り戻した!(3ターン強化)");
    }else{
      if(p.summon){p.summon=null;playSFX("sfx_click.ogg");UI.toast("召喚獣を収めた");}
      else UI.toast("召喚獣がいない");
      return;
    }
  }else if(SAVE.job==="unjob"){
    if(i===0){
      const dmg=d.atk*1.6+d.mag*1.2;
      for(const e of DUNGEON.enemies){
        if(e.dead)continue;
        if(chebyshev(e,p)<=1){
          damageEnemy(e,Math.max(1,Math.floor(dmg-e.def*0.4)));
        }
      }
      playSFX("sfx_skill.ogg");spawnArcFX(p.x,p.y,dirAngle(p.dirIdx),true);
    }else if(i===1){
      p.dashBonusT=2;
      playSFX("sfx_skill.ogg");
      UI.float(p.x,p.y-24,"無双乱舞!","#ff5a5a",14);
    }else{
      const ratio=1-p.hp/d.hpMax;
      const dmg=d.atk*(1+ratio*3);
      for(const e of DUNGEON.enemies){
        if(e.dead)continue;
        if(chebyshev(e,p)<=2){
          damageEnemy(e,Math.max(1,Math.floor(dmg-e.def*0.3)));
        }
      }
      DUNGEON.shake=9;playSFX("sfx_skill.ogg");spawnBerserkFX(p.x,p.y);
    }
  }
  if(!free)endPlayerTurn();
}
function chebyshev(a,b){return Math.max(Math.abs(a.tx-b.tx),Math.abs(a.ty-b.ty));}
function isSummonSpot(tx,ty){return isFloor(tx,ty)&&!enemyAt(tx,ty)&&!(DUNGEON.player.tx===tx&&DUNGEON.player.ty===ty);}
function spawnFireBallFX(e){
  for(let i=0;i<12;i++){
    const a=Math.random()*Math.PI*2,sp=3*Math.random();
    P(e.x,e.y,Math.cos(a)*sp,Math.sin(a)*sp,0.4,"#ff8a2e",3);
  }
}

// ============================================================
// ターン進行
// ============================================================
function endPlayerTurn(consumed){
  if(consumed===undefined)consumed=true;
  const p=DUNGEON.player;
  DUNGEON.turn++;
  if(consumed){
    p.mp=Math.min(dStats().mpMax,p.mp+2);
    SAVE.mp=p.mp;
    for(let i=0;i<3;i++)if(p.skillCd[i]>0)p.skillCd[i]--;
    if(p.guardT>0)p.guardT--;
    if(p.dashBonusT>0)p.dashBonusT--;
    if(p.summon&&p.summon.atkBuffT>0)p.summon.atkBuffT--;
  }
  p.moving=false;
  TURN.phase="anim";
  TURN.t=consumed?0.16:0.05;
  TURN.toEnemy=consumed;
}
function updateTurn(dt){
  const D=DUNGEON;
  if(!D||!D.player||G.screen!=="dungeon")return;
  // 移動Tween(常時: 画面表示中でも滑らかに)
  if(!G.paused)tweenEntities(dt);
  // 待機/整理/ポーズ中はターン進行しない
  if(G.paused||UI.bag||UI.gate||UI.help)return;
  if(TURN.phase==="player"){
    handlePlayerInput();
  }else if(TURN.phase==="anim"){
    TURN.t-=dt;
    if(TURN.t<=0){
      if(TURN.toEnemy){
        TURN.phase="enemy";
        TURN.q=D.enemies.filter(function(e){return !e.dead;});
        TURN.i=0;TURN.t=0.06;
      }else{
        TURN.phase="player";
      }
    }
  }else if(TURN.phase==="enemy"){
    TURN.t-=dt;
    if(TURN.t<=0){
      if(TURN.i<TURN.q.length){
        const e=TURN.q[TURN.i];
        if(!e.dead)enemyAct(e);
        TURN.i++;
        TURN.t=0.1;
      }else{
        // 敵フェーズ終了: 弾移動
        moveEbullets();
        D.enemies=D.enemies.filter(function(e){return !e.dead;});
        D.drops=D.drops.filter(function(dr){return !dr.got;});
        // 警告は突進実行まで残す(死んだ敵の分だけ掃除)
        D.warnings=D.warnings.filter(function(w){return !w.e||(!w.e.dead&&w.e.chargeWarn);});
        TURN.phase="player";
        D._summonPending=true;
        if(G.screen==="dungeon")checkStairsDescend();
      }
    }
  }
}
function handlePlayerInput(){
  const p=DUNGEON.player;
  const D=DUNGEON;
  let mx=0,my=0;
  if(key("KeyA","ArrowLeft"))mx-=1;
  if(key("KeyD","ArrowRight"))mx+=1;
  if(key("KeyW","ArrowUp"))my-=1;
  if(key("KeyS","ArrowDown"))my+=1;
  if(mx||my){
    const di=dirIndex(mx,my);
    p.dirIdx=di;
    tryMovePlayer(di);
    return;
  }
  if(keyP("KeyZ","KeyJ")){attackAction();return;}
  if(keyP("KeyX","KeyK")){useSkill(0);return;}
  if(keyP("KeyC","KeyL")){useSkill(1);return;}
  if(keyP("KeyV")){useSkill(2);return;}
  if(keyP("Digit1")){if(quickUse("p_hp_s"))endPlayerTurn();return;}
  if(keyP("Digit2")){if(quickUse("p_hp_l"))endPlayerTurn();return;}
  if(keyP("Digit3")){if(quickUse("p_mp"))endPlayerTurn();return;}
  if(keyP("Space")){endPlayerTurn();}
}
function dirIndex(mx,my){
  for(let i=0;i<8;i++){
    if(DIRS[i][0]===Math.sign(mx)&&DIRS[i][1]===Math.sign(my))return i;
  }
  return mx>0?0:mx<0?4:my>0?2:6;
}
function tryMovePlayer(di){
  const p=DUNGEON.player;
  const v=DIRS[di];
  let nx=p.tx+v[0],ny=p.ty+v[1];
  const diag=v[0]!==0&&v[1]!==0;
  if(diag&&!canDiag(p.tx+v[0],p.ty,p.tx,p.ty+v[1])){
    // コーナーカット不可 → 直交方向に逸らす
    if(isFloor(nx,p.ty)&&!enemyAt(nx,p.ty))ny=p.ty;
    else if(isFloor(p.tx,ny)&&!enemyAt(p.tx,ny))nx=p.tx;
    else {p.dirIdx=di;return;}
  }
  const e=enemyAt(nx,ny);
  if(!isFloor(nx,ny)){p.dirIdx=di;return;}
  if(e){p.dirIdx=di;return;}
  p.tx=nx;p.ty=ny;
  p.dirIdx=di;
  p.moving=true;
  // 無双乱舞: 1行動で2マス
  if(p.dashBonusT>0){
    const nx2=p.tx+v[0],ny2=p.ty+v[1];
    if(isFloor(nx2,ny2)&&!enemyAt(nx2,ny2)&&!(DUNGEON.player.tx===nx2&&DUNGEON.player.ty===ny2)){
      p.tx=nx2;p.ty=ny2;
    }
  }
  collectDrops(p);
  // 階段(最終位置で判定) — 100F以外: 残敵があっても降下可。100Fのみボス撃破必須
  if(p.tx===MAP.exit.x&&p.ty===MAP.exit.y){
    if(DUNGEON.floor>=100){
      if(DUNGEON.bossDead){doClear();return;}
      UI.toast("先に魔王を倒せ!");
      endPlayerTurn();
      return;
    }
    nextFloor();
    return;
  }
  // 宝箱(1ターン)
  for(const c of DUNGEON.chests){
    if(!c.open&&c.tx===p.tx&&c.ty===p.ty){
      c.open=true;
      playSFX("sfx_pickup.ogg",0.9);
      const it=ALL_ITEMS[c.item.id];
      UI.toast("宝箱: "+it.name+" を獲得!");
      addItemEquip(c.item);
      storeSave();
      endPlayerTurn();
      return;
    }
  }
  freeTileInteract();
  endPlayerTurn();
}
function freeTileInteract(){
  const p=DUNGEON.player;
  if(MAP.savept&&p.tx===MAP.savept.x&&p.ty===MAP.savept.y){
    storeSave();
    playSFX("sfx_stairs.ogg");
    UI.toast("セーブした。この階から再挑戦できる");
  }
  if(MAP.gate&&p.tx===MAP.gate.x&&p.ty===MAP.gate.y&&!UI.gate&&!DUNGEON._gateDone){
    DUNGEON._gateDone=true;
    G.gateOpen=true;
    openGateMenu(false);
  }
}

// ============================================================
// 敵AI (ターン制: 敵フェーズでのみ1体ずつ行動)
// ============================================================
function enemyAct(e){
  const p=DUNGEON.player;
  if(e.dead)return;
  if(e.freezeT>0){e.freezeT--;UI.float(e.x,e.y-e.r-6,"凍結","#bfe8ff",12);return;}
  const dist=chebyshev(e,p);
  // 方向インデックス(プレイヤーの方)
  e.dirIdx=dirTo(e.tx,e.ty,p.tx,p.ty);
  if(e.kind==="boss"){bossAct(e,dist);return;}
  if(e.chargeWarn){
    // 突進実行
    executeCharge(e);
    return;
  }
  if(e.kind==="chase"){
    if(dist<=1){meleeEnemy(e,1);return;}
    stepToward(e,p.tx,p.ty,false);
  }else if(e.kind==="flying"){
    if(dist<=1){meleeEnemy(e,1.1);return;}
    if(dist<=3){
      // 距離を保つ
      if(Math.random()<0.4)stepToward(e,p.tx-1,p.ty-1,true);
    }else stepToward(e,p.tx,p.ty,true);
  }else if(e.kind==="shoot"){
    e.fireCd--;
    if(e.fireCd<=0&&dist<=7&&dist>=2&&hasLOS(e.tx,e.ty,p.tx,p.ty)){
      e.fireCd=3;
      const v=DIRS[e.dirIdx];
      DUNGEON.ebullets.push({tx:e.tx+v[0],ty:e.ty+v[1],x:(e.tx+v[0]+0.5)*TILE,y:(e.ty+v[1]+0.5)*TILE,
        dx:v[0],dy:v[1],dmg:e.atk,col:e.col});
      playSFX("sfx_skill.ogg",1.3);
      return;
    }
    if(dist<3)stepToward(e,p.tx-1,p.ty-1,false);
    else if(dist>6)stepToward(e,p.tx,p.ty,false);
    else if(Math.random()<0.5)stepToward(e,p.tx,p.ty,false);
  }else if(e.kind==="charge"){
    if(dist<=1){meleeEnemy(e,1);return;}
    if(dist<=6&&Math.random()<0.45){
      // 突進予告
      const v=DIRS[e.dirIdx];
      const path=[];
      for(let k=1;k<=4;k++){
        const nx=e.tx+v[0]*k,ny=e.ty+v[1]*k;
        if(!isFloor(nx,ny))break;
        path.push({x:nx,y:ny});
        if(nx===p.tx&&ny===p.ty)break;
      }
      if(path.length){
        e.chargeWarn={dx:v[0],dy:v[1],path:path};
        DUNGEON.warnings.push({e:e,tx:e.tx,ty:e.ty,path:path,col:"#ff9a2e"});
        playSFX("sfx_boss.ogg",1.1);
        return;
      }
    }
    stepToward(e,p.tx,p.ty,false);
  }
}
function dirTo(x0,y0,x1,y1){
  const dx=x1-x0,dy=y1-y0;
  let best=0,bd=1e9;
  for(let i=0;i<8;i++){
    const d=Math.abs(DIRS[i][0]-dx)+Math.abs(DIRS[i][1]-dy);
    if(d<bd){bd=d;best=i;}
  }
  return best;
}
function stepToward(e,tx,ty,allowDiagCorner){
  const cands=[0,1,2,3,4,5,6,7];
  // 近い方向から
  cands.sort(function(a,b){
    const da=Math.abs(DIRS[a][0]-(tx-e.tx))+Math.abs(DIRS[a][1]-(ty-e.ty));
    const db=Math.abs(DIRS[b][0]-(tx-e.tx))+Math.abs(DIRS[b][1]-(ty-e.ty));
    return da-db;
  });
  for(const di of cands){
    const v=DIRS[di];
    const nx=e.tx+v[0],ny=e.ty+v[1];
    if(nx===e.tx&&ny===e.ty)continue;
    if(!isFloor(nx,ny))continue;
    if(DUNGEON.player.tx===nx&&DUNGEON.player.ty===ny)continue;
    if(enemyAt(nx,ny))continue;
    const diag=v[0]!==0&&v[1]!==0;
    if(diag&&!e.flying&&!canDiag(e.tx+v[0],e.ty,e.tx,e.ty+v[1]))continue;
    e.tx=nx;e.ty=ny;
    e.dirIdx=di;
    return;
  }
}
function hasLOS(x0,y0,x1,y1){
  let x=x0,y=y0;
  while(x!==x1||y!==y1){
    let sx=Math.sign(x1-x),sy=Math.sign(y1-y);
    // 対角はどちらか先に進み、壁チェック
    if(sx!==0&&sy!==0){
      if(!isFloor(x+sx,y)||!isFloor(x,y+sy))return false;
    }else if(sx!==0){
      if(!isFloor(x+sx,y))return false;
    }else{
      if(!isFloor(x,y+sy))return false;
    }
    x+=sx;y+=sy;
  }
  return true;
}
function meleeEnemy(e,mult){
  damagePlayer(e.atk*mult);
  spawnHitFX(DUNGEON.player.x,DUNGEON.player.y);
}
function executeCharge(e){
  const p=DUNGEON.player;
  const w=e.chargeWarn;
  e.chargeWarn=null;
  DUNGEON.warnings=DUNGEON.warnings.filter(function(q){return q.e!==e;});
  let hit=false;
  for(const c of w.path){
    if(!isFloor(c.x,c.y))break;
    if(enemyAt(c.x,c.y)&&!(DUNGEON.player.tx===c.x&&DUNGEON.player.ty===c.y))break;
    if(p.tx===c.x&&p.ty===c.y){hit=true;break;}
    e.tx=c.x;e.ty=c.y;
  }
  if(hit){meleeEnemy(e,1.4);DUNGEON.shake=8;}
  else playSFX("sfx_swing.ogg",0.8);
}
function bossAct(e,dist){
  const p=DUNGEON.player;
  const phase=e.hp>e.hpMax*0.5?1:2;
  e.atkCd=(e.atkCd==null?2:phase===2?e.atkCd-1:e.atkCd-1);
  if(e.chargeWarn){executeCharge(e);return;}
  if(dist<=1){meleeEnemy(e,1.2);return;}
  if(e.atkCd<=0){
    const pat=Math.random();
    if(pat<0.45){
      // 放射8方向弾
      e.atkCd=phase===2?2:3;
      for(let a=0;a<8;a++){
        const v=DIRS[a];
        const nx=e.tx+v[0],ny=e.ty+v[1];
        if(isFloor(nx,ny)&&!enemyAt(nx,ny)){
          DUNGEON.ebullets.push({tx:nx,ty:ny,x:(nx+0.5)*TILE,y:(ny+0.5)*TILE,dx:v[0],dy:v[1],dmg:Math.floor(e.atk*0.7),col:"#ff9a2e"});
        }
      }
      playSFX("sfx_boss.ogg");
    }else if(pat<0.75){
      // 突進予告
      e.atkCd=phase===2?2:3;
      const v=DIRS[e.dirIdx];
      const path=[];
      for(let k=1;k<=5;k++){
        const nx=e.tx+v[0]*k,ny=e.ty+v[1]*k;
        if(!isFloor(nx,ny))break;
        path.push({x:nx,y:ny});
        if(nx===p.tx&&ny===p.ty)break;
      }
      if(path.length){e.chargeWarn={dx:v[0],dy:v[1],path:path};DUNGEON.warnings.push({e:e,tx:e.tx,ty:e.ty,path:path,col:"#ff5a5a"});playSFX("sfx_boss.ogg",0.8);}
      else stepToward(e,p.tx,p.ty,false);
    }else{
      // 周囲AoE(半径2)
      e.atkCd=phase===2?3:4;
      if(chebyshev(e,p)<=2){
        damagePlayer(Math.floor(e.atk*0.8));
      }
      DUNGEON.shake=8;
      playSFX("sfx_boss.ogg",1.2);
      spawnHolyFX(e.x,e.y,true);
    }
  }else{
    stepToward(e,p.tx,p.ty,false);
  }
}
function moveEbullets(){
  const D=DUNGEON,p=D.player;
  const next=[];
  for(const b of D.ebullets){
    const nx=b.tx+b.dx,ny=b.ty+b.dy;
    if(!isFloor(nx,ny))continue; // 壁で消滅
    if(p.tx===nx&&p.ty===ny){
      damagePlayer(b.dmg);
      continue;
    }
    if(p.summon&&p.summon.tx===nx&&p.summon.ty===ny){
      p.summon.hp-=b.dmg;
      continue;
    }
    if(enemyAt(nx,ny))continue; // 敵に吸収
    b.tx=nx;b.ty=ny;
    b.x=(nx+0.5)*TILE;b.y=(ny+0.5)*TILE;
    next.push(b);
  }
  D.ebullets=next;
}

// 召喚獣AI (ターン制: プレイヤーターンごとに自動1アクション)

function summonAct(s){
  const p=DUNGEON.player;
  s.animT++;
  // 距離が離れすぎたら追走(1マス)
  if(chebyshev(s,p)>2){
    stepToward(s,p.tx,p.ty,false);
    return;
  }
  let target=null,bd=1e9;
  for(const e of DUNGEON.enemies){
    if(e.dead)continue;
    const d=chebyshev(s,e);
    if(s.ai==="stalk"){
      if(e.hp>e.hpMax*0.5&&d<bd){bd=d;target=e;}
    }else if(d<bd){bd=d;target=e;}
  }
  const atkPower=s.atk*(s.atkBuffT>0?1.5:1);
  if(target){
    s.dirIdx=dirTo(s.tx,s.ty,target.tx,target.ty);
    if(s.ai==="melee"||s.ai==="dash"){
      if(bd>1){
        stepToward(s,target.tx,target.ty,false);
      }else{
        damageEnemy(target,Math.max(1,Math.floor(atkPower-target.def*0.3)));
        playSFX("sfx_hit.ogg",1.2);
      }
    }else if(s.ai==="shoot"){
      if(bd<=5&&hasLOS(s.tx,s.ty,target.tx,target.ty)){
        damageEnemy(target,Math.max(1,Math.floor(atkPower-target.def*0.3)));
        spawnFireBallFX(target);
        playSFX("sfx_hit.ogg",1.1);
      }else stepToward(s,target.tx,target.ty,false);
    }else if(s.ai==="wall"){
      if(bd<=1){
        damageEnemy(target,Math.max(1,Math.floor(atkPower*0.8-target.def*0.3)));
        spawnGuardFX(s.x,s.y);
      }
    }else if(s.ai==="stalk"){
      if(bd<=1){
        damageEnemy(target,Math.max(1,Math.floor(atkPower*1.3-target.def*0.3)));
        playSFX("sfx_hit.ogg",1.1);
      }else stepToward(s,target.tx,target.ty,false);
    }
  }
  // 被弾(敵弾が自分所在マスに来る場合)
  for(const b of DUNGEON.ebullets){
    if(b.tx===s.tx&&b.ty===s.ty){s.hp-=b.dmg;}
  }
  if(s.hp<=0){
    UI.toast(SUMMON_BY[s.id].name+" が倒れた…");
    p.summon=null;
    spawnDeathFX(s.x,s.y,SUMMON_BY[s.id].col);
    return;
  }
  // 成長(ターンベース)
  s.actT++;
  if(s.actT>=20&&s.stage<10){
    s.actT=0;
    s.stage++;
    SAVE.summons[s.id]=s.stage;
    s.hpMax=40*SUM_STAGE.hp[s.stage-1];
    s.hp=s.hpMax;
    s.atk=8*SUM_STAGE.atk[s.stage-1];
    UI.toast(SUMMON_BY[s.id].name+" が段階"+s.stage+"に進化した!");
    spawnSummonFX(s.x,s.y,SUMMON_BY[s.id].col);
    playSFX("sfx_levelup.ogg",0.9);
  }
}

function P(x,y,vx,vy,life,col,r,extra){
  const pt={x:x,y:y,vx:vx,vy:vy,life:life,col:col,r:r};
  if(extra)Object.assign(pt,extra);
  DUNGEON.particles.push(pt);
}
function spawnHitFX(x,y){for(let i=0;i<6;i++)P(x,y,(Math.random()-0.5)*4,(Math.random()-0.5)*4,0.3,"#fff",2);}
function spawnDeathFX(x,y,col){for(let i=0;i<14;i++)P(x,y,(Math.random()-0.5)*6,(Math.random()-0.5)*6-2,0.6,col,3);}
function spawnArcFX(x,y,dir,big){
  const n=big?14:8;
  for(let i=0;i<n;i++){
    const a=dir+(Math.random()-0.5)*1.6;
    const sp=(big?5:3.5)*Math.random();
    P(x+Math.cos(a)*10,y+Math.sin(a)*10,Math.cos(a)*sp,Math.sin(a)*sp,0.25,"#fff2c8",2);
  }
}
function spawnHealFX(x,y){for(let i=0;i<10;i++)P(x+(Math.random()-0.5)*20,y+10,0,-2-Math.random()*2,0.7,"#5aff8a",3);}
function spawnGuardFX(x,y){for(let i=0;i<8;i++){const a=i/8*Math.PI*2;P(x+Math.cos(a)*20,y+Math.sin(a)*20,0,0,0.4,"#8ae8ff",3);}}
function spawnHolyFX(x,y,big){const n=big?18:10;for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2;const sp=(big?5:3)*Math.random();P(x,y,Math.cos(a)*sp,Math.sin(a)*sp,0.5,"#fff8d0",3);}}
function spawnIceFX(x,y){for(let i=0;i<14;i++){const a=i/14*Math.PI*2;P(x+Math.cos(a)*30,y+Math.sin(a)*30,-Math.cos(a)*3,-Math.sin(a)*3,0.6,"#bfe8ff",3);}}
function spawnLightningFX(x,y){P(x,y,0,0,0.3,"#fff",4,{bolt:true});for(let i=0;i<10;i++)P(x+(Math.random()-0.5)*30,y+(Math.random()-0.5)*30,0,-4,0.4,"#cfe8ff",2);}
function spawnSummonFX(x,y,col){for(let i=0;i<16;i++){const a=i/16*Math.PI*2;P(x+Math.cos(a)*24,y+Math.sin(a)*24,-Math.cos(a)*3,-Math.sin(a)*3,0.6,col,3);}}
function spawnBerserkFX(x,y){for(let i=0;i<20;i++){const a=Math.random()*Math.PI*2;const sp=6*Math.random();P(x,y,Math.cos(a)*sp,Math.sin(a)*sp,0.5,"#ff5a5a",3);}}

const G={screen:"title",time:0,paused:false,gateOpen:false,menuSel:0,jobSel:0,help:false,gameoverReason:"",bagOpen:false};
function update(dt){
  G.time+=dt;
  if(G.paused)return;
  if(G.screen==="dungeon")updateDungeon(dt);
  else if(G.screen==="town")updateTown(dt);
  if(DUNGEON){
    for(const pt of DUNGEON.particles){pt.x+=pt.vx;pt.y+=pt.vy;pt.vy+=0.05;pt.life-=dt;}
    DUNGEON.particles=DUNGEON.particles.filter(function(p){return p.life>0;});
    for(const f of DUNGEON.floats){f.y-=30*dt;f.life-=dt;}
    DUNGEON.floats=DUNGEON.floats.filter(function(f){return f.life>0;});
    if(DUNGEON.shake>0)DUNGEON.shake=Math.max(0,DUNGEON.shake-dt*30);
  }
}
// マスム中心へピクセル位置を Tween
function tweenEntities(dt){
  const D=DUNGEON,k=Math.min(1,dt*16);
  const p=D.player;
  if(p){
    p.x+=((p.tx+0.5)*TILE-p.x)*k;
    p.y+=((p.ty+0.5)*TILE-p.y)*k;
    if(p.swing>0)p.swing-=dt;
    if(p.hitT>0)p.hitT-=dt;
    p.animT+=dt;
  }
  for(const e of D.enemies){
    e.x+=((e.tx+0.5)*TILE-e.x)*k;
    e.y+=((e.ty+0.5)*TILE-e.y)*k;
    if(e.hitT>0)e.hitT-=dt;
    e.animT+=dt;
  }
  if(p&&p.summon){
    const s=p.summon;
    s.x+=((s.tx+0.5)*TILE-s.x)*k;
    s.y+=((s.ty+0.5)*TILE-s.y)*k;
    s.animT+=dt;
  }
}
function updateDungeon(dt){
  const D=DUNGEON;
  if(!D||!D.player||G.screen!=="dungeon")return;
  D.time+=dt;
  if(TURN.phase==="player"){
    // プレイヤーターン開始時に召喚獣が行動(敵フェーズ終了直後)
    if(D._summonPending){
      D._summonPending=false;
      if(D.player.summon)summonAct(D.player.summon);
    }
  }
  updateTurn(dt);
}
function nextFloor(){
  const nf=DUNGEON.floor+1;

  enterFloor(nf,false);
}
function townActivate(t){
  if(!t)return;
  playSFX("sfx_click.ogg");
  if(t.type==="shop")UI.openShop(t.id);
  else if(t.type==="sell")UI.openSell();
  else if(t.type==="inn")UI.openInn();
  else if(t.type==="gate")openGateMenu(true);
  else if(t.type==="down")startDungeon(1);
}
function updateTown(dt){
  townPointer();
  if(keyP("KeyZ","KeyJ","Enter","Space"))townActivate(TOWN.hover);
  // 薬の素早い使用 (1,2,3)
  if(keyP("Digit1"))quickUse("p_hp_s");
  if(keyP("Digit2"))quickUse("p_hp_l");
  if(keyP("Digit3"))quickUse("p_mp");
}
function quickUse(id){
  const it=SAVE.inv.find(function(i){return i.id===id;});
  if(!it||it.n<=0){UI.toast("所持していない");return false;}
  const def=ALL_ITEMS[id];
  const d=dStats();
  if(def.hp){
    if(SAVE.hp>=d.hpMax){UI.toast("HPは満タン");return false;}
    SAVE.hp=Math.min(d.hpMax,SAVE.hp+def.hp);
  }
  if(def.mp){
    if(SAVE.mp>=d.mpMax){UI.toast("MPは満タン");return false;}
    SAVE.mp=Math.min(d.mpMax,SAVE.mp+def.mp);
  }
  it.n--;
  if(it.n<=0)SAVE.inv.splice(SAVE.inv.indexOf(it),1);
  playSFX("sfx_potion.ogg");
  UI.float(W/2,H/2-40,"+ "+def.name,"#5aff8a",16);
  return true;
}

function titleConfirm(){
  playSFX("sfx_click.ogg");
  if(G.menuSel===0){
    G.screen="job";
    G.jobSel=0;
  }else if(G.menuSel===1){
    if(SAVE){
      G.screen="town";
      setupTown();
      playBGM("bgm_town.ogg");
      UI.toast("ようこそ、"+JOBS[SAVE.job].name+"。準備はいいか?");
    }else UI.toast("セーブデータなし");
  }else{
    G.help=true;
  }
}
function jobNav(dir){
  const n=Object.keys(JOBS).length;
  G.jobSel=(G.jobSel+dir+n)%n;
  playSFX("sfx_click.ogg",1.2);
}
function jobConfirm(){
  playSFX("sfx_click.ogg");
  startRun(Object.keys(JOBS)[G.jobSel]);
}
function startRun(jobId){
  SAVE=newSave(jobId);
  storeSave();
  G.screen="town";
  setupTown();
  playBGM("bgm_town.ogg");
  UI.toast("準備はいいか? ダンジョン入口から降りろ");
}

function img(name,x,y,w,h,fb){
  const im=IMG[name];
  if(im&&im._ok)ctx.drawImage(im,x,y,w,h);
  else if(fb){
    ctx.fillStyle=fb;
    ctx.beginPath();ctx.arc(x+w/2,y+h/2,Math.min(w,h)/2.4,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle="rgba(0,0,0,.4)";ctx.stroke();
  }
}
function panel(x,y,w,h,hi){
  ctx.fillStyle=hi?"rgba(70,52,24,.93)":"rgba(28,25,20,.88)";
  ctx.fillRect(x,y,w,h);
  ctx.strokeStyle=hi?"#ffd24a":"#6a5a30";
  ctx.lineWidth=hi?2:1;
  ctx.strokeRect(x+2,y+2,w-4,h-4);
  ctx.fillStyle=hi?"#ffd24a":"#6a5a30";
  ctx.fillRect(x,y,8,2);ctx.fillRect(x,y,2,8);
  ctx.fillRect(x+w-8,y,8,2);ctx.fillRect(x+w-2,y,2,8);
  ctx.fillRect(x,y+h-2,8,2);ctx.fillRect(x,y+h-8,2,8);
  ctx.fillRect(x+w-8,y+h-2,8,2);ctx.fillRect(x+w-2,y+h-8,2,8);
}
function wrapText(txt,x,y,mw,lh){
  let line="",yy=y;
  for(const ch of txt){
    if(ctx.measureText(line+ch).width>mw){ctx.fillText(line,x,yy);line=ch;yy+=lh;}
    else line+=ch;
  }
  if(line)ctx.fillText(line,x,yy);
}
function draw(){
  ctx.clearRect(0,0,W,H);
  if(G.screen==="title")drawTitle();
  else if(G.screen==="job")drawJobSelect();
  else if(G.screen==="town")drawTown();
  else if(G.screen==="dungeon")drawDungeon();
  else if(G.screen==="gameover")drawGameOver();
  else if(G.screen==="clear")drawClear();
  drawHUD();
  drawOverlays();
  drawToast();
  if(G.paused)drawPause();
}

}
const ZOOM=1.5;
function dirAngle(di){
  const v=DIRS[di];
  return Math.atan2(v[1],v[0]);
}
function drawDungeon(){
  const D=DUNGEON;
  if(!D)return;
  const P=D.player;
  const viewW=W/ZOOM,viewH=H/ZOOM;
  const camX=Math.max(0,Math.min(MW*TILE-viewW,P.x-viewW/2));
  const camY=Math.max(0,Math.min(MH*TILE-viewH,P.y-viewH/2));
  ctx.save();
  const shx=(Math.random()-0.5)*D.shake,shy=(Math.random()-0.5)*D.shake;
  ctx.translate(-camX*ZOOM+shx,-camY*ZOOM+shy);
  ctx.scale(ZOOM,ZOOM);
  const th=D.theme;
  const floorIm=IMG[th.floor];
  const wallIm=IMG["tile_wall.png"];
  const x0=Math.floor(camX/TILE),y0=Math.floor(camY/TILE);
  const x1=Math.min(MW,Math.ceil((camX+viewW)/TILE)+1);
  const y1=Math.min(MH,Math.ceil((camY+viewH)/TILE)+1);
  for(let y=y0;y<y1;y++){
    for(let x=x0;x<x1;x++){
      const px=x*TILE,py=y*TILE;
      if(MAP.grid[y][x]===FLOOR){
        if(floorIm&&floorIm._ok)ctx.drawImage(floorIm,px,py,TILE,TILE);
        else{
          ctx.fillStyle=(x+y)%2?"#4a4436":"#423c30";
          ctx.fillRect(px,py,TILE,TILE);
        }
        // 床をわずかに明るく(壁との明度差)
        ctx.fillStyle="rgba(255,240,200,.07)";
        ctx.fillRect(px,py,TILE,TILE);
      }else{
        if(wallIm&&wallIm._ok)ctx.drawImage(wallIm,px,py,TILE,TILE);
        else{
          ctx.fillStyle="#17140f";ctx.fillRect(px,py,TILE,TILE);
        }
        // 壁を暗く+上エッジにハイライト(立体感と境界明確化)
        ctx.fillStyle="rgba(0,0,0,.42)";
        ctx.fillRect(px,py,TILE,TILE);
        ctx.fillStyle="rgba(255,255,255,.12)";
        ctx.fillRect(px,py,TILE,3);
        ctx.fillStyle="rgba(0,0,0,.55)";
        ctx.fillRect(px,py+TILE-4,TILE,4);
      }
    }
  }
  ctx.fillStyle=th.tint;ctx.globalAlpha=0.14;
  ctx.fillRect(camX,camY,viewW,viewH);
  ctx.globalAlpha=1;
  // 突進警告(赤い経路)
  const t=G.time;
  for(const w of D.warnings){
    const a=0.25+0.2*Math.sin(t*10);
    for(const c of w.path){
      ctx.fillStyle="rgba(255,70,50,"+a+")";
      ctx.fillRect(c.x*TILE+2,c.y*TILE+2,TILE-4,TILE-4);
    }
  }
  // 出口
  img("stairs.png",MAP.exit.x*TILE-4,MAP.exit.y*TILE-4,40,40,"#444");
  if(MAP.gate)drawGateSprite(MAP.gate);
  if(MAP.savept)drawSavepointSprite(MAP.savept);
  for(const dr of D.drops)drawDrop(dr);
  for(const c of D.chests){if(!c.open)img("chest.png",c.tx*TILE+TILE/2-14,c.ty*TILE+TILE/2-14,28,28,"#8a6a30");}
  for(const e of D.enemies)drawEnemy(e);
  if(P.summon)drawSummonSprite(P.summon);
  drawPlayer(P);
  // 敵弾(マスム中心)
  for(const b of D.ebullets){
    const bx=(b.tx+0.5)*TILE,by=(b.ty+0.5)*TILE;
    ctx.fillStyle="rgba(0,0,0,.4)";
    ctx.beginPath();ctx.arc(bx,by,9,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=b.col||"#c84a4a";
    ctx.beginPath();ctx.arc(bx,by,6,0,Math.PI*2);ctx.fill();
    ctx.fillStyle="rgba(255,255,255,.8)";
    ctx.beginPath();ctx.arc(bx,by,2.5,0,Math.PI*2);ctx.fill();
  }
  for(const pt of D.particles){
    ctx.globalAlpha=Math.max(0,Math.min(1,pt.life*2.5));
    ctx.fillStyle=pt.col;
    if(pt.bolt)ctx.fillRect(pt.x-2,pt.y-44,4,44);
    else{ctx.beginPath();ctx.arc(pt.x,pt.y,pt.r,0,Math.PI*2);ctx.fill();}
  }
  ctx.globalAlpha=1;
  ctx.textAlign="center";
  for(const f of D.floats){
    ctx.globalAlpha=Math.min(1,f.life*2);
    ctx.fillStyle=f.col;
    ctx.font="bold "+(f.size||14)+"px sans-serif";
    ctx.fillText(f.txt,f.x,f.y);
  }
  ctx.globalAlpha=1;
  ctx.restore();
  // スクリーン空間: HUD情報
  ctx.textAlign="left";
  ctx.fillStyle="rgba(255,215,122,.85)";ctx.font="bold 16px sans-serif";
  ctx.fillText(D.floor+"F  "+D.theme.name,14,24);
  ctx.fillStyle="rgba(200,190,150,.6)";ctx.font="12px sans-serif";
  ctx.fillText("ターン "+D.turn,14,42);
  if(TURN.phase!=="player"){
    ctx.fillStyle="rgba(126,200,255,.7)";
    ctx.fillText(TURN.phase==="enemy"?"敵のターン…":"",14,58);
  }
  // ボスHPバー
  for(const e of D.enemies){
    if(e.id==="boss_karaage"&&!e.dead){
      ctx.fillStyle="rgba(0,0,0,.7)";
      ctx.fillRect(W/2-250,H-42,500,14);
      ctx.fillStyle="#e8942e";
      ctx.fillRect(W/2-248,H-40,496*Math.max(0,e.hp/e.hpMax),10);
      ctx.fillStyle="#ffd97a";ctx.font="bold 14px sans-serif";ctx.textAlign="center";
      ctx.fillText("唐揚げ魔王",W/2,H-48);
      break;
    }
  }
}

}
function drawSavepointSprite(g){
  const px=g.x*TILE,py=g.y*TILE;
  const t=G.time;
  img("savepoint.png",px-4,py-6,40,44,"#c8a04a");
  ctx.fillStyle="rgba(255,230,140,"+(0.3+0.3*Math.sin(t*3))+")";

function drawDrop(dr){
  const yy=dr.y+Math.sin(dr.bob)*3;
  if(dr.id==="gold")img("icon_gold.png",dr.x-10,yy-10,20,20,"#ffd24a");
  else if(dr.id==="exp")img("icon_exp.png",dr.x-9,yy-9,18,18,"#7ec8ff");
  else{
    const it=ALL_ITEMS[dr.id];
    if(it)img(it.img,dr.x-10,yy-10,20,20,"#8a5a5a");
  }
}
// スプライト描画: 待機=1フレーム+バウンド / 移動=2フレーム切替
function spriteFrame(base,walkId,moving){
  if(moving&&walkId&&IMG[walkId]&&IMG[walkId]._ok&&Math.floor(G.time*9)%2===1)return IMG[walkId];
  return IMG[base];
}
function drawEnemy(e){
  const s=e.size/2;
  const bob=Math.sin(G.time*3+e.animT*2)*2;
  const flash=e.hitT>0;
  ctx.save();
  ctx.translate(e.x,e.y+bob);
  if(e.freezeT>0){
    ctx.fillStyle="rgba(150,220,255,.35)";
    ctx.beginPath();ctx.arc(0,0,e.r+5,0,Math.PI*2);ctx.fill();
    ctx.fillStyle="rgba(220,245,255,.9)";ctx.font="bold 12px sans-serif";ctx.textAlign="center";
    ctx.fillText("❄",0,-e.r-8);
  }
  ctx.fillStyle="rgba(0,0,0,.35)";
  ctx.beginPath();ctx.ellipse(0,e.r*0.7,e.r*0.8,e.r*0.35,0,0,Math.PI*2);ctx.fill();
  const isBoss=e.id==="boss_karaage";
  const moving=Math.hypot((e.tx+0.5)*TILE-e.x,(e.ty+0.5)*TILE-e.y)>2;
  const im=spriteFrame(e.id+".png",e.id+"_walk.png",moving);
  if(im&&im._ok){
    const flip=DIRS[e.dirIdx][0]<0?-1:1;
    const sc=isBoss?1.6:1;
    if(flash)ctx.filter="brightness(2.5)";
    ctx.scale(flip*sc,sc);
    ctx.drawImage(im,-s/2,-s/2,s,s);
    ctx.filter="none";
  }else{
    ctx.fillStyle=flash?"#fff":e.col;
    ctx.beginPath();ctx.arc(0,0,e.r,0,Math.PI*2);ctx.fill();
    ctx.fillStyle="rgba(0,0,0,.5)";
    ctx.beginPath();ctx.arc(-e.r*0.3,-2,2.5,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(e.r*0.3,-2,2.5,0,Math.PI*2);ctx.fill();
  }
  ctx.restore();
  if(e.hp<e.hpMax&&!isBoss){
    const w=e.r*2;
    ctx.fillStyle="rgba(0,0,0,.6)";
    ctx.fillRect(e.x-w/2,e.y-e.r-10,w,4);
    ctx.fillStyle="#e04040";
    ctx.fillRect(e.x-w/2,e.y-e.r-10,w*Math.max(0,e.hp/e.hpMax),4);
  }
  if(e.chargeWarn){
    ctx.fillStyle="rgba(255,90,60,.95)";ctx.font="bold 13px sans-serif";ctx.textAlign="center";
    ctx.fillText("⚠突進",e.x,e.y-e.r-16);
  }
}
function drawSummonSprite(s){
  const t=G.time;
  ctx.save();
  ctx.translate(s.x,s.y+Math.sin(t*5)*3);
  const sdef=SUMMON_BY[s.id];
  const scale=0.8+s.stage*0.06;
  const moving=Math.hypot((s.tx+0.5)*TILE-s.x,(s.ty+0.5)*TILE-s.y)>2;
  const im=spriteFrame(sdef.img,sdef.img.replace(".png","_walk.png"),moving);
  if(im&&im._ok){
    const flip=DIRS[s.dirIdx][0]<0?-1:1;
    ctx.scale(flip*scale,scale);
    ctx.drawImage(im,-32,-32,64,64);
  }else{
    ctx.fillStyle=sdef.col;
    ctx.beginPath();ctx.arc(0,0,12*scale,0,Math.PI*2);ctx.fill();
  }
  if(s.atkBuffT>0){
    ctx.strokeStyle="rgba(255,210,90,"+(0.5+0.4*Math.sin(t*8))+")";
    ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(0,0,26*scale,0,Math.PI*2);ctx.stroke();
  }
  ctx.restore();
  ctx.fillStyle="rgba(255,255,255,.55)";ctx.font="10px sans-serif";ctx.textAlign="center";
  ctx.fillText("Lv"+s.stage,s.x,s.y-22);
}
function drawPlayer(P){
  const t=G.time;
  const ang=dirAngle(P.dirIdx);
  const v=DIRS[P.dirIdx];
  const moving=Math.hypot((P.tx+0.5)*TILE-P.x,(P.ty+0.5)*TILE-P.y)>2;
  const bob=moving?Math.sin(t*16)*2:Math.sin(t*3)*1.5;
  const flash=P.hitT>0;
  ctx.save();
  // 向いているマスのハイライト(世界座標: 常に正確な対象マス)
  ctx.fillStyle="rgba(255,210,90,.10)";
  ctx.fillRect((P.tx+v[0])*TILE+3,(P.ty+v[1])*TILE+3,TILE-6,TILE-6);
  ctx.translate(P.x,P.y);
  ctx.fillStyle="rgba(0,0,0,.35)";
  ctx.beginPath();ctx.ellipse(0,10,12,5,0,0,Math.PI*2);ctx.fill();
  const im=spriteFrame(SAVE.job+".png",SAVE.job+"_walk.png",moving);
  const s=34;
  if(im&&im._ok){
    const flip=DIRS[P.dirIdx][0]<0?-1:1;
    ctx.save();
    if(flash)ctx.filter="brightness(0.6)";
    ctx.translate(0,bob);
    ctx.scale(flip,1);
    ctx.drawImage(im,-s/2,-s/2,s,s);
    ctx.restore();
  }else{
    ctx.save();
    ctx.translate(0,bob);
    ctx.fillStyle=flash?"#fff":"#5a8ad0";
    ctx.beginPath();ctx.arc(0,0,13,0,Math.PI*2);ctx.fill();
    ctx.restore();
  }
  // 向きを示す矢印(スプライトのscale空間の外で描画)
  ctx.rotate(ang);
  ctx.fillStyle="rgba(255,215,122,.8)";
  ctx.beginPath();
  ctx.moveTo(26,0);ctx.lineTo(19,-5);ctx.lineTo(19,5);
  ctx.closePath();ctx.fill();
  ctx.rotate(-ang);
  if(P.swing>0){
    const prog=1-P.swing/0.22;
    const a=ang-1.2+prog*2.4;

function canvasPos(cx,cy){
  const r=cv.getBoundingClientRect();
  return {x:(cx-r.left)/r.width*W,y:(cy-r.top)/r.height*H};
}
cv.addEventListener("touchstart",function(e){
  e.preventDefault();
  IS_TOUCH=true;
  for(const t of e.changedTouches){
    const p=canvasPos(t.clientX,t.clientY);
    mouse.x=t.clientX;mouse.y=t.clientY;
    let used=false;
    for(const b of ABTN){
      if(TOUCH.btn[b.k]===undefined&&Math.hypot(p.x-b.x,p.y-b.y)<=b.r+10){
        TOUCH.btn[b.k]=t.identifier;
        if(b.k==="wait"){
          if(G.screen==="dungeon"&&TURN.phase==="player")endPlayerTurn();
        }else if(b.k==="bag"){
          if(G.screen==="dungeon"||G.screen==="town")toggleBag();
        }else{
          VK[b.k]=1;mergeVK();
        }
        used=true;break;
      }
    }
    if(used)continue;
    if(G.screen!=="dungeon"){
      for(const pd of PADMENU){
        if(TOUCH.pad[pd.k]===undefined&&Math.hypot(p.x-pd.x2,p.y-pd.y2)<=34){
          TOUCH.pad[pd.k]=t.identifier;
          VK[pd.k]=1;mergeVK();
          used=true;break;
        }
      }
    }
    if(used)continue;
    if(G.screen==="dungeon"){
      for(const pd of PAD8POS){
        if(TOUCH.pad8[pd.i]===undefined&&Math.hypot(p.x-pd.x,p.y-pd.y)<=pd.r+10){
          TOUCH.pad8[pd.i]=t.identifier;
          pad8Press(pd);
          used=true;break;
        }
      }
    }
    if(used)continue;
    if(JOY.id===-1&&Math.hypot(p.x-JOY.bx,p.y-JOY.by)<=110){
      JOY.id=t.identifier;
      joyMove(p.x,p.y);
      continue;
    }
    if(G.screen==="town"&&TOWN.hover){
      townActivate(TOWN.hover);
      window.SUPCLICK=true;
    }
  }
},{passive:false});
function joyMove(x,y){
  let dx=x-JOY.bx,dy=y-JOY.by;
  const d=Math.hypot(dx,dy);
  if(d>JOY.r){dx=dx/d*JOY.r;dy=dy/d*JOY.r;}
  JOY.kx=dx;JOY.ky=dy;
  if(G.screen!=="dungeon")joySet(dx,dy);
}
cv.addEventListener("touchmove",function(e){
  e.preventDefault();
  for(const t of e.changedTouches){
    if(JOY.id===t.identifier){
      const p=canvasPos(t.clientX,t.clientY);
      joyMove(p.x,p.y);
    }
  }
},{passive:false});
function touchEnd(e){
  for(const t of e.changedTouches){
    if(JOY.id===t.identifier){joyRelease();continue;}
    for(const k in TOUCH.btn){
      if(TOUCH.btn[k]===t.identifier){
        TOUCH.btn[k]=undefined;
        if(k!=="wait"&&k!=="bag"){VK[k]=0;mergeVK();}
      }
    }
    for(const k in TOUCH.pad){
      if(TOUCH.pad[k]===t.identifier){TOUCH.pad[k]=undefined;VK[k]=0;mergeVK();}
    }
    for(const k in TOUCH.pad8){
      if(TOUCH.pad8[k]===t.identifier){
        TOUCH.pad8[k]=undefined;
        const b=PAD8POS[+k];
        if(b)pad8Release(b);
      }
    }
  }
}
cv.addEventListener("touchend",touchEnd,{passive:false});
cv.addEventListener("touchcancel",touchEnd,{passive:false});
function drawTouchUI(){
  if(!IS_TOUCH)return;
  const menu=G.screen!=="dungeon";
  ctx.save();
  const MENU_ANG={up:Math.PI*1.5,down:Math.PI*0.5,left:Math.PI,right:0};
  if(menu){
    for(const pd of PADMENU){
      const on=!!VK[pd.k];
      ctx.fillStyle=on?"rgba(255,210,74,.45)":"rgba(255,255,255,.10)";
      ctx.beginPath();ctx.arc(pd.x2,pd.y2,26,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle="rgba(255,255,255,.35)";ctx.lineWidth=2;ctx.stroke();
      drawPadArrow(pd.x2,pd.y2,16,MENU_ANG[pd.k]);
    }
  }else{
    for(const pd of PAD8POS){
      const on=pd.d.some(function(k){return !!VK[k];});
      ctx.fillStyle=on?"rgba(255,210,74,.45)":"rgba(255,255,255,.10)";
      ctx.beginPath();ctx.arc(pd.x,pd.y,pd.r,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle="rgba(255,255,255,.35)";ctx.lineWidth=2;ctx.stroke();
      drawPadArrow(pd.x,pd.y,14,pd.ang);
    }
  }
  for(const b of ABTN){
    const on=!!VK[b.k];
    ctx.fillStyle=on?"rgba(255,170,50,.5)":"rgba(255,255,255,.10)";
    ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle="rgba(255,255,255,.35)";ctx.lineWidth=2;ctx.stroke();
    ctx.fillStyle="rgba(255,255,255,.9)";
    ctx.font="bold "+(b.r>36?20:14)+"px sans-serif";
    ctx.textAlign="center";ctx.textBaseline="middle";
    ctx.fillText(b.lb,b.x,b.y+1);
  }
  const act=JOY.id!==-1;
  ctx.fillStyle="rgba(255,255,255,.07)";
  ctx.beginPath();ctx.arc(JOY.bx,JOY.by,JOY.r,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle="rgba(255,255,255,.25)";ctx.lineWidth=2;ctx.stroke();
  ctx.fillStyle=act?"rgba(255,210,74,.55)":"rgba(255,255,255,.18)";
  ctx.beginPath();ctx.arc(JOY.bx+JOY.kx,JOY.by+JOY.ky,24,0,Math.PI*2);ctx.fill();
  ctx.restore();
}

// ============================================================
// メインループ
// ============================================================
let lastT=0;
function loop(ts){
  const dt=Math.min(0.05,(ts-lastT)/1000||0.016);
  lastT=ts;
  FRAME_DT=dt;
  mergeVK();
  update(dt);
  draw();
  if(IS_TOUCH)drawTouchUI();
  syncKeys();
  requestAnimationFrame(loop);
}
function boot(){
  const s=loadSave();
  SAVE=s;
  setupTown();
  if(SAVE)UI.toast("セーブデータを読み込んだ");
  playBGM("bgm_title.ogg");
  requestAnimationFrame(loop);
}
boot();
</script>
